services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet
      POSTGRES_DB: intranet
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intranet -d intranet"]
      interval: 2s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://intranet:intranet@postgres:5432/intranet?sslmode=disable"
      PUBLIC_BASE_URL: "http://localhost:8000"
      # Leave SMTP_HOST unset to log sign-in emails to `docker compose logs api`
      # instead of sending them for real.
      LIBRARY_ROOT: "/data/library"
    volumes:
      # Club documents (estatutos, actas...) for every socio to browse —
      # drop files straight into ./library on the host, no rebuild or
      # restart needed. Created automatically on first run if missing.
      - ./library:/data/library
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    volumes:
      - ./web:/srv
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
    ports:
      - "8000:8000"

volumes:
  postgres_data:
