services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet
      POSTGRES_DB: intranet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://intranet:intranet@postgres:5432/intranet?sslmode=disable"
      JWT_SECRET: "change-me-to-a-long-random-string"
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  web:
    image: caddy:2-alpine
    volumes:
      - ./web:/srv
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
    ports:
      - "8000:8000"

volumes:
  postgres_data:
