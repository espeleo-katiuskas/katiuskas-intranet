services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intranet
      POSTGRES_PASSWORD: intranet
      POSTGRES_DB: intranet
    # Bound to localhost only: this has dev-grade credentials and no TLS,
    # so it must never be reachable from outside the host — use a proper
    # reverse proxy (with real auth/TLS) if remote access is ever needed.
    ports:
      - "127.0.0.1:64712:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intranet -d intranet"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":64711"
      DATABASE_URL: "postgres://intranet:intranet@postgres:5432/intranet?sslmode=disable"
      PUBLIC_BASE_URL: "http://localhost:64710"
      # Leave SMTP_HOST unset to log sign-in emails to `docker compose logs api`
      # instead of sending them for real. Same story for
      # TELEGRAM_BOT_TOKEN/TELEGRAM_LOG_CHAT_ID: unset, error-level logs,
      # logins, and POST/PUT/PATCH/DELETE API calls all just log normally
      # instead of also being forwarded to Telegram, and the bot
      # (internal/telegrambot) never starts polling at all.
      LIBRARY_ROOT: "/data/library"
      USER_FILES_ROOT: "/data/user-files"
      ACTIVITY_RESOURCES_ROOT: "/data/activity-resources"
    volumes:
      # Club documents (estatutos, actas...) for every socio to browse —
      # drop files straight into ./library on the host, no rebuild or
      # restart needed. Created automatically on first run if missing.
      - ./library:/data/library
      # Per-person documents (a scanned DNI, a signed waiver...) — drop
      # files into ./user-files/<login>/ on the host, one subdirectory
      # per login, same no-rebuild-needed story as ./library above.
      - ./user-files:/data/user-files
      # A memoria's uploaded files (photos, PDFs...) — unlike the two
      # above, these arrive exclusively through the API (POST
      # /activities/{id}/resources), never by hand, so a named volume
      # is a better fit than a host bind mount: nobody needs host-side
      # access to browse or drop files into it directly.
      - activity_resources_data:/data/activity-resources
    depends_on:
      postgres:
        condition: service_healthy
    # Bound to localhost only: plain HTTP, no TLS — see the postgres
    # service's comment above. Put a reverse proxy in front for anything
    # beyond local use.
    ports:
      - "127.0.0.1:64711:64711"
    restart: unless-stopped

  web:
    image: caddy:2-alpine
    volumes:
      - ./web:/srv
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
    # Bound to localhost only — same reasoning as the other two services.
    ports:
      - "127.0.0.1:64710:64710"
    restart: unless-stopped

volumes:
  postgres_data:
  activity_resources_data:
