<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="columns">
        <div class="col-main">
          <!-- Los datos (nombre, NIF, dirección, cuentas…) vienen de la base de datos (GET /club-info) y los edita
               un administrador desde /admin: no están escritos aquí. -->
          <h2>Datos de interés</h2>
          <div class="info-card">
            <dl class="info-list" id="club-info-list"><div class="info-row"><dt>Cargando…</dt></div></dl>
          </div>

          <h2>Junta directiva</h2>
          <div class="board-grid" id="board-grid"></div>
        </div>

        <!-- Documentos, Actas y Memorias se cargan dinámicamente desde
             /archivo (ver js/dashboard.js) — cada uno es una carpeta
             con los PDF directamente dentro (library/Documentos,
             library/Actas, library/Memorias) y un .order.json opcional
             para fijar el orden de aparición, que aplica la propia API. -->
        <aside class="col-side">
          <h2>Documentos</h2>
          <div class="info-card">
            <ul class="link-list" id="documentos-list"></ul>
          </div>

          <h2>Actas asambleas</h2>
          <div class="info-card">
            <label for="actas-year">Año</label>
            <select id="actas-year" class="year-select"></select>
            <ul class="link-list" id="actas-list"></ul>
          </div>

          <h2>Memorias de actividades</h2>
          <div class="info-card">
            <p class="year-list" id="memorias-list"></p>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
