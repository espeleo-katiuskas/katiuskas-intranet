<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="columns">
        <div class="col-main">
          <h2>Datos de interés</h2>
          <div class="info-card">
            <dl class="info-list">
              <div class="info-row">
                <dt>Nombre</dt>
                <dd>Club Deportivo Elemental de Espeleología Katiuskas</dd>
              </div>
              <div class="info-row">
                <dt>NIF</dt>
                <dd>
                  G-81622987
                  <button type="button" class="link-pill link-pill-small" data-copy="G81622987">Copiar NIF</button>
                </dd>
              </div>
              <div class="info-row">
                <dt>Dirección</dt>
                <dd>Polideportivo Los Rosales sala 2. C/ Lilas, s/n</dd>
              </div>
              <div class="info-row">
                <dt>Cuenta bancaria</dt>
                <dd>
                  IBAN: ES75-0073-0100-5305-0580-2942 (Openbank)
                  <button type="button" class="link-pill link-pill-small" data-copy="ES7500730100530505802942">Copiar IBAN</button>
                </dd>
              </div>
            </dl>
          </div>

          <h2>Junta directiva</h2>
          <div class="board-grid" id="board-grid"></div>
        </div>

        <!-- Documentos, Actas y Memorias se cargan dinámicamente desde
             /library (ver js/dashboard.js) — cada uno es una carpeta
             con los PDF directamente dentro (library/documentos,
             library/actas, library/memorias) y un .order.json opcional
             para fijar el orden de aparición. -->
        <aside class="col-side">
          <h2>Documentos</h2>
          <div class="info-card">
            <ul class="link-list" id="documentos-list"></ul>
          </div>

          <h2>Actas asambleas</h2>
          <div class="info-card">
            <label for="actas-year">Año</label>
            <select id="actas-year" class="year-select"></select>
            <ul class="link-list" id="actas-list"></ul>
          </div>

          <h2>Memorias de actividades</h2>
          <div class="info-card">
            <p class="year-list" id="memorias-list"></p>
          </div>
        </aside>
      </div>
    </main>
  </div>
</div>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
