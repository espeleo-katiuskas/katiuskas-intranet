<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivo — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <h1>Archivo</h1>
  <p class="subtitle">
    Estatutos, reglamentos, normativas, memorias de actividades y actas de reuniones del
    club.
  </p>

  <p id="feedback" class="success-message" hidden></p>

  <nav id="breadcrumbs" class="breadcrumbs"></nav>

  <div id="directory-view">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Nombre</th><th>Tamaño</th><th>Modificado</th></tr>
        </thead>
        <tbody id="entries-list"></tbody>
      </table>
    </div>
  </div>

  <div id="file-view" hidden>
    <div class="section-header">
      <h2 id="file-name"></h2>
      <div class="panel-actions">
        <button id="file-download" type="button" class="btn btn-secondary btn-small">Descargar</button>
        <button id="file-back" type="button" class="btn btn-secondary btn-small">Volver a la carpeta</button>
      </div>
    </div>
    <p class="subtitle" id="file-meta"></p>
    <div id="file-preview"></div>
  </div>
    </main>
  </div>
</div>
<script type="module" src="js/archive.js"></script>
</body>
</html>
