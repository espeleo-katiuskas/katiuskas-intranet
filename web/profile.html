<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi perfil — Intranet del club</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <span class="brand">Intranet del club</span>
  <nav class="main-nav">
    <a href="index.html">Inicio</a>
    <a href="members.html" data-roles="admin,board">Socios</a>
    <a href="activities.html">Actividades</a>
    <a href="inventory.html">Material</a>
    <a href="profile.html" class="active">Mi perfil</a>
    <button id="logout-button" type="button" class="link-button">Cerrar sesión</button>
  </nav>
</header>
<main>
  <h1 id="profile-name">Mi perfil</h1>
  <p class="subtitle" id="profile-email"></p>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <div class="panel">
    <h3>Mis datos</h3>
    <p class="hint">Mantén tus datos al día: el club los usa para el registro de socios y, si hace falta, en caso de emergencia.</p>
    <form id="edit-profile-form">
      <div class="field-grid">
        <div class="field">
          <label for="ep-first-name">Nombre</label>
          <input id="ep-first-name" name="first_name" type="text" required>
        </div>
        <div class="field">
          <label for="ep-last-name">Apellidos</label>
          <input id="ep-last-name" name="last_name" type="text" required>
        </div>
        <div class="field">
          <label for="ep-email">Email</label>
          <input id="ep-email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="ep-phone">Teléfono</label>
          <input id="ep-phone" name="phone" type="tel">
        </div>
        <div class="field">
          <label for="ep-national-id">DNI</label>
          <input id="ep-national-id" name="national_id" type="text">
        </div>
        <div class="field">
          <label for="ep-birth-date">Fecha de nacimiento</label>
          <input id="ep-birth-date" name="birth_date" type="date">
        </div>
        <div class="field span-2">
          <label for="ep-address">Dirección</label>
          <input id="ep-address" name="address" type="text">
        </div>
        <div class="field">
          <label for="ep-postal-code">Código postal</label>
          <input id="ep-postal-code" name="postal_code" type="text">
        </div>
        <div class="field">
          <label for="ep-city">Ciudad</label>
          <input id="ep-city" name="city" type="text">
        </div>
        <div class="field">
          <label for="ep-province">Provincia</label>
          <input id="ep-province" name="province" type="text">
        </div>
        <div class="field span-2">
          <label for="ep-emergency-contact">Contacto de emergencia</label>
          <textarea id="ep-emergency-contact" name="emergency_contact" placeholder="Nombre, teléfono, correo... uno o varios contactos"></textarea>
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>

  <h2>Historial como socio</h2>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Alta</th><th>Baja</th></tr></thead>
      <tbody id="memberships-table-body"></tbody>
    </table>
  </div>
</main>
<script type="module" src="js/profile.js"></script>
</body>
</html>
