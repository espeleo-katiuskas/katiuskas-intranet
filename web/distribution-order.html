<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen del pedido — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <p><a id="back-link" href="/distributions">&larr; Volver al reparto</a></p>
  <h1 id="order-title">Resumen del pedido</h1>
  <p class="subtitle" id="order-meta"></p>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <div class="section-header">
    <div>
      <h2>Qué hay que pedir</h2>
      <p class="subtitle" id="order-totals"></p>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Lo elegido</th><th>Unidades</th></tr></thead>
      <tbody id="order-lines"><tr><td colspan="2">Cargando…</td></tr></tbody>
    </table>
  </div>

  <div id="pending-section" hidden>
    <div class="section-header">
      <div>
        <h2>Sin elegir</h2>
        <p class="subtitle" id="pending-subtitle"></p>
      </div>
    </div>
    <p id="pending-list"></p>
  </div>

  <div class="section-header">
    <div>
      <h2>Qué quiere cada socio</h2>
      <p class="subtitle" id="people-subtitle">Cada unidad con quién la apuntó, y si está pagada.</p>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Socio</th><th>Unidades</th><th>Importe</th><th>Pago</th></tr></thead>
      <tbody id="people-list"><tr><td colspan="4">Cargando…</td></tr></tbody>
    </table>
  </div>
    </main>
  </div>
</div>
<script type="module" src="js/distribution-order.js"></script>
</body>
</html>
