<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagos del reparto — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <p><a id="back-link" href="/repartos">&larr; Volver al reparto</a></p>
  <h1 id="payments-title">Pagos</h1>
  <p class="subtitle" id="payments-meta">Lo que se ha ido cobrando en este reparto, con lo cobrado hasta ese momento.</p>

  <p id="feedback" class="success-message" hidden></p>

  <div class="panel">
    <div class="field-grid">
      <div class="field">
        <label for="filter-from">Desde</label>
        <input id="filter-from" type="date">
      </div>
      <div class="field">
        <label for="filter-to">Hasta</label>
        <input id="filter-to" type="date">
      </div>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="nowrap">Fecha</th><th>Apuntado por</th><th>Qué</th><th>Pagado por</th>
          <th class="nowrap">Importe</th><th class="nowrap">Acumulado</th>
        </tr>
      </thead>
      <tbody id="payments-list"><tr><td colspan="6">Cargando…</td></tr></tbody>
    </table>
  </div>
  <p><button id="load-more" type="button" class="btn btn-secondary btn-small" hidden>Ver más</button></p>
    </main>
  </div>
</div>
<script type="module" src="js/distribution-payments.js"></script>
</body>
</html>
