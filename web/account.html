<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta — Club de Espeleología Katiuskas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <p><a href="/accounting">&larr; Volver a Contabilidad</a></p>
  <div class="section-header">
    <div>
      <h1 id="account-title">Cuenta</h1>
      <p class="subtitle" id="account-balance-line"></p>
    </div>
    <button id="toggle-new-transaction" type="button" class="btn btn-secondary btn-small">+ Nueva transacción</button>
  </div>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <div id="new-transaction-panel" class="panel" hidden>
    <h3>Nueva transacción</h3>
    <p class="hint">Se crean dos apuntes: uno en esta cuenta por la cantidad indicada, y otro en la cuenta elegida por la cantidad opuesta.</p>
    <form id="new-transaction-form">
      <div class="field-grid">
        <div class="field">
          <label for="nt-date">Fecha</label>
          <input id="nt-date" name="occurred_at" type="date" required>
        </div>
        <div class="field span-2">
          <label for="nt-description">Descripción</label>
          <input id="nt-description" name="description" type="text" required>
        </div>
        <div class="field">
          <label for="nt-amount">Cantidad en esta cuenta</label>
          <input id="nt-amount" name="amount" type="number" step="0.01" required>
          <p class="hint">Positiva si entra en esta cuenta, negativa si sale.</p>
        </div>
        <div class="field">
          <label for="nt-other-account">Otra cuenta</label>
          <select id="nt-other-account" name="other_account_id" required></select>
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Crear transacción</button>
        <button id="cancel-new-transaction" type="button" class="btn btn-secondary">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Fecha</th><th>Descripción</th><th>Importe</th><th>Saldo</th></tr>
      </thead>
      <tbody id="entries-table-body"></tbody>
    </table>
  </div>
    </main>
  </div>
</div>
<script type="module" src="js/account.js"></script>
</body>
</html>
