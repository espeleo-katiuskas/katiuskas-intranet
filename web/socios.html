<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socios — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <p id="feedback" class="success-message" hidden></p>

  <div class="section-header">
    <h1>Socios</h1>
    <button id="toggle-new-person" type="button" class="btn btn-secondary btn-small" data-roles="admin">+ Nueva persona</button>
  </div>
  <dialog id="new-person-dialog" class="panel modal" data-roles="admin">
    <button type="button" class="modal-close" data-modal-close aria-label="Cerrar">&times;</button>
    <h3>Nueva persona</h3>
    <p class="hint">
      No hay contraseñas: para entrar, pedirá un enlace de un solo uso desde la página
      de acceso con su correo y su teléfono. Si no le pones teléfono, no podrá entrar
      hasta que se lo añadas.
    </p>
    <p class="hint">
      Si es un nuevo socio, indica su fecha de alta y se le dará de alta automáticamente.
    </p>
    <form id="new-person-form" autocomplete="off">
      <div class="field-grid">
        <div class="field">
          <label for="np-first-name">Nombre</label>
          <input id="np-first-name" name="first_name" type="text" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="np-last-name">Apellidos</label>
          <input id="np-last-name" name="last_name" type="text" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="np-email">Email <span class="optional">(opcional)</span></label>
          <input id="np-email" name="email" type="text" autocomplete="off" placeholder="correo@ejemplo.com otro@ejemplo.com">
        </div>
        <div class="field">
          <label for="np-phone">Teléfono <span class="optional">(opcional)</span></label>
          <input id="np-phone" name="phone" type="tel" autocomplete="off" placeholder="600111222 622333444 (sin espacios dentro de cada uno)">
        </div>
        <div class="field">
          <label for="np-national-id">DNI <span class="optional">(opcional)</span></label>
          <input id="np-national-id" name="national_id" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="np-birth-date">Fecha de nacimiento</label>
          <input id="np-birth-date" name="birth_date" type="date" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="np-gender">Género <span class="optional">(opcional)</span></label>
          <select id="np-gender" name="gender" autocomplete="off">
            <option value="">Sin especificar</option>
            <option value="male">Masculino</option>
            <option value="female">Femenino</option>
          </select>
        </div>
        <div class="field span-2">
          <label for="np-address">Dirección <span class="optional">(opcional)</span></label>
          <input id="np-address" name="address" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="np-postal-code">Código postal <span class="optional">(opcional)</span></label>
          <input id="np-postal-code" name="postal_code" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="np-city">Ciudad <span class="optional">(opcional)</span></label>
          <input id="np-city" name="city" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label for="np-province">Provincia <span class="optional">(opcional)</span></label>
          <input id="np-province" name="province" type="text" autocomplete="off">
        </div>
        <div class="field span-2">
          <label for="np-emergency-contact">Contacto de emergencia <span class="optional">(opcional)</span></label>
          <textarea id="np-emergency-contact" name="emergency_contact" autocomplete="off" placeholder="Nombre, teléfono, correo... uno o varios contactos"></textarea>
        </div>
        <div class="field">
          <label for="np-membership-start-date">Fecha de alta <span class="optional">(opcional)</span></label>
          <input id="np-membership-start-date" name="membership_start_date" type="date" autocomplete="off">
        </div>
        <div class="field span-2">
          <label>Roles</label>
          <div id="np-roles-group" class="role-checkbox-group"></div>
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Crear persona</button>
        <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
      </div>
    </form>
  </dialog>
  <div class="field" id="people-search-field">
    <label for="people-search">Buscar persona</label>
    <input id="people-search" type="search" autocomplete="off" placeholder="Nombre, apellidos, número de socio…">
  </div>
  <button id="toggle-filters" type="button" class="btn btn-secondary btn-small">Filtros…</button>
  <div id="filters-panel" hidden>
    <div class="filter-groups" id="row-filters"></div>
    <div class="role-checkbox-group" id="column-toggle"></div>
  </div>
  <p id="people-count" class="people-count" aria-live="polite" hidden></p>
  <div class="table-wrap">
    <table>
      <thead>
        <tr id="users-table-head"></tr>
      </thead>
      <tbody id="users-table-body" class="clickable-rows"></tbody>
    </table>
  </div>
    </main>
  </div>
</div>
<script type="module" src="js/members.js"></script>
</body>
</html>
