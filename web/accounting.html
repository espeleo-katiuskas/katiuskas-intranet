<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contabilidad — Club de Espeleología Katiuskas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <div class="section-header">
    <div>
      <h1>Contabilidad</h1>
      <p class="subtitle">Plan de cuentas del club, en árbol, con el saldo de cada una.</p>
    </div>
    <button id="toggle-new-account" type="button" class="btn btn-secondary btn-small">+ Nueva cuenta</button>
  </div>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <dialog id="new-account-dialog" class="panel modal">
    <button type="button" class="modal-close" data-modal-close aria-label="Cerrar">&times;</button>
    <h3>Nueva cuenta</h3>
    <form id="new-account-form">
      <div class="field-grid">
        <div class="field">
          <label for="na-name">Nombre</label>
          <input id="na-name" name="name" type="text" required>
        </div>
        <div class="field">
          <label for="na-code">Código <span class="optional">(opcional)</span></label>
          <input id="na-code" name="code" type="text">
        </div>
        <div class="field">
          <label for="na-parent">Cuenta superior <span class="optional">(opcional)</span></label>
          <select id="na-parent" name="parent_id"></select>
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
        <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="edit-account-dialog" class="panel modal">
    <button type="button" class="modal-close" data-modal-close aria-label="Cerrar">&times;</button>
    <h3>Editar cuenta</h3>
    <form id="edit-account-form">
      <div class="field-grid">
        <div class="field">
          <label for="ea-name">Nombre</label>
          <input id="ea-name" type="text" required>
        </div>
        <div class="field">
          <label for="ea-code">Código <span class="optional">(opcional)</span></label>
          <input id="ea-code" type="text">
        </div>
        <div class="field">
          <label for="ea-parent">Cuenta superior <span class="optional">(opcional)</span></label>
          <select id="ea-parent"></select>
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
      </div>
    </form>
  </dialog>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Cuenta</th><th>Código</th><th>Saldo</th><th>Último movimiento</th><th></th></tr>
      </thead>
      <tbody id="accounts-table-body"></tbody>
    </table>
  </div>
    </main>
  </div>
</div>
<script type="module" src="js/accounting.js"></script>
</body>
</html>
