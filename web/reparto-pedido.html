<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumen del pedido — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <p><a id="back-link" href="/repartos">&larr; Volver al reparto</a></p>
  <h1 id="order-title">Resumen del pedido</h1>
  <p class="subtitle" id="order-meta"></p>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <div class="section-header">
    <div>
      <h2>Qué hay que pedir</h2>
      <p class="subtitle" id="order-totals"></p>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr id="order-head"><th>Lo elegido</th><th>Unidades</th></tr></thead>
      <tbody id="order-lines"><tr><td colspan="2">Cargando…</td></tr></tbody>
    </table>
  </div>

  <div class="section-header">
    <div>
      <h2>Qué quiere cada socio</h2>
      <p class="subtitle" id="people-subtitle">Cada pedido, con quién lo apuntó cuando no es para sí mismo, y si está pagado. Se puede cambiar o quitar el de cualquiera.</p>
    </div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Socio</th><th>Unidades</th><th>Importe</th><th>Pago</th></tr></thead>
      <tbody id="people-list"><tr><td colspan="4">Cargando…</td></tr></tbody>
    </table>
  </div>

  <dialog id="edit-unit-dialog" class="panel modal">
    <button type="button" class="modal-close" data-modal-close aria-label="Cerrar">&times;</button>
    <h3 id="edit-unit-title">Cambiar el pedido</h3>
    <p class="hint" id="edit-unit-hint"></p>
    <form id="edit-unit-form">
      <div id="eu-options" class="field-grid"></div>
      <div class="field" id="eu-quantity-field" hidden>
        <label for="eu-quantity">Cantidad</label>
        <input id="eu-quantity" type="number" min="1" max="100000" step="1">
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <button type="button" class="btn btn-secondary" data-modal-close>Cancelar</button>
      </div>
    </form>
  </dialog>
    </main>
  </div>
</div>
<script type="module" src="js/distribution-order.js"></script>
</body>
</html>
