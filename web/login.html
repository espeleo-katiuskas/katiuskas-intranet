<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acceso — Intranet del club</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div id="consuming-panel" class="form-panel" hidden>
    <h1>Intranet del club</h1>
    <p class="subtitle" id="consuming-message">Comprobando el enlace de acceso…</p>
  </div>

  <form id="request-form" class="form-panel">
    <h1>Intranet del club</h1>
    <p class="subtitle">
      Escribe tu correo y tu teléfono. Si coinciden con los de una persona con acceso,
      te enviaremos un enlace para entrar sin contraseña.
    </p>
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="phone">Teléfono</label>
    <input id="phone" name="phone" type="tel" autocomplete="tel" required>
    <button type="submit">Enviar enlace de acceso</button>
    <p id="request-feedback" class="success-message" hidden></p>
    <p id="request-error" class="error-message" hidden></p>
  </form>
</main>
<script type="module" src="js/auth.js"></script>
</body>
</html>
