<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad — Club de Espeleología Katiuskas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="https://katiuskas.es/" target="_blank" rel="noopener">Club de Espeleología Katiuskas</a>
  <nav class="main-nav">
    <a href="/">Inicio</a>
    <a href="/members" data-roles="admin,board,member">Socios</a>
    <a href="/activities" class="active">Actividades</a>
    <a href="/inventory">Material</a>
    <a href="/library">Documentos</a>
    <a href="/profile">Mi perfil</a>
    <button id="logout-button" type="button" class="link-button">Cerrar sesión</button>
  </nav>
</header>
<main>
  <p><a href="/activities">&larr; Volver a actividades</a></p>
  <h1 id="activity-title">Actividad</h1>
  <p class="subtitle" id="activity-meta"></p>
  <p id="activity-description"></p>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <div class="panel-actions">
    <button id="join-activity" type="button" class="btn btn-secondary btn-small" hidden>Apuntarme</button>
    <button id="leave-activity" type="button" class="btn btn-secondary btn-small" hidden>Darme de baja</button>
  </div>

  <div class="panel" id="edit-activity-panel" hidden>
    <h3>Editar</h3>
    <form id="edit-activity-form">
      <div class="field-grid">
        <div class="field span-2">
          <label for="ea-title">Título</label>
          <input id="ea-title" name="title" type="text" required>
        </div>
        <div class="field">
          <label for="ea-type">Tipo</label>
          <select id="ea-type" name="type">
            <option value="caving">Espeleología</option>
            <option value="canyoning">Cañones</option>
            <option value="training">Formación</option>
            <option value="social">Social</option>
            <option value="other">Otro</option>
          </select>
        </div>
        <div class="field">
          <label for="ea-start-date">Fecha de inicio</label>
          <input id="ea-start-date" name="start_date" type="date" required>
        </div>
        <div class="field">
          <label for="ea-end-date">Fecha de fin</label>
          <input id="ea-end-date" name="end_date" type="date" required>
        </div>
        <div class="field">
          <label for="ea-status">Estado</label>
          <select id="ea-status" name="status">
            <option value="planned">Planificada</option>
            <option value="completed">Realizada</option>
            <option value="cancelled">Cancelada</option>
          </select>
        </div>
        <div class="field">
          <label for="ea-visibility">Visibilidad</label>
          <select id="ea-visibility" name="visibility">
            <option value="public">Pública</option>
            <option value="private">Privada</option>
          </select>
        </div>
        <div class="field" data-roles="admin,board">
          <label for="ea-leader">Organizador</label>
          <input id="ea-leader" type="text" list="ea-leader-options" autocomplete="off" placeholder="Escribe un nombre…">
          <datalist id="ea-leader-options"></datalist>
        </div>
        <div class="field span-2">
          <label for="ea-description">Descripción</label>
          <textarea id="ea-description" name="description"></textarea>
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>

  <div class="section-header">
    <h2>Participantes</h2>
  </div>
  <div class="detail-list" id="participants-list"></div>
  <div class="role-add-row" id="add-participant-row" hidden>
    <input type="text" id="participant-search" list="participant-options" autocomplete="off" placeholder="Escribe un nombre…">
    <datalist id="participant-options"></datalist>
    <button type="button" id="add-participant" class="btn btn-secondary btn-small">+ Participante</button>
  </div>

  <div class="section-header" data-roles="admin,board,material">
    <h2>Material prestado</h2>
  </div>
  <div class="table-wrap" data-roles="admin,board,material">
    <table>
      <thead>
        <tr><th>Material</th><th>Socio</th><th>Pendiente / total</th><th></th></tr>
      </thead>
      <tbody id="activity-loans-table-body"></tbody>
    </table>
  </div>
  <div class="panel" data-roles="admin,board,material">
    <h3>Registrar préstamo</h3>
    <form id="new-loan-form">
      <div class="field-grid">
        <div class="field">
          <label for="loan-item">Material</label>
          <input id="loan-item" type="text" list="loan-item-options" autocomplete="off" placeholder="Escribe para buscar…">
          <datalist id="loan-item-options"></datalist>
        </div>
        <div class="field">
          <label for="loan-user">Socio <span class="optional">(opcional)</span></label>
          <input id="loan-user" type="text" list="loan-user-options" autocomplete="off" placeholder="Escribe un nombre…">
          <datalist id="loan-user-options"></datalist>
        </div>
        <div class="field" id="loan-quantity-field">
          <label for="loan-quantity">Cantidad</label>
          <input id="loan-quantity" type="number" min="1" value="1">
        </div>
        <div class="field span-2">
          <label for="loan-notes">Notas <span class="optional">(opcional)</span></label>
          <input id="loan-notes" type="text" placeholder="Motivo, contexto…">
        </div>
      </div>
      <div class="panel-actions">
        <button type="submit" class="btn btn-primary btn-small">Registrar préstamo</button>
      </div>
    </form>
  </div>

</main>
<script type="module" src="js/activity.js"></script>
<footer class="site-footer">Club de Espeleología Katiuskas · más información en <a href="https://katiuskas.es/" target="_blank" rel="noopener">katiuskas.es</a></footer>
</body>
</html>
