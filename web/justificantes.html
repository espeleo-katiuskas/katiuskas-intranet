<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justificantes — Club de Espeleología Katiuskas</title>
<link rel="icon" type="image/png" href="/images/logo-katiuskas.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-column">
    <header class="topbar" id="topbar"></header>
    <main class="content">
  <p><a href="/contabilidad">&larr; Volver a contabilidad</a></p>
  <div class="section-header">
    <div>
      <h1>Justificantes</h1>
      <p class="subtitle">Los ficheros (tickets, facturas…) adjuntos a las transacciones, con los datos de cada una.</p>
    </div>
  </div>

  <p class="filter-bar">
    <label for="year-filter">Año</label>
    <select id="year-filter"></select>
  </p>

  <p id="feedback" class="success-message" hidden></p>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th class="nowrap">Fecha</th><th>Transacción</th><th class="nowrap">Importe</th><th>Cuentas</th><th>Fichero</th></tr>
      </thead>
      <tbody id="files-table-body"></tbody>
    </table>
  </div>
  <p id="files-empty" class="hint" hidden>No hay ficheros adjuntos.</p>
  <p><button id="files-load-more" type="button" class="btn btn-secondary btn-small" hidden>Ver más</button></p>
    </main>
  </div>
</div>
<script type="module" src="js/transactionFilesPage.js"></script>
</body>
</html>
