<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivo — Club de Espeleología Katiuskas</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar">
    <nav class="sidebar-nav" id="sidebar-nav">
      <a href="/"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9.5a.5.5 0 0 0 .5.5H10v-6h4v6h3.5a.5.5 0 0 0 .5-.5V10"/></svg>Inicio</a>
      <a href="/members" data-roles="admin,board,member"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="7.5" r="3"/><path d="M3 19c0-3.3 2.5-6 5.5-6s5.5 2.7 5.5 6"/><circle cx="16.5" cy="8.5" r="2.3"/><path d="M15 12.2c2.6.4 4.5 2.7 4.5 5.8"/></svg>Socios</a>
      <a href="/activities"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>Actividades</a>
      <a href="/inventory"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2 L6 17 Q6 19 8 19 L17.5 19 Q19 19 19 17.5 L19 16.5 Q19 14.7 17.2 14.3 L12.5 13.3 L12 13.13 L12 2 Z"/></svg>Material</a>
      <a href="/library" class="active"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="5" rx="1"/><path d="M4.5 9v9a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V9"/><line x1="10" y1="13" x2="14" y2="13"/></svg>Archivo</a>
      <a href="/profile"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c0-4.1 3.4-7 7.5-7s7.5 2.9 7.5 7"/></svg>Mi perfil</a>
    </nav>
  </aside>
  <div class="main-column">
    <header class="topbar">
      <div class="topbar-brand">
        <button id="sidebar-toggle" type="button" class="sidebar-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">☰</button>
        <img src="images/logo-katiuskas.png" alt="" class="topbar-logo">
        <h1>Club de Espeleología Katiuskas — Intranet</h1>
      </div>
      <div class="topbar-user">
        <span>Hola, <strong id="topbar-user-name">…</strong></span>
        <button id="logout-button" type="button" class="link-button">Cerrar sesión</button>
      </div>
    </header>
    <main class="content">
  <h1>Archivo</h1>
  <p class="subtitle">
    Estatutos, reglamentos, normativas, memorias de actividades y actas de reuniones del
    club.
  </p>

  <p id="feedback" class="success-message" hidden></p>
  <p id="error" class="error-message" hidden></p>

  <nav id="breadcrumbs" class="breadcrumbs"></nav>

  <div id="directory-view">
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Nombre</th><th>Tamaño</th><th>Modificado</th></tr>
        </thead>
        <tbody id="entries-list"></tbody>
      </table>
    </div>
  </div>

  <div id="file-view" hidden>
    <div class="section-header">
      <h2 id="file-name"></h2>
      <div class="panel-actions">
        <button id="file-download" type="button" class="btn btn-secondary btn-small">Descargar</button>
        <button id="file-back" type="button" class="btn btn-secondary btn-small">Volver a la carpeta</button>
      </div>
    </div>
    <p class="subtitle" id="file-meta"></p>
    <div id="file-preview"></div>
  </div>
    </main>
  </div>
</div>
<script type="module" src="js/library.js"></script>
</body>
</html>
