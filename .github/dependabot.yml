version: 2
updates:
  # go.mod has 1 direct dependency (pgx) plus a handful of
  # indirect ones — low-noise on purpose, so a weekly check is enough.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns:
          - '*'

  # Keeps the actions pinned in .github/workflows/ci.yml (checkout,
  # setup-go, setup-python) current without anyone having to remember
  # to bump them by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
