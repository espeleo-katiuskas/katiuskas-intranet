name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a stale run when new commits land on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (vet, build, test)
    runs-on: ubuntu-latest

    # Matches docker-compose.yml's postgres service (same image, same
    # dev-grade credentials) so the test suite runs against the same
    # Postgres version production and local dev use.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intranet
          POSTGRES_PASSWORD: intranet
          POSTGRES_DB: intranet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intranet -d intranet_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        env:
          # internal/testutil.NewTx migrates this database itself (parsing
          # the goose markers directly, no goose binary needed) the first
          # time any test touches it. Without this var set, DB-backed tests
          # just t.Skip instead of failing — see CLAUDE.md.
          TEST_DATABASE_URL: postgres://intranet:intranet@localhost:5432/intranet_test?sslmode=disable
        run: go test ./... -cover

  openapi:
    name: Validate openapi.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - run: pip install pyyaml

      - name: Parse openapi.yaml
        run: python3 -c "import yaml; yaml.safe_load(open('backend/openapi/openapi.yaml'))"
