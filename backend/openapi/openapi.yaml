openapi: 3.0.3
info:
  title: Club de Espeleología Katiuskas — Intranet API
  version: "1.0.0"
  description: >
    REST API for the intranet of Club de Espeleología Katiuskas, a caving
    club (see [katiuskas.es](https://katiuskas.es/)). Consumed by the web
    frontend today and intended for a future mobile app and terminal client
    as well.

    Methods mean the same everywhere. GET reads and changes nothing.
    POST creates a resource in a collection, or runs an action that no
    other method describes. PUT replaces a whole resource (or ordered
    list) at a known URL and is idempotent. PATCH changes only the fields
    that are sent. DELETE removes the resource at the URL, or undoes
    something, and has no body.

    Every endpoint below that requires bearerAuth requires the caller to
    hold at least one of admin, board, or member — this is a floor that
    applies on top of whatever more specific roles an endpoint's own
    description calls out, not a default that gets overridden by them.
    Someone holding only a role outside that set (e.g. "material" with
    no admin/board/member) is refused everywhere, including the
    endpoints that role would otherwise unlock. Since "member" is itself
    computed from an active membership period, this also means access is
    cut off automatically the moment someone's membership lapses.

    A person is never identified by a numeric id anywhere in this API —
    every response and path that names one uses their login instead (a
    unique, admin-editable slug like "maria.garcia"), generated
    automatically when they're created. Every other resource (an
    activity, a license, a token...) still has its own opaque numeric id.

    Dates. Fields documented as `format: date` are sent by clients as
    plain `YYYY-MM-DD`, but the server serializes them in responses as
    RFC 3339 timestamps at midnight UTC (e.g. `2024-03-15T00:00:00Z`),
    because they are Go `time.Time` values; clients should read only the
    first 10 characters. Fields documented as `date-time` (e.g.
    `created_at`, transactions' `occurred_at`) are real timestamps.

    Errors. Every error response has the shape
    `{"error": {"code": "...", "message": "..."}}` (see the Error
    schema). Wherever an endpoint below names a lowercase_snake_case code
    it is the `error.code` value; a malformed JSON body is always
    `400 invalid_body` and an unexpected failure `500 internal_error`,
    neither repeated on every endpoint.
servers:
  - url: /api/v1

paths:
  /health:
    get:
      summary: Process liveness and database connectivity
      description: >
        No auth required — a reverse proxy or systemd unit polling this
        has no session token to send, and there's nothing here worth
        protecting. Returns 200 once the process is up and it can reach
        Postgres (a 2-second ping); 503, same shape, when the database
        isn't reachable within that window.
      responses:
        "200":
          description: The process is up and Postgres is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [ok] }
        "503":
          description: The process is up but Postgres isn't reachable right now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [error] }
                  database: { type: string, enum: [unreachable] }

  /auth/magic-link:
    post:
      summary: Request a sign-in link (and code) by email
      description: >
        There are no passwords in this API, and no separate "granted
        access" step: if email and phone both match someone on file who
        also holds at least one of admin/board/member, they're emailed a
        one-time link (valid 15 minutes) that signs them in via POST
        /auth/magic-link/consume, and — in the same email — a 6-digit
        numeric code that does the same via POST
        /auth/magic-link/consume-code, for signing in on a different
        device than the one the email is read on. Both represent the
        same sign-in attempt: consuming either one also consumes the
        other. Someone matching but holding none of those roles never
        gets an email at all — signing in would leave them unable to
        call anything anyway.

        When the pair matches nobody who can sign in — no one has that
        email and phone together, or the person holds none of the roles
        above — it answers 404 unknown_details, the same in both cases, so
        that a member who mistyped something knows to check it, or to ask
        the board. That lets the endpoint be used to check who has access,
        which the club accepts (the per-address throttle below is what
        keeps it from being scanned); both cases are also reported to the
        administrators' log channel, with what was typed. A match is a 200
        whether or not an email was actually sent (a recent one might
        already be on its way), so the endpoint cannot be used to spam
        someone's inbox. The phone is compared by its digits, and a
        leading "+34" typed in front of it is ignored; the same goes for
        POST /auth/magic-link/consume-code (which still answers the same
        401 whatever is wrong).

        Also throttled per calling address (a coarser backstop above
        the per-person cooldown above, which alone does nothing to slow
        down one address cycling through many different fake email/phone
        guesses): a limit generous enough for a shared address (a
        household, an office) to never notice it in normal use.

        The link in the email points to the public address, except when
        the request was made through exactly local.<that address>
        (X-Forwarded-Host, else Host): then it points there, so that
        opening it on the device that asked finishes the sign-in through
        the local address, whose sessions are short (see
        /auth/magic-link/consume). Any other address a request claims is
        ignored, since it is not something that may decide where an email
        to somebody else points.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone]
              properties:
                email: { type: string, format: email, description: "Matched against any one of the person's registered emails." }
                phone: { type: string, description: "Matched against any one of the person's registered phones." }
      responses:
        "200":
          description: The details match someone who can sign in. Returned whether or not a link was actually sent (the cooldown may hold it back).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: A fixed, generic confirmation text. }
        "400":
          description: invalid_body (malformed JSON) or missing_fields (email and phone are both required).
        "404":
          description: unknown_details — no one with access has that email and phone together (no match, or a match with no role that gives access).
        "429":
          description: rate_limited — too many requests from this address recently; try again later.

  /auth/magic-link/consume:
    post:
      summary: Exchange a magic-link token for a session
      description: >
        Issues a single opaque, revocable session token — there's no
        separate short-lived access token and long-lived refresh token
        pair. The token is used directly as the bearer credential on
        every subsequent request until it's revoked (via /auth/logout or
        by an admin, see PATCH /users/{login}/tokens/{tokenID}) or it
        expires.

        The session expires 30 days after its last use — every request made
        with the token renews it — or 3 hours after its last use when the
        request is made through an address whose first label (up to the first
        ".") is "local" — the X-Forwarded-Host the reverse proxy adds, else
        Host — such as local.intranet.katiuskas.es, the one the club's shared
        tablet uses. It is the address that decides, not a device, and it
        can only shorten a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400": { description: invalid_body — malformed JSON. }
        "401":
          description: invalid_token — the link is invalid, already used, or expired.

  /auth/magic-link/consume-code:
    post:
      summary: Exchange a magic-link's 6-digit code for a session
      description: >
        The code counterpart to POST /auth/magic-link/consume, for
        reading the sign-in email on one device and signing in on
        another. Since the code alone is too short to look someone up
        by, email and phone identify the person exactly as requesting a
        link does. The response is the same generic 401 whether the code
        is wrong, expired, already used (by itself or via the matching
        link), guessed wrong too many times, or the email/phone didn't
        match anyone at all — nothing here tells those cases apart.

        Also throttled per calling address, sharing the same limiter and
        budget as POST /auth/magic-link (see that endpoint's own
        description) — this call identifies its target by email/phone
        before its per-code attempt counter is ever reached, so without
        this an address could otherwise scan through many different
        email/phone guesses here with nothing to slow it down.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, code]
              properties:
                email: { type: string, format: email }
                phone: { type: string }
                code: { type: string, description: "The 6-digit code from the sign-in email." }
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "400": { description: "invalid_body (malformed JSON) or missing_fields (email, phone and code are all required)." }
        "401":
          description: invalid_code — wrong, expired, already-used, or too-many-attempts code, or no match at all.
        "429":
          description: rate_limited — too many requests from this address recently; try again later.

  /auth/logout:
    post:
      summary: Revoke a session token
      description: >
        No authentication required: knowing the token is the proof.
        Always answers 204 for well-formed JSON, whether or not the token
        existed, and also clears the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Session revoked }
        "400": { description: invalid_body — malformed JSON. }

  /auth/telegram-bot:
    get:
      summary: Public info for offering Telegram as a sign-in option
      description: >
        No auth required — the whole point is helping someone who isn't
        signed in yet. username is the bot's public "@name" (without
        the "@"), used to build a t.me/<username> link on the login
        page; empty when TELEGRAM_BOT_USERNAME isn't configured, which
        means the Telegram sign-in option shouldn't be shown at all.
        Nothing here is secret — a bot's username is exactly as public
        as the t.me link built from it.
      responses:
        "200":
          description: Whether Telegram sign-in is offered, and who to message
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string, description: "Empty when not configured." }

  /auth/me:
    get:
      summary: Identity and roles of the caller
      description: >
        Reports who the bearer token belongs to and what roles they
        currently hold. Since the token is opaque, this is the only way
        for a client to learn that — there's nothing to decode locally
        the way a JWT could be. Costs no extra database round trip: it's
        resolved by the same lookup that authenticated the request.
        impersonated_by is present only for a session started by
        POST /users/{login}/impersonate: login/roles above are the
        impersonated person's, not the admin's, and impersonation_seconds_left
        says how long the impersonation has left (a duration, not a moment, so
        a client with a wrong clock can count it down from when it got the
        answer). While an admin acts with other roles (PUT /auth/role-override),
        roles are the ones in force and real_roles and role_override_seconds_left
        are present too. The frontend calls it once
        per page load, and it also sets the session cookie again, lasting as
        long as the session has left: a session that expires after its last
        use needs the cookie that mirrors it (for the file links) renewed
        with it.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { type: string }
                  first_name: { type: string, description: So a page can greet the person without asking for their record. }
                  last_name: { type: string }
                  roles: { type: array, items: { type: string } }
                  impersonation_seconds_left:
                    type: integer
                    description: >
                      Only in an impersonation session, whose expiry is fixed:
                      the seconds (rounded up) until it ends.
                  impersonated_by:
                    type: object
                    nullable: true
                    description: >
                      The admin currently impersonating this session, if
                      any. An empty object in the rare case that admin's
                      own account has since been deleted.
                    properties:
                      login: { type: string }
                      first_name: { type: string }
                      last_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/role-override:
    put:
      summary: Act with other roles for a while (an admin's own session)
      description: >
        Makes the session act, for one hour, with the given roles instead of the person's own, to see what
        somebody with them sees. Nobody's real roles change. Requires only authentication, and then that the
        person is an admin for real (their own roles, which may not be the ones in force) and that the session
        is not an impersonation. Calling it again replaces the roles. GET /auth/me then carries real_roles and
        role_override_seconds_left.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles: { type: array, minItems: 1, items: { type: string }, description: "Existing role names, at least one of admin, board or member." }
      responses:
        "200":
          description: Roles in force
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles: { type: array, items: { type: string } }
                  seconds_left: { type: integer }
        "400": { description: invalid_body, invalid_roles (empty), unknown_role or no_baseline_role. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The person is not an admin. }
        "409": { description: impersonating — an impersonation session can not act with other roles. }
    delete:
      summary: Put the person's own roles back
      description: Same requirements as PUT. Answers 204 also when there was no change to undo.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Own roles back }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: The person is not an admin. }
        "409": { description: impersonating. }

  /auth/impersonate/exit:
    post:
      summary: Stop impersonating and go back to being yourself
      description: >
        Only meaningful for a session started by
        POST /users/{login}/impersonate — revokes it and mints a fresh,
        normal token for the admin who started it (not the token they had
        before impersonating, which the API has no way to hand back out
        again). Requires only a valid bearer token, not any particular
        role: exiting must still work even if the impersonated person has
        since lost their baseline role, which would otherwise block every
        other authenticated route including this one.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Impersonation ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: A fresh session token for the admin. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: not_impersonating — this session isn't an impersonation. }

  /users:
    get:
      summary: List users
      description: >
        admin/board get every field (User, below) for everyone on file.
        Besides the personal data, each entry carries a few computed
        fields: membership dates, on_leave, license_type/license_year
        (only for a license covering the current year) and
        last_due_year/last_due_paid_at (the latest year paid, and when).
        A plain member gets MemberListing's much narrower view instead —
        no DNI, address, contact info, or anything else that isn't
        already effectively public knowledge inside the club — and only
        for people who are or have been a socio (a non-nil
        membership_start_date); someone who's never had a membership
        period at all (an admin-only account, say) is left out of a
        plain member's own listing entirely, even though admin/board
        still see them. Deliberately unpaginated — the club's
        membership grows by roughly 15 people a year, nowhere near the
        scale where returning everyone on file in one response is a
        real cost.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every user on file (User for admin/board, MemberListing otherwise)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - { $ref: "#/components/schemas/User" }
                    - { $ref: "#/components/schemas/MemberListing" }
    post:
      summary: Create a user (and, optionally, a login account)
      description: >
        Admin-only — board can no longer modify a person's data at all.
        The new person's login (their sole identifier everywhere else in
        this API) is generated automatically from their name and
        returned in the response; it isn't something the caller sets here.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserInput" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Only admin can create a person. }
        "400":
          description: >
            invalid_body (malformed JSON), invalid_date (birth_date is
            missing or not YYYY-MM-DD), unknown_role (a name in
            role_names doesn't exist) or automatic_role (role_names
            includes member, former_member or board).
        "409":
          description: duplicate — the email, phone, or national ID already belongs to another person.

  /users/directory:
    get:
      summary: List everyone with login access, name only
      description: >
        Open to any authenticated user, including one who'd only get
        MemberListing from GET /users. Returns just login, first_name and
        last_name, and whether the person is a member now or a former
        member — enough to populate a picker (an activity's participants
        and a loan or a rental are only for members, a sale for members and
        former members) without exposing anything more.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryEntry" }

  /users/{login}:
    get:
      summary: Get a user by login
      description: admin/board can view anyone; anyone else only themselves.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Not admin/board, and not viewing your own record. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a user's personal data
      description: >
        Only admin can set every field on anyone. Everyone else can only
        edit their own record (403 otherwise), and even then only the
        contact fields UpdateUserInput lists as such — attempting to also
        change name, national ID, birth date, gender, or login gets the
        whole request rejected with 403 restricted_fields, rather than
        silently dropping just those fields.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: >
            invalid_body (malformed JSON), invalid_date (birth_date isn't
            YYYY-MM-DD) or invalid_login (the given login isn't
            lowercase letters, digits, dots, or hyphens).
        "403":
          description: >
            forbidden — not admin, and not editing your own record; or
            restricted_fields — a non-admin tried to change a field
            beyond the contact ones.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: duplicate — the email, phone, national ID, or login being set already belongs to another person.
    delete:
      summary: Delete a person (and their sessions and sign-in links)
      description: >
        Admin-only — board can no longer modify a person's data at all. Nothing else goes with the
        person: a role, membership, leave, license, board position, activity, due, movement or
        order that still points at them makes it refuse (has_references).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Only admin can delete a person. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            cannot_delete_self (this account is the caller's own),
            has_references (the person still has records that point at
            them: roles, membership periods, licenses, activities,
            material movements...), or last_admin (they're the only remaining admin —
            someone has to be left who can manage users and roles).

  /roles:
    get:
      summary: List every role
      description: >
        Open to any baseline role (admin/board/member) — the catalog
        itself is just organizational labels (names/descriptions), never
        who holds which, read-only here regardless of who's asking. A
        plain member's own "Cargo" column on /members is built from
        GET /board-members instead, not from this — MemberListing has no
        roles field at all (see its own schema).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
    post:
      summary: Create a role
      description: Admin-only.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400":
          description: invalid_body (malformed JSON) or invalid_name (name is empty).
        "409":
          description: duplicate — a role with this name already exists.

  /roles/{id}:
    delete:
      summary: Delete a role
      description: Admin-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id — id isn't numeric. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            system_role — this is a system role (admin, board, member,
            former_member): it's wired to permissions or automatic
            behavior elsewhere in the API and can't be deleted; or
            role_in_use — somebody still holds it, take it off them first.

  /users/{login}/roles:
    post:
      summary: Grant a role to a person
      description: >
        Admin-only — board lost the ability to modify a person's data,
        role assignment included, even for roles that aren't "admin"
        itself. member/former_member/board can't be granted this way at
        all — they're computed from membership/board history instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        "204": { description: Granted }
        "403":
          description: Only admin can grant a role.
        "400": { description: invalid_body — malformed JSON. }
        "404": { description: not_found — no such person or no such role. }
        "409":
          description: automatic_role — the role is automatic (member/former_member/board) and can't be granted by hand.

  /users/{login}/roles/{roleID}:
    delete:
      summary: Revoke a role from a person
      description: >
        Same admin-only rule as granting; also refuses to let an admin
        revoke their own "admin" role (self_admin_removal — someone else
        has to be the one to do it, even with other admins around),
        refuses to revoke "admin" from the last person who has it
        (last_admin), and refuses to revoke an automatic role
        (member/former_member/board) at all.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: roleID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
        "400": { description: invalid_id — roleID isn't numeric. }
        "403":
          description: Only admin can revoke a role.
        "404": { description: not_found — no such person or role, or that person doesn't hold this role. }
        "409":
          description: >
            self_admin_removal (the caller is trying to revoke their own
            "admin" role), last_admin (they're the only remaining admin),
            or automatic_role (member/former_member/board can't be
            revoked this way at all).

  /admin/status:
    get:
      summary: How this running API is doing and how it is set up
      description: >
        Admin-only, read-only. Which version is deployed (the main module
        version Go recorded in the binary (a tag, or a pseudo-version with the
        commit; absent for a build outside a git checkout) and the commit,
        when known), when the process started, whether the
        database answers (and how fast) and the latest goose migration
        applied, whether email (SMTP) and Telegram (the log channel, and the
        bot) are configured and running, the timeouts in force, and whether
        each storage directory exists, how full the filesystems holding them are
        and, in `problems`, what is wrong right now. A database that doesn't answer is
        reported in the body (database.ok false), not as an error status.
        Never includes a secret: no tokens, passwords or connection strings.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminStatus" }
        "403": { description: Requires admin. }

  /tokens:
    get:
      summary: List everyone's session tokens
      description: >
        Admin-only overview of who is signed in. By default only the
        active tokens (not revoked, not expired yet); status=all adds the
        history. Most recently used first, never-used ones last, unless sort
        and order say otherwise; the order holds across pages (ties break by
        id, so paging neither repeats nor skips). Each one
        carries its owner's login, like GET /users/{login}/tokens, which
        is also where one is re-expired (PATCH) or revoked (DELETE). Never
        exposes the token value.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, all], default: active } }
        - { name: sort, in: query, schema: { type: string, enum: [last_used, created, expires, person], default: last_used }, description: "person is by name as it is read (first name, last name), then login. A session never used counts as the oldest use." }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] }, description: "Default: desc (the most recent first) for the dates, asc for person." }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 200 }, description: Page size; a value outside 1-200 falls back to 100. }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: A negative value falls back to 0. }
      responses:
        "200":
          description: Tokens of everyone
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
        "400": { description: invalid_status (not active or all), invalid_sort or invalid_order. }
        "403": { description: Requires admin. }

  /users/{login}/tokens:
    get:
      summary: List a person's session tokens
      description: >
        Open to that person themselves and to admin. Every session token
        ever issued to this person, newest first, including expired and
        revoked ones (the audit view), or with status=active only the ones
        not expired or revoked (what a person sees of their own, in /perfil).
        The one making the request is marked `current`. Never
        exposes the token value itself (only its hash is stored, and
        even that isn't returned) — just when it was created, when it
        expires, whether and when it was revoked, and when, from
        where and with which browser it was last used. Anybody else gets
        403 — also for a login nobody has, so this can't check which exist
        (an admin gets 404). A session started by impersonating the person
        does see theirs, as the person would in their profile.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [all, active], default: all } }
      responses:
        "200":
          description: This person's tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }

  /users/{login}/impersonate:
    post:
      summary: Start a session that behaves as this person
      description: >
        Admin-only — deliberately not admin/board, since handing board
        members the ability to act as anyone (including other admins) is
        a bigger step than the rest of what they can already do. Mints a
        token whose identity and roles are this person's, live-resolved
        exactly as if they had signed in — so every existing permission
        check already treats the resulting session as that person, with
        no special-casing anywhere else in the API. The one exception is
        GET /auth/me, which also reports impersonated_by, and
        POST /auth/impersonate/exit, reachable regardless of the target's
        own roles. Rejected (409) for yourself, or for someone with no
        baseline role — their session couldn't call anything anyway. An
        unknown login is a 404. The token is shorter-lived
        than a normal sign-in on purpose. Made from inside an impersonation
        (an admin impersonating an admin, who impersonates a third person)
        the new session is recorded as started by the original admin — the
        one behind it — not by the person they were acting as, so the chain
        never gets longer than one; that person, and the admin behind it,
        are rejected as targets too (409).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Impersonation session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "403": { description: Only admin can impersonate. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: cannot_impersonate_self (yourself, the person the session already acts as, or the admin behind it), or not_eligible (the person has no baseline role).

  /users/{login}/tokens/{tokenID}:
    patch:
      summary: Revoke a session or change when it expires
      description: >
        A session is never deleted: a revoked one stays on file and cannot be brought back.
        `revoked: true` (the only value accepted) revokes it. It is open to that person themselves
        (to close one of their own sessions, the one in use included, which is signing out) and to
        admin; not through a session started by impersonating the person (403: it can see the
        person's sessions but not end them). Idempotent: revoking an already-revoked session still
        returns 204. It ends the session at once — the next request made with it gets 401.
        `expires_at` is admin only (403 otherwise): it lets a session be extended or shortened
        without revoking it. A session expires a while after its last use, so setting when it ends
        also sets how long it lasts from now on (the time from now to that moment), which each later
        use renews: the change is not undone by using the session. A moment already past ends it. A
        session with a fixed expiry (an impersonation one) keeps the expiry given. One of the two
        has to be given.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: tokenID, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revoked: { type: boolean, enum: [true] }
                expires_at: { type: string, format: date-time }
      responses:
        "204": { description: Updated }
        "400": { description: invalid_body (malformed, revoked false, or expires_at not a date), missing_fields (neither revoked nor expires_at) or invalid_id (tokenID isn't numeric). }
        "403": { description: Not that person nor admin (or an impersonation session), or expires_at from somebody who is not admin. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/memberships:
    get:
      summary: List a user's membership periods
      description: Open to that person themselves, or to admin/board.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Membership history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }
        "403": { description: Someone other than that person, admin, or board tried to view it. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Start a new membership period
      description: Admin-only — board can see every membership period but no longer starts, corrects, or ends one.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { description: invalid_body (malformed JSON) or invalid_date (start_date missing or not YYYY-MM-DD). }
        "403": { description: Only admin can start a membership period. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: overlapping_period — overlaps an existing membership period for this user.

  /users/{login}/dues:
    get:
      summary: List a person's recorded membership dues ("cuotas")
      description: >
        Open to that person themselves, or to admin/board — the same
        split as GET /users/{login}/licenses.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Dues history, newest year first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Due" }
        "403": { description: Someone other than that person, admin, or board tried to view it. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Record a due ("cuota") payment
      description: >
        Admin-only. transaction_id must name the transaction that
        recorded this payment (see POST /transactions). If this person
        has no membership period on file at all yet, this is treated as
        their very first due (matrícula plus the current year's cuota),
        so a new membership period is also started for them, dated from
        start_date — someone rejoining after a prior, since-closed
        membership isn't affected by this at all (they already have one
        on file), and keeps using POST /users/{login}/memberships for
        that instead. Editing or removing a due isn't supported. The
        transaction must also have an entry on an account marked
        allows_dues (see PUT /accounts/{id}) — checked before anything
        else, so a rejected due never starts a membership period either.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year, transaction_id]
              properties:
                year: { type: integer }
                transaction_id: { type: integer, description: The transaction that recorded this payment. }
                start_date:
                  type: string
                  format: date
                  description: >
                    Optional. Only used if this person has no membership period
                    yet — it becomes that first period's start_date, and is
                    required then (400 start_date_required).
      responses:
        "201":
          description: Due recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Due" }
        "400":
          description: >
            invalid_body (malformed JSON), missing_fields (year or
            transaction_id left out), invalid_date (start_date given but
            not YYYY-MM-DD), start_date_required (this would be the
            person's first due and no start_date was given) or
            unknown_transaction (transaction_id doesn't name an existing
            transaction).
        "403": { description: Only admin can record a due. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            due_already_recorded (this person already has a due on file
            for that year) or transaction_not_for_dues (none of the
            transaction's entries is on an account marked allows_dues).

  /users/{login}/licenses:
    get:
      summary: List a person's federative licenses
      description: >
        Open to that person themselves, or to admin/board — nobody else,
        even though POST/PUT/DELETE on a license are admin-only
        regardless of whose it is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: License history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/License" }
        "403": { description: Someone other than that person, admin, or board tried to view it. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Assign a federative license ("licencia federativa")
      description: >
        Admin-only — board can see everyone's licenses but no longer
        assigns one. Only someone who was a socio at some point of the
        license's year can be assigned one — not necessarily now, nor on
        issued_date itself. A license is
        annual: valid from January 1 through December 31 of year — its
        own field, not necessarily issued_date's calendar year (a
        license requested in December often covers the *following*
        year) — the response includes the computed valid_until, but it
        isn't something the caller sets. license_type_id must reference
        an entry from GET /license-types; other_detail is required when
        that entry is the catalog's "Otra" escape hatch (is_other) and
        forbidden otherwise. transaction_id is optional: when given it
        must name the transaction that recorded the payment for this
        license (see POST /transactions), and that transaction must also
        have an entry on an account marked allows_licenses (see PUT
        /accounts/{id}); leave it out for a license the club didn't
        collect (someone federated elsewhere). It's never changed
        afterward (PUT has no transaction_id of its own).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_type_id, issued_date, year]
              properties:
                license_type_id: { type: integer }
                other_detail: { type: string, nullable: true }
                issued_date: { type: string, format: date }
                year: { type: integer, description: The calendar year this license covers. }
                transaction_id: { type: integer, description: The transaction that recorded the payment for this license. Optional — omit it for a license not paid through the club. }
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400":
          description: >
            invalid_body (malformed JSON), missing_fields (license_type_id
            or year left out), invalid_date (issued_date missing or not
            YYYY-MM-DD), invalid_license_type (unknown license_type_id),
            invalid_other_detail (other_detail missing for "Otra", or
            given for a type that isn't "Otra"), or unknown_transaction
            (transaction_id doesn't name an existing transaction).
        "403": { description: Only admin can assign a license. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            not_active_member (this person was never a socio during the
            license's year) or transaction_not_for_licenses (none
            of the transaction's entries is on an account marked
            allows_licenses).

  /licenses/{id}:
    put:
      summary: Correct a license
      description: >
        Admin-only. Unlike POST, this doesn't re-check that the person
        was a socio during the license's year — it's fixing an
        existing record, not assigning a new one, so it also works for
        someone who has since left the club. Same license_type_id /
        other_detail rule as creating one. There's no transaction_id
        here on purpose — correcting a typo on a license's type, date,
        or year is a different action from re-litigating which payment
        it belongs to.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_type_id, issued_date, year]
              properties:
                license_type_id: { type: integer }
                other_detail: { type: string, nullable: true }
                issued_date: { type: string, format: date }
                year: { type: integer, description: The calendar year this license covers. }
      responses:
        "200":
          description: Updated license
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400":
          description: >
            invalid_id, invalid_body (malformed JSON), missing_fields
            (license_type_id or year left out), invalid_date (issued_date
            missing or not YYYY-MM-DD), invalid_license_type (unknown
            license_type_id) or invalid_other_detail (other_detail
            missing for "Otra", or given for a type that isn't "Otra").
        "403": { description: Only admin can correct a license. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a license
      description: Admin-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Only admin can remove a license. }
        "404": { $ref: "#/components/responses/NotFound" }

  /license-types:
    get:
      summary: List the federative license name catalog
      description: >
        Admin-only, matching POST /users/{login}/licenses: the catalog
        only exists to populate that form. Kept in the database rather
        than a fixed set in code, since the list of valid names (new
        zones, new federations) can grow over time. is_other flags the
        "Otra" escape-hatch entry.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The license type catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LicenseType" }

  /memberships:
    get:
      summary: List members whose membership is active today
      description: admin/board — read-only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }

  /memberships/{id}:
    put:
      summary: Correct a membership period's dates (or end it)
      description: >
        Admin-only. start_date is always required and replaces the
        current value. end_date likewise always replaces the current
        value: give a date to end the period, or omit/null it to leave
        the period open — including reopening one that was ended by
        mistake. end_reason is a true partial update: omit it to leave
        it as is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
                end_reason: { type: string, nullable: true }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "400": { description: invalid_id, invalid_body, or invalid_date (start_date missing, or start_date/end_date not YYYY-MM-DD). }
        "403": { description: Only admin can correct a membership period. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            overlapping_period (the corrected dates overlap another
            period for this person), or outside_membership_period (the
            new dates would strand an existing temporary leave of this
            membership's own outside its period).
    delete:
      summary: Remove a membership period outright
      description: >
        Admin-only. Nothing else references a membership by foreign key
        (membership_leaves keys off the person directly, not off a
        specific period), so this never cascades into anything. Meant
        for the frontend's own "undo my last action" story — in
        practice only ever offered there for a person's single most
        recent alta/baja/baja-temporal entry — but that's a UI-level
        rule, not something this endpoint itself enforces.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Only admin can delete a membership period. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/board-members:
    get:
      summary: List a person's board (Junta Directiva) terms
      description: Open to that person themselves, or to admin/board.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Board term history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardMember" }
        "403": { description: Someone other than that person, admin, or board tried to view it. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Start a new board term
      description: >
        Admin-only. The automatic "board" role (see the User schema) is
        computed from whoever currently has an open term here — there's
        no other way to grant it. Rejected if this person already has an
        open (or overlapping) term, whatever the position: nobody holds
        two board terms at once.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, start_date]
              properties:
                position: { $ref: "#/components/schemas/BoardPosition" }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true, description: "Last day of the term; omitted or null for an open term. Never before start_date." }
      responses:
        "201":
          description: Board term created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
        "400": { description: invalid_body (malformed JSON), invalid_date (start_date missing or not YYYY-MM-DD, end_date not YYYY-MM-DD or before start_date) or invalid_position (position isn't one of the BoardPosition values). }
        "403": { description: Only admin can start a board term. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: overlapping_period — overlaps an existing board term for this person.

  /board-members:
    get:
      summary: List the current Junta Directiva
      description: >
        Open to admin, board, and plain members alike — anyone signed in
        can see who's currently on the board, their cargo, and how to
        reach them (email/phone, joined in from the person's own
        profile).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Everyone with an open board term today, across every position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardMember" }

  /board-members/history:
    get:
      summary: Every term there has been on the Junta Directiva
      description: >
        Open to admin, board and plain members. Past and present terms,
        newest start first, with the person's name and position but no
        email or phone. The web page builds a chronological history of
        entries and departures from it.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every board term
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardMember" }

  /board-members/{id}:
    put:
      summary: Correct a board term's position or dates (or end it)
      description: >
        Admin-only. position and start_date are always required and
        replace the current values. end_date likewise always replaces
        the current value: give a date to end the term, or omit/null it
        to leave it open — including reopening one that was ended by
        mistake.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, start_date]
              properties:
                position: { $ref: "#/components/schemas/BoardPosition" }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: Updated board term
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
        "400": { description: invalid_id, invalid_body, invalid_position (position isn't one of the BoardPosition values), or invalid_date (start_date missing, or start_date/end_date not YYYY-MM-DD). }
        "403": { description: Only admin can correct a board term. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: overlapping_period — the corrected dates overlap another board term for this person.
    delete:
      summary: Remove a board term outright
      description: >
        Admin-only. Nothing else references a board term by foreign
        key, so this never cascades. Unlike a membership period or a
        temporary leave, a board term is a single row covering both its
        own start and end, so there's no "closing half" to fall back to
        clearing instead — deleting it always removes the whole term.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Only admin can delete a board term. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/leaves:
    get:
      summary: List every temporary leave this person has ever taken
      description: >
        Open to that person themselves, or to admin/board — the same split
        as GET /users/{login}/memberships. A leave
        belongs to the person directly, not to one specific membership
        period, so this covers every alta/baja span they've ever had in
        one call.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Temporary leaves, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Leave" }
        "403": { description: Someone other than that person, admin, or board tried to view it. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Record a temporary leave ("baja temporal")
      description: >
        Admin-only. end_date can be left out (or sent empty/null) for a
        leave that's still ongoing — the same "open" shape a membership
        period's own end_date already has. The given dates must fall
        entirely within one single membership period this person has
        had (whichever one, if any, actually covers them — not
        necessarily their current one); an open-ended leave only fits
        within a membership period that's itself still open too.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
                reason: { type: string, nullable: true }
      responses:
        "201":
          description: Leave created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leave" }
        "400": { description: invalid_body, or invalid_date (start_date missing, or start_date/end_date not YYYY-MM-DD). }
        "403": { description: Only admin can record a temporary leave. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Either outside_membership_period (the dates don't fall
            entirely within any single one of this person's own
            membership periods) or overlapping_period (they overlap
            another leave of this same person) — see the error code.

  /dues/{id}:
    delete:
      summary: Delete a due
      description: >
        Admin only. Only the due goes: the transaction that paid it stays in the accounting, and so
        does the joining period that recording it may have opened.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }

  /leaves/{id}:
    put:
      summary: Correct a temporary leave's dates or reason
      description: >
        Admin-only. start_date is always required and end_date always
        replaces whatever was there — omitted or empty/null means the
        leave is (again) still ongoing, which also lets an admin undo an
        accidental end date the same way clearing a membership's own
        end_date does. The containment check (against this person's own
        membership periods) runs again on every correction. reason is a
        true partial update: omit it to leave it as is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
                reason: { type: string, nullable: true }
      responses:
        "200":
          description: Updated leave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leave" }
        "400": { description: invalid_id, invalid_body, or invalid_date (start_date missing, or start_date/end_date not YYYY-MM-DD). }
        "403": { description: Only admin can correct a temporary leave. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: outside_membership_period or overlapping_period — see the error code.
    delete:
      summary: Remove a temporary leave
      description: Admin-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /activities:
    get:
      summary: List activities
      description: >
        Defaults to every activity (paginated, newest first by start_date;
        limit defaults to 50). Pass
        active=true to instead get only the ones still needing
        attention: not cancelled and not yet ended (end_date today or
        later), or (even over or cancelled) still
        with a loan/rental linked to it that hasn't been returned — the
        practical "what matters right now" view once years of history
        pile up. Pass order=asc to sort oldest-first instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: active
          in: query
          schema: { type: boolean }
          description: "true: only the activities that still need attention (see above)."
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: asc sorts oldest-first; anything else (including omitted) is newest-first.
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 }, description: "Page size. Omitted, zero, negative or above 100 all fall back to 50 (not clamped to 100)." }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: Negative values are treated as 0. }
      responses:
        "200":
          description: A page of activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
    post:
      summary: Create an activity
      description: >
        Any authenticated person can create an activity (there's no role
        restriction here, unlike update/cancel) and sign up its initial
        participants in the same call. The organizer (leader_login)
        defaults to the caller; admin/board can instead name someone
        else via leader_login in the request body — anyone else who
        tries gets a 403.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActivityInput" }
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400":
          description: >
            invalid_body (malformed JSON), invalid_date (start_date or
            end_date missing or not YYYY-MM-DD), invalid_date_range
            (end_date earlier than start_date), invalid_type or
            invalid_visibility (not one of the enum's values), or
            unknown_participant (one of the given participant_logins
            doesn't exist), or invalid_max_participants (below 1).
        "403":
          description: forbidden — leader_login was given by someone who isn't admin/board.
        "404":
          description: not_found — leader_login doesn't belong to anyone.
        "409":
          description: >
            not_a_member — one of the given participant_logins isn't a member now;
            or activity_full — there are more participant_logins than max_participants;
            or duplicate_activity — there is already an activity with that title (ignoring case
            and surrounding spaces) starting that day.

  /activities/{id}:
    get:
      summary: Fetch a single activity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { description: invalid_id — id isn't numeric. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update an activity
      description: >
        Only the activity's organizer (leader_login), or admin/board, may
        update it — anyone else gets a 403. leader_login itself
        (reassigning the organizer) is narrower still: admin/board
        only, even for the current organizer. cancelled: true cancels the
        activity and false reactivates it (to take it out of sight without
        deleting it).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateActivityInput" }
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400": { description: "invalid_id, invalid_body, invalid_date (start_date/end_date given but not YYYY-MM-DD), invalid_date_range (the resulting end_date would be earlier than start_date, whichever of the two was sent), or invalid_type, invalid_status or invalid_visibility (not one of the enum values), or invalid_max_participants (below 1 or not a number)." }
        "403":
          description: >
            forbidden — not the organizer, board, or admin; or
            leader_login was given by someone who isn't admin/board.
        "404":
          description: not_found — the activity doesn't exist, or leader_login doesn't belong to anyone.
        "409":
          description: >
            max_below_attendance — max_participants is lower than the people already going (members and guests);
            or duplicate_activity — another activity already has that title on that start date.

    delete:
      summary: Delete an activity
      description: >
        Only the activity's organizer (leader_login), or admin/board. Only an activity with nothing
        attached can be deleted: with participants, resources or material movements it is refused
        (409 activity_in_use) until those are removed. Cancel it with PATCH to take it out of sight
        without deleting it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Only the organizer, board, or admin can delete this activity. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: activity_in_use — it still has participants, resources or material movements. }

  /activities/{id}/participants:
    get:
      summary: List an activity's participants
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Participant" }
        "400": { description: invalid_id — id isn't numeric. }
    post:
      summary: Join an activity, or add someone else to it
      description: >
        On a public activity: with no body (or a null/omitted login)
        signs up the caller; naming a login signs up that person, whoever
        the caller is. On a private activity, only the organizer, board,
        admin or somebody already signed up may call this at all — even to
        sign up the caller themselves; anyone else gets a 403 regardless of
        whose login they name. Who did it and when is recorded
        (added_by_login, added_at in the participants list). The person being added must be a member now (of
        any activity type, federated or not), or the call is rejected
        with 409 not_a_member.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string, nullable: true }
      responses:
        "204": { description: Joined }
        "400": { description: invalid_id or invalid_body. }
        "403":
          description: >
            A plain member tried to add someone other than themselves to
            a public activity, or anyone other than the organizer/board/
            admin tried to add a participant (self included) to a private
            one.
        "404": { description: not_found — no such activity, or the given login doesn't belong to anyone. }
        "409":
          description: >
            not_a_member — the person being added isn't a member now; or activity_full — the
            activity has a limit (max_participants) and it is reached, counting the guests.

  /activities/{id}/participants/{login}:
    delete:
      summary: Leave an activity
      description: >
        A person can remove themselves; admin/board can remove anyone;
        whoever signed somebody up can remove them (public or private,
        even without being the organizer); and on a private activity the
        organizer can also remove anyone, but gets no such extra say on a
        public one. Anyone else gets a 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "400": { description: invalid_id — id isn't numeric. }
        "403":
          description: >
            A plain member tried to remove someone other than
            themselves, or — on a public activity — the organizer tried
            to remove someone other than themselves.
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: has_guests — that person still has guests in the activity; remove them first. }

  /activities/{id}/guests:
    get:
      summary: List an activity's guests
      description: >
        Any baseline role. Guests are people from outside the club who go to the activity, each
        invited by one of the people signed up to it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Guests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Guest" }
    post:
      summary: Add a guest
      description: >
        Whoever invites the guest (signed up to the activity), the organizer, admin and board. Whoever
        invites just gives the name; the organizer, admin and board also give invited_by, the login of
        the person signed up who invites them. A participant who is none of those cannot name somebody
        else (403).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                invited_by: { type: string, description: "Login of the person who invites them; required for the organizer, admin and board." }
      responses:
        "201":
          description: The guest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Guest" }
        "400": { description: invalid_id, invalid_body (also a blank name) or invited_by_required. }
        "403": { description: Not signed up to the activity (and not organizer, admin or board), or naming somebody else without being any of those. }
        "404": { description: not_found — the activity, or the login in invited_by. }
        "409": { description: inviter_not_signed_up, duplicate_guest (the same person already invited that name) or activity_full (the limit of people, members and guests together, is reached). }

  /activities/{id}/guests/{guestID}:
    delete:
      summary: Remove a guest
      description: Whoever invited them, the organizer, admin and board.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: guestID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "400": { description: invalid_id. }
        "403": { description: Neither whoever invited them, nor the organizer, admin or board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /activities/{id}/resources:
    get:
      summary: List an activity's memoria
      description: >
        Every resource contributed to this activity's write-up, in
        memoria order (ActivityResource.position — see PUT
        .../resources/order). Open to any baseline role, same as the
        rest of an activity's own data — not restricted to whoever took
        part in it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: This activity's resources, in memoria order (an empty list for an unknown activity id)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityResource" }
        "400": { description: invalid_id — id isn't numeric. }
    post:
      summary: Add a resource to an activity's memoria
      description: >
        Requires admin, board, this activity's own organizer, or anyone
        who took part in it (activity_participants, any role) — a plain
        member with no connection to the activity gets 403. Always
        multipart/form-data, never plain JSON, since a file resource has
        to carry an actual upload: type (text|file), title (both),
        description (text only), file (file only, capped at 25 MiB). A
        text resource is simply a multipart request with no file part in
        it, rather than a separate endpoint per type. content_type is
        taken from the upload itself (falling back to guessing from the
        filename's extension, then application/octet-stream), never
        given by the caller directly; position is always appended after
        whatever the activity's current highest one is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, title]
              properties:
                type: { type: string, enum: [text, file] }
                title: { type: string }
                description: { type: string, description: Required (non-blank) for type=text; ignored for type=file. }
                file: { type: string, format: binary, description: Required for type=file; ignored for type=text. }
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResource" }
        "400":
          description: >
            invalid_id, invalid_body (malformed multipart form),
            invalid_type, title_required, description_required (type=text
            with no description), or file_required (type=file with no
            file part).
        "403": { description: Neither admin/board, the organizer, nor a participant. }
        "404": { description: Activity not found. }
        "413": { description: file_too_large — over the 25 MiB limit. }

  /activities/{id}/resources/order:
    put:
      summary: Reorder an activity's memoria
      description: >
        Replaces the whole memoria's order in one call — send every
        resource id currently in this activity's memoria, in the new
        order; resource_ids must be exactly that activity's current set
        (same members, no more, no fewer) or the call is rejected rather
        than silently dropping or ignoring stray ids, so a client working
        from a stale list has to reload and retry instead of clobbering
        positions with an order that no longer matches what's actually
        there. Same access as POST .../resources (organizer, participant,
        or admin/board).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resource_ids]
              properties:
                resource_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: This activity's resources, in their new memoria order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityResource" }
        "400": { description: invalid_id or invalid_body. }
        "403": { description: Neither admin/board, the organizer, nor a participant. }
        "404": { description: Activity not found. }
        "409": { description: reorder_mismatch — resource_ids doesn't match this activity's current resources exactly. }

  /activities/{id}/resources/{resourceID}:
    get:
      summary: Get one memoria resource
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResource" }
        "400": { description: invalid_id — id or resourceID isn't numeric. }
        "404": { description: not_found — no such resource under this activity. }
    patch:
      summary: Edit a memoria resource's title or description
      description: >
        Requires this resource's own author, or admin/board — a
        participant who didn't contribute this particular resource can't
        edit it, even though they could contribute their own. Only
        title (either type) and description (text type only) can be
        changed; there's no way to replace a file resource's actual
        bytes through this endpoint — delete it and add a new one
        instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResource" }
        "400": { description: invalid_id, invalid_body, description_not_allowed (description given for a type=file resource), or invalid_fields (the fields given don't match the resource's type). }
        "403": { description: Neither this resource's own author nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a memoria resource
      description: >
        Requires this resource's own author, or admin/board — same
        restriction as PATCH. Removes the file from disk too, for a
        type=file resource.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id — id or resourceID isn't numeric. }
        "403": { description: Neither this resource's own author nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /activities/{id}/resources/{resourceID}/file:
    get:
      summary: Read or download a memoria resource's file
      description: >
        Streams a type=file resource's raw bytes — not_a_file for a
        type=text resource, which never has one. Same
        inline-by-default/?download=1/Content-Type behavior as
        GET /library/file/{path} and GET /users/{login}/files/file/{path},
        open to any baseline role (same as GET .../resources above).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", sets Content-Disposition to attachment (a Save dialog) instead of inline.
      responses:
        "200": { description: The file's raw content. }
        "400": { description: not_a_file — this resource is type=text. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/activities:
    get:
      summary: List a person's activity history
      description: >
        Every activity where this person is either the leader or a
        participant, most recent first. Open to any signed-in baseline
        user, not just admin/board or the person themselves — who took
        part in an activity is already visible to anyone via GET
        /activities/{id}/participants, so this is the same information
        viewed from the other direction.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: This person's activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions/{id}/files:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      summary: The files attached to a transaction
      description: Admin, board or money.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TransactionFile" }
        "400": { description: invalid_id. }
        "403": { description: Requires admin, board or money. }
        "404": { description: transaction_not_found. }
    post:
      summary: Attach a file to a transaction
      description: >
        Admin or money. One file (a ticket, an invoice), at most 10 MiB, in the multipart field
        `file`. Its type is decided from its bytes: a PDF or an image can be shown in the browser,
        anything else is only downloaded.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          description: Attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionFile" }
        "400": { description: invalid_id, invalid_body or file_required (missing or empty). }
        "403": { description: Requires admin or money. }
        "404": { description: transaction_not_found. }
        "413": { description: file_too_large. }

  /transactions/{id}/files/{fileId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: fileId, in: path, required: true, schema: { type: integer } }
      - { name: download, in: query, required: false, schema: { type: string, enum: ["1"] }, description: "1 forces a download of a PDF or an image." }
    get:
      summary: The bytes of a file
      description: >
        Admin, board or money; the session cookie is accepted too, so a link can open it. A PDF or an
        image is sent inline, anything else as an attachment (and sandboxed).
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200": { description: The file }
        "400": { description: invalid_id. }
        "403": { description: Requires admin, board or money. }
        "404": { description: not_found (also if the file belongs to another transaction). }

  /transactions/{id}/files/{fileId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
      - { name: fileId, in: path, required: true, schema: { type: integer } }
    delete:
      summary: Remove a file from a transaction
      description: Admin or money.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Removed }
        "400": { description: invalid_id. }
        "403": { description: Requires admin or money. }
        "404": { description: not_found. }

  /transaction-files:
    get:
      summary: Every file attached to a transaction, with the transaction's details
      description: Admin, board or money. The transaction most recent first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 1900, maximum: 2200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TransactionFileListing" }
        "400": { description: invalid_year, invalid_limit or invalid_offset. }
        "403": { description: Requires admin, board or money. }

  /budgets:
    get:
      summary: The years that have a budget
      description: Newest first, with the totals of each. Open to any baseline role.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The years
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BudgetSummary" }

  /budgets/{year}:
    parameters:
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
    get:
      summary: The budget of a calendar year
      description: >
        Line items of income and expenses with the amount budgeted, what was really received (income)
        or spent (expenses) in the year by their accounts and the percentage reached, and the totals of
        both parts. `unassigned_accounts` are the accounts the saved budget does not cover. Open to any
        baseline role.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The budget
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { description: invalid_year. }
        "404": { description: The year has no budget. }
    put:
      summary: Create or replace the budget of a year
      description: >
        Admin or money. Replaces the whole budget in one transaction. Every leaf account of income or
        expense type that is not hidden has to be in an item, an account is in one item only, and the
        two parts have to add up to the same.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetInput" }
      responses:
        "200":
          description: The budget as saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Budget" }
        "400": { description: invalid_body, invalid_year, invalid_item, duplicate_item, item_without_accounts, unknown_account, account_not_budgetable, account_type_mismatch or duplicate_account. }
        "403": { description: Requires admin or money. }
        "409": { description: accounts_missing (the message names them) or unbalanced (the message carries both totals). }
    delete:
      summary: Delete the budget of a year
      description: Admin or money.
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_year. }
        "403": { description: Requires admin or money. }
        "404": { description: The year has no budget. }

  /club-info:
    get:
      summary: The club's "datos de interés"
      description: >
        What the home page shows — the club's name, tax id, address, bank account, the Bizum
        number... — as labelled values, in order. Open to any baseline role.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClubInfoItem" }
    post:
      summary: Add an item
      description: Admin only. It goes last. Blank texts are trimmed; a blank `copy_value` or `copy_label` means no button.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClubInfoInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubInfoItem" }
        "400": { description: invalid_body, invalid_label, invalid_value or invalid_copy (a copy_label with no copy_value, or a text too long). }
        "403": { description: Requires admin. }

  /club-info/order:
    put:
      summary: Put the items in order
      description: >
        Admin only. The ids of every item, in the order wanted; anything short of exactly all of
        them, each once, is a 409 reorder_mismatch and changes nothing. Answers with the list.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_ids]
              properties:
                item_ids: { type: array, items: { type: integer } }
      responses:
        "200":
          description: The items in their new order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClubInfoItem" }
        "403": { description: Requires admin. }
        "409": { description: reorder_mismatch. }

  /club-info/{id}:
    put:
      summary: Change an item
      description: >
        Admin only. Replaces the label, value and copy button (a copy_value or copy_label left out
        turns the button off); the item keeps its place.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClubInfoInput" }
      responses:
        "200":
          description: The item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubInfoItem" }
        "400": { description: invalid_id, invalid_body, invalid_label, invalid_value or invalid_copy. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove an item
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }

  /holidays:
    get:
      summary: List club holidays
      description: >
        Backs the activities calendar view, which marks these alongside
        weekends (computed client-side from the date, no table needed
        for those). Open to any baseline role — not sensitive.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          schema: { type: integer }
          description: Defaults to every year on file when omitted.
      responses:
        "200":
          description: Holidays
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Holiday" }
    post:
      summary: Add a holiday
      description: Requires the admin or board role.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date }
                name: { type: string }
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Holiday" }
        "400": { description: invalid_body, invalid_date (not YYYY-MM-DD), or invalid_name (empty). }
        "409": { description: duplicate_holiday — that date already has one. }

  /holidays/{id}:
    delete:
      summary: Remove a holiday
      description: >
        Requires the admin or board role. There's no update endpoint —
        correcting one is just deleting and re-adding it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Holiday deleted }
        "400": { description: invalid_id — id isn't numeric. }
        "404": { $ref: "#/components/responses/NotFound" }

  /distributions:
    get:
      summary: List the distributions
      description: >
        A distribution ("reparto") is one article the club hands out to its
        members — shirts, buffs, a rope, mugs — with what it costs and what
        has to be chosen (a size...). Open to any baseline role, newest
        first; a draft is only listed for admin/board, and one whose
        `visibility` is above the caller's role is left out. Each one carries
        `eligible`: whether the caller may have it (they were a member on
        its `cutoff_date`, or it has none).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Distributions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Distribution" }
    post:
      summary: Create a distribution
      description: >
        Requires admin or board. It starts as a `draft`, which nobody else
        can see. `cutoff_date` is required for `all_members` (it defines who
        it is for: whoever was a member that day; they all get their own unit
        automatically once it is opened, nobody has to sign up) and optional
        for `signup`, where, when set, only those members can sign up. `price` is a
        member's own unit (0 = free); `extra_price` makes extra units
        possible and is what each costs; `max_extra` caps them per person
        and needs `extra_price`. With `articles` it is a different kind of
        distribution — several things asked for in any quantity, like the
        Christmas lottery's "papeletas" and "décimos": each article has its
        own `price` and, optionally, `max_total`, how many there are to give
        out in all. It is for whoever signs up and has no options, extras or
        price of its own (400 articles_conflict); each article needs a
        distinct name, a price of at least 0 and limits of at least 1 if it
        has them (400 invalid_articles). An article may also cap what one
        person can have (`max_per_person`) and carry a number on each unit
        (`has_identifiers`: a serial number, a series and fraction), which is
        written down when the units are handed out. Those numbers can be
        described with `identifier_fields`: parts of the number ("Serie",
        "Fracción"), each with the values it can take as a `spec` of values and
        ranges ("124-133, 137", "0001-0200": digits keep the width of the
        ends when one has leading zeros, no value repeated or with a slash).
        Every combination is an item that exists, so the article's `max_total`
        is then always how many there are (what is sent is ignored), numbers
        are implied, and what is free and who has what is known (400
        invalid_numbering).
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionInput" }
      responses:
        "201":
          description: Distribution created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "400": { description: invalid_name, invalid_audience, invalid_visibility, cutoff_required, invalid_date (cutoff_date isn't YYYY-MM-DD), invalid_price, invalid_max_extra, invalid_options, invalid_articles or articles_conflict. }
        "403": { description: Neither admin nor board. }

  /distributions/{id}:
    get:
      summary: Get a distribution
      description: >
        Open to any baseline role; a draft is a 404 for anyone but admin/board, and so is a
        distribution whose `visibility` is above the caller's role (every route about a
        distribution works that way).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The distribution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Edit a distribution
      description: >
        Requires admin or board. Replaces every field of the creation body
        wholesale, so one left out is turned off — except `options`,
        `articles` and `status`, which are only touched when sent. `options`
        can only be replaced while nobody has asked for anything yet (409
        has_units); sending back exactly what is there is not a replacement.
        The same for `articles`, except that once somebody has asked only
        each article's `max_total`, `max_per_person`, `has_identifiers` and
        `identifier_fields` can change (anything else is 409 has_units), the
        limits to no less than what has been asked for (409
        cap_below_requested), and the numbers can grow (another series) but
        not leave out one somebody has (409 number_in_use). `status`
        moves one step at a time along draft, open (members ask for units),
        closed (members can no longer ask for or change anything; admin, board and material still can) and done —
        forward or back, one step at a time (a distribution with nothing for the members to ask — for
        all members, with no options and no extras — skips open: it goes between draft and closed). Units can be handed out
        (collections recorded, numbers written down) in any state but draft,
        since the order often arrives before the asking has ended.
        Changing `audience` from `all_members` to
        `signup` deletes the automatic units nobody has touched (not chosen,
        not paid, not collected): whoever did choose has asked for it, which is
        signing up, so those and the extras stay; it is refused (409
        has_settled_units) while an untouched one is paid or collected. Going
        back to draft starts it over: every unit is deleted — everybody's own,
        the extras, the sign-ups, with what was chosen on them; opening again
        makes the automatic ones of a distribution for all members anew, empty
        — but it is refused (409 has_settled_units) while any is paid or
        collected. Prices changed here don't change
        what units already asked for cost, except the automatic units of a
        distribution for all members that nobody has touched (not chosen, not
        paid, not collected), which take the new price.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionInput" }
      responses:
        "200":
          description: The updated distribution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Distribution" }
        "400": { description: Same as creating, plus invalid_status. }
        "409": { description: invalid_status_transition, has_units, has_settled_units or cap_below_requested. }
        "403": { description: Neither admin nor board. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: invalid_status_transition (not one step), or has_units (replacing the options after somebody asked). }
    delete:
      summary: Delete a distribution
      description: >
        Requires admin (board can create and edit distributions, not delete
        them). Deletes the distribution together with its
        units, so whatever members chose goes with it — in a distribution for
        all members that is everybody's own unit, which exists from opening
        on. It is refused (409 has_settled_units) while some unit is paid or
        collected: those marks have to be undone first.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Not admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: has_settled_units. }

  /distributions/{id}/people:
    get:
      summary: Who the pickers of the pages offer
      description: >
        So that nobody has to choose from everybody on file, the members a
        distribution's pickers (the "in the name of" one when asking, the
        "handed to" one when collecting) can offer, by name. `for=order`
        (any baseline role) are those who may have the distribution: the
        members on its `cutoff_date`, or today's members when it has none.
        `for=pickup` (admin, board and material only) is also whoever is a
        member now, since somebody who joined since can collect for others.
        A draft is a 404 for anyone but admin/board.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - name: for
          in: query
          schema: { type: string, enum: [order, pickup], default: order }
      responses:
        "200":
          description: Members, by name
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    login: { type: string }
                    first_name: { type: string }
                    last_name: { type: string }
        "403": { description: for=pickup without admin, board or material. }
        "404": { $ref: "#/components/responses/NotFound" }

  /distributions/{id}/units:
    get:
      summary: List the units asked for
      description: >
        A unit is one thing somebody wants, so two extra shirts are two
        units, each with its own choices. admin, board and material see all
        of them; anybody else only those that are for them or that they
        entered themselves. In a distribution for all members nobody has to
        sign up: every member on its `cutoff_date` has their own unit from the
        moment it leaves `draft`, made (if missing) the first time units are
        looked at, so a member who qualifies later appears too. It starts
        with empty `choices` and no `registered_by_login`; with options to
        choose, empty `choices` means nobody has chosen yet.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DistributionUnit" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Ask for a unit
      description: >
        Any member can ask for one for themselves or, with
        `beneficiary_login`, for somebody else (a parent for a child, a
        friend for another): the unit is then for that person, and
        `registered_by_login`/`registered_at` keep who really did it. Both the
        beneficiary and, unless admin/board, the caller have to be eligible
        (409 not_eligible): members on the distribution's cutoff date, or
        today's members when it has none. An extra
        belongs to whoever it is entered for; who finally gets the item isn't
        recorded. A person can
        have one unit of their own (409 already_registered); in a
        distribution for all members it already exists, so asking for it means
        choosing its options when nobody has yet — the caller becomes who
        entered it — and is a 409 already_registered otherwise. With
        `is_extra`, a person can also have extras up to `max_extra` counted by who they are for
        (409 extras_not_allowed, too_many_extras), at the extra price.
        `choices` must give exactly one listed value for each option (400
        invalid_choices). In a distribution with articles, say which one with
        `article_id` and how many with `quantity` (1 to 100000; 400
        article_required, unknown_article, invalid_quantity): a person can
        ask for as many as they want, as many times as they want — asking
        again adds to their row of that article that is still to be collected
        (whatever is paid in it stays as it was, so what is added is still to
        pay) or, if every one was collected, makes a new row; changing a
        quantity is also possible with a PATCH. There may be a limit on the
        article as a whole, and asking for more than are left is 409
        article_exhausted; more than the article's `max_per_person`, counting
        every row the person has of it, is 409 article_person_limit. No extras,
        no choices.
        Members can only do it while the distribution is
        `open` and before `closes_at`; admin, board and material can do it at
        any time but in a draft, so also after the deadline and while it is
        closed or done (409 not_open otherwise, and always in a draft).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                beneficiary_login: { type: string, description: Defaults to the caller. }
                is_extra: { type: boolean, default: false }
                article_id: { type: integer, description: Only in a distribution with articles, and then required. }
                quantity: { type: integer, description: How many of the article; only in a distribution with articles, and then required. }
                choices:
                  type: object
                  additionalProperties: { type: string }
                  description: 'Option name to the value chosen, e.g. {"Talla": "M"}.'
      responses:
        "201":
          description: Unit created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: invalid_choices, article_required, unknown_article or invalid_quantity. }
        "404": { description: The distribution (or a draft, for a member) or the beneficiary doesn't exist. }
        "409": { description: not_open, not_eligible, already_registered, extras_not_allowed, too_many_extras, article_exhausted or article_person_limit. }

  /distributions/{id}/units/{unitID}/identifiers/assign:
    post:
      summary: Give a row the next free numbers
      description: >
        Requires admin, board or material, and the distribution not a draft.
        For a row of an article whose numbers are described (400
        article_not_numbered otherwise): gives it as many of the next free
        numbers as it still lacks to have one per unit, in the order the numbers
        are listed (the first part changing slowest), keeping those it has
        (409 not_enough_numbers if there are fewer free).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The updated unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: article_not_numbered. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_deliverable, not_enough_numbers or identifier_taken. }

  /distributions/{id}/articles/{articleID}/numbers:
    get:
      summary: Every number of an article and who has it
      description: >
        Requires admin, board or material. For an article whose numbers are
        described (400 article_not_numbered otherwise; 400 unknown_article):
        every item that exists, in order, with the person it was given to when
        somebody has it, and how many are given and free.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: articleID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The numbers
          content:
            application/json:
              schema:
                type: object
                properties:
                  article_id: { type: integer }
                  fields:
                    type: array
                    items: { $ref: "#/components/schemas/IdentifierField" }
                  total: { type: integer }
                  assigned: { type: integer }
                  free: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        identifier: { type: string, description: One value of each part joined by a slash. }
                        unit_id: { type: integer }
                        beneficiary_login: { type: string }
                        beneficiary_name: { type: string }
        "400": { description: article_not_numbered or unknown_article. }
        "404": { $ref: "#/components/responses/NotFound" }

  /distributions/{id}/units/{unitID}/identifiers:
    post:
      summary: Give a row more numbers
      description: >
        Requires admin, board or material, and the distribution not a draft.
        Adds the `identifiers` (ranges are fine where the numbers are
        described) to those the row has: each has to exist, not be taken
        (409 identifier_taken) nor repeated, and they can't be more than the
        row's quantity (400 invalid_identifiers). Only the items that have a
        number can be paid or handed out.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiers: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: invalid_identifiers. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_deliverable or identifier_taken. }
    delete:
      summary: Take numbers off a row
      description: >
        Requires admin, board or material, and the distribution not a draft.
        Takes the `identifiers` query (comma-separated, ranges allowed) off the
        row, which has to have them and not have paid or handed them out (400
        invalid_identifiers): they are free again.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
        - { name: identifiers, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The updated unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: invalid_identifiers. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_deliverable. }
    put:
      summary: Write down the numbers of the items handed out
      description: >
        Requires admin, board or material, and the distribution not
        a `draft` (409 not_deliverable). Replaces the numbers (serial numbers, series and
        fraction...) of a row of an article with `has_identifiers`: none empty
        or repeated, no more than the row's quantity, each at most 60
        characters (400 invalid_identifiers, also for a row of any other
        article). Where the article's numbers are described, each has to be one
        that exists — one value of each part joined by a slash, "124/3", or
        "0007" for one part — and a range may be typed instead of listing
        them: the last part by position in its values, "0010-0020",
        "133/9-10" (so a gap in the values is respected). Fewer than the quantity can be saved and completed later,
        but a row can't be collected (409 identifiers_missing on
        `POST .../pickups`) until it has all of them. A number is unique within
        its article, whoever has it (409 identifier_taken).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiers: { type: array, items: { type: string } }
      responses:
        "200":
          description: The updated unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: invalid_identifiers. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_deliverable or identifier_taken. }

  /distributions/{id}/units/{unitID}:
    patch:
      summary: Change what was chosen for a unit, or how many
      description: >
        Only `choices` can change (who entered it and when stay) — or, for a
        row of an article, only `quantity` (400 invalid_quantity for the
        other one, or one outside 1 to 100000), under the article's limit
        (409 article_exhausted, article_person_limit). Allowed to
        the person it is for, whoever entered it, and admin/board/material, under the
        same open rules as asking for it (admin/board/material also after the
        deadline, and while it is closed or done). What is handed out can't be taken from under its owner
        (409 unit_locked, also in any unit that isn't a row of an article);
        in a row of an article admin/board/material can change it but not below
        what was handed out (409 quantity_below_delivered), nor below the numbers
        assigned to it (409 quantity_below_numbered). A paid one only
        changes through admin/board/material.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                choices: { type: object, additionalProperties: { type: string } }
                quantity: { type: integer, description: For a row of an article, instead of choices. }
      responses:
        "200":
          description: The updated unit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: invalid_choices or invalid_quantity. }
        "403": { description: Neither the person it is for, whoever entered it, nor admin/board/material. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_open, unit_locked, quantity_below_paid, article_exhausted or article_person_limit. }
    delete:
      summary: Remove a unit
      description: >
        Same permissions and rules as changing its choices — except that a
        member's own unit in a distribution for all members can't be removed
        (409 automatic_unit): it exists for everybody who qualifies — and one with
        something paid can't be removed at all (409 unit_paid): take the payment
        off first, which records it in the accounting.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "403": { description: Neither the person it is for, whoever entered it, nor admin/board/material. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_open, unit_locked, automatic_unit or unit_paid. }

  /distributions/{id}/order:
    get:
      summary: What has to be ordered
      description: >
        Requires admin, board or material. The units added up by combination
        of choices (`lines`) and the totals. In a distribution for all
        members everybody who qualifies has a unit, so those nobody has chosen
        the options of yet add up in a line with empty `choices`. For one
        still in `draft`, which has no units yet (they are made when it
        opens), the summary already counts one per member on the cutoff
        date, without making them, and says so with `provisional: true`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionOrder" }
        "403": { description: Not admin, board or material. }
        "404": { $ref: "#/components/responses/NotFound" }

  /distributions/{id}/pickups:
    post:
      summary: Record that units were collected
      description: >
        Requires admin, board or material, and the distribution not
        a `draft` (409 not_deliverable). A row of units can be collected in
        part: each entry of `deliveries` hands out `quantity` units of a row
        (all that are still to go when it is left out), and each id of
        `unit_ids` all that is still to go of its row. For an article with
        numbers the units are items, so only those with an assigned number can
        go: the given `identifiers` (assigned to the row and not delivered;
        ranges are fine where the numbers are described), or else the first
        assigned ones not delivered — all of them without a quantity — there
        having to be that many (409 identifiers_missing; with `assign_numbers` the missing ones
        are first given from the next free, for articles whose numbers are
        described). They are handed to `picked_up_by_login` — not necessarily
        their beneficiary, as when somebody collects for others, but a member
        now or on the cutoff date (409 invalid_collector) — and the caller is
        kept as who wrote it down. All or nothing: an id that isn't a unit of
        this distribution is a 404, more units than are still to go a 409
        already_picked_up (naming the numbers when they were given: one already
        handed out, that way) and a number the row doesn't have a 400
        identifier_not_assigned.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [picked_up_by_login]
              properties:
                unit_ids: { type: array, items: { type: integer } }
                deliveries:
                  type: array
                  items:
                    type: object
                    required: [unit_id]
                    properties:
                      unit_id: { type: integer }
                      quantity: { type: integer, description: How many units of the row; all that are left when omitted. }
                      identifiers: { type: array, items: { type: string }, description: Which numbers go, for an article with numbers; their count is the quantity. }
                picked_up_by_login: { type: string }
                assign_numbers: { type: boolean, description: Give the next free numbers first to the units of articles with described numbers that lack some, in the order listed. }
      responses:
        "204": { description: Recorded }
        "400": { description: no_units. }
        "403": { description: Not admin, board or material. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_deliverable, invalid_collector, already_picked_up or identifiers_missing (a row of an article with numbers needs all of them first). }

  /distributions/{id}/units/{unitID}/pickup:
    delete:
      summary: Undo a collection
      description: >
        Requires admin, board or material. The units go back to not being
        handed out — they stay in the order, and their numbers stay assigned
        — `quantity` of them, the given delivered `identifiers`, or all that
        were (400 invalid_quantity for more than were; a number the row doesn't
        have is 400 identifier_not_assigned, one that isn't handed out 409
        identifier_not_delivered, naming them at the end of the message). To
        take units back for good, see `.../return`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
        - { name: quantity, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: identifiers, in: query, required: false, schema: { type: string }, description: Comma-separated numbers. }
      responses:
        "204": { description: Undone }
        "403": { description: Not admin, board or material. }
        "404": { $ref: "#/components/responses/NotFound" }

  /distributions/{id}/units/{unitID}/return:
    post:
      summary: Return units that were handed out
      description: >
        Requires admin, board or material, and the distribution not a draft
        (409 not_deliverable). Takes back `quantity` of the units handed out
        (the given delivered `identifiers`; or, when neither is said, all
        that can be): they leave the order — it gets smaller, and the row is
        deleted when nothing is left — and their numbers are free again.
        Paid units can't be returned: in an article with numbers it is the
        items that are paid, so a paid one is refused (409 quantity_below_paid)
        and only the delivered and unpaid ones can come back; elsewhere the
        order can't end up smaller than what is paid. Nor can more come back
        than was handed out (400 invalid_quantity). A number the row doesn't have
        is 400 identifier_not_assigned and one that isn't handed out 409
        identifier_not_delivered, naming them at the end of the message.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity: { type: integer }
                identifiers: { type: array, items: { type: string } }
      responses:
        "204": { description: Returned }
        "400": { description: invalid_quantity or invalid_identifiers. }
        "403": { description: Not admin, board or material. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_deliverable or quantity_below_paid. }

  /distributions/{id}/sales:
    post:
      summary: Sell over the counter
      description: >
        Requires admin or board. For a distribution with articles that is no
        longer a draft: enters the order for `beneficiary_login` (who has to be
        eligible, 409 not_eligible), gives it its numbers (the `identifiers`
        asked for first, then the next free ones, for articles whose numbers
        are described; free-text numbers have to be written in `identifiers`,
        409 identifiers_missing), marks it paid in `account_id` when `paid` (the
        account is required if the article costs something) and hands it to the
        person when `delivered`. If a step fails, what the sale did before is
        undone. If the person already had a row of the article, only what the
        sale adds is paid and handed out.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beneficiary_login, article_id, quantity]
              properties:
                beneficiary_login: { type: string }
                article_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
                identifiers: { type: array, items: { type: string } }
                paid: { type: boolean }
                account_id: { type: integer }
                delivered: { type: boolean }
      responses:
        "201":
          description: The person's row of the article, after the sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionUnit" }
        "400": { description: account_required, unknown_account, account_not_asset, invalid_quantity, invalid_identifiers or article_required. }
        "403": { description: Neither admin nor board. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: not_eligible, not_deliverable, article_exhausted, article_person_limit, not_enough_numbers, identifier_taken or identifiers_missing. }

  /distributions/{id}/payments:
    get:
      summary: List the payments of a distribution
      description: >
        Requires admin or board (it says who paid what). Every payment marked in
        the distribution, newest first: when, who wrote it down, whose order it
        was for (the person who paid), what it was and how many units, the money,
        the numbers it was about, and `total_after`, what the distribution had
        collected up to and including the entry. Taking a payment off is an entry
        with the signs changed. `total_after` is summed over the distribution's whole history,
        so it doesn't restart at the edge of a filter or a page. Narrowed by an
        inclusive range `from`/`to` (YYYY-MM-DD; 400 invalid_date,
        invalid_date_range) and paged by `limit`/`offset` (default 50, at most
        100). What was paid before this list existed is one entry per order, at
        the date of its last payment.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DistributionPayment" }
        "400": { description: invalid_date or invalid_date_range. }
        "403": { description: Neither admin nor board. }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Mark units as paid
      description: >
        Requires admin or board. A row of units can be paid in part: each
        entry of `payments` marks `quantity` units of a row as paid (all that
        are still pending when it is left out), and each id of `unit_ids` all
        that is pending of its row; they can come together. What is marked is
        added to what was paid, keeping when and by whom; all or nothing (404
        for an id that isn't a unit of this distribution; 409 already_paid for
        more units than are pending, or a row with none pending; 400
        invalid_quantity). In a row of an article with numbers it is the items
        that are paid, and only those with a number (assigned) can be: the
        given `identifiers` (ranges are fine where the numbers are described),
        or else the first assigned and unpaid — all of them without a quantity,
        and `unit_ids` means all that have a number — and asking for more than
        have a number is 409 identifiers_missing. A number the row doesn't have
        is 400 identifier_not_assigned, one that is paid already 409 already_paid,
        naming them at the end of the message.

        Every payment is recorded in the accounting: `account_id` is the asset
        account (type `asset`) the money was paid into, and one transaction is
        written between it and the distribution's account (its own `account_id`
        or else the one marked `distribution_default`), for each person the
        payment was for, with a description in Spanish saying what was paid and
        by whom. The entries of the list of payments point at it
        (`transaction_id`). Nothing is recorded, and no account is needed, for
        what costs nothing. 400 account_required (money with no account),
        unknown_account, account_not_asset; 409 no_distribution_account (neither the
        distribution nor the default has one). The distribution's own account and the
        default one have to be of type `income` (400 account_not_income on a distribution,
        409 not_income_for_distributions on an account).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { type: integer, nullable: true, description: The asset account the money was paid into; required unless everything paid is free. }
                unit_ids: { type: array, items: { type: integer } }
                payments:
                  type: array
                  items:
                    type: object
                    required: [unit_id]
                    properties:
                      unit_id: { type: integer }
                      quantity: { type: integer, description: How many units of the row; all that are pending when left out. }
                      identifiers: { type: array, items: { type: string }, description: Which numbers are paid, in an article with numbers; ranges allowed where they are described. }
      responses:
        "204": { description: Marked }
        "400": { description: no_units, account_required, unknown_account or account_not_asset. }
        "403": { description: Neither admin nor board. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: already_paid, no_distribution_account or account_has_children (the account paid in, or the one the payments go to, groups other accounts). }

  /distributions/{id}/units/{unitID}/payment/reversal:
    post:
      summary: Take off the payment of a unit
      description: >
        Requires admin or board. Nothing is deleted: the reverse is recorded, like the payment was,
        in the log of payments (an entry of the other sign) and in the accounting, as the
        transaction with the signs changed. Takes `quantity` units off what is paid in the
        row, the given paid `identifiers`, or all of it without either (400
        invalid_quantity for fewer than one or more than are paid). A number the row doesn't have is
        400 identifier_not_assigned and one that isn't paid 409 identifier_not_paid,
        naming them at the end of the message. `account_id` is the asset account the money goes
        back from (same errors as POST /distributions/{id}/payments).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: unitID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id: { type: integer, description: The asset account the money goes back from; required unless the units cost nothing. }
                quantity: { type: integer, minimum: 1 }
                identifiers: { type: array, items: { type: string }, description: Numbers (ranges allowed where described). }
      responses:
        "204": { description: Taken off }
        "400": { description: account_required, unknown_account, account_not_asset, invalid_quantity, identifier_not_assigned or invalid_body. }
        "403": { description: Neither admin nor board. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: no_distribution_account or identifier_not_paid. }

  /users/{login}/material/movements:
    get:
      summary: List a person's material movement history
      description: >
        Every purchase, rental and loan this person has ever made,
        regardless of status (acquisition/loss/abandonment/retirement
        movements have no recipient, so they never appear here). The
        person themselves can view their own; anyone else needs admin,
        board, or the material role — a movement can carry a price, so
        it's treated like GET /material/movements rather than activity
        participation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: This person's movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }
        "403": { description: Neither the person themselves nor admin/board/material. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/files:
    get:
      summary: List a directory inside a person's own files
      description: >
        Browses this person's own personal documents (a scanned DNI, a
        signed waiver, medical paperwork...) — a plain directory tree on
        disk (config.UserFilesRoot), one subdirectory per login, not
        anything stored in the database. Unlike GET /library, this is
        *not* open to every baseline role: only the person themselves,
        or admin/board, may browse it (403 forbidden otherwise) — a
        login that doesn't belong to anyone at all is 404 instead. path
        defaults to that person's own root when omitted; every path is
        resolved and checked against that root server-side, so one that
        tries to escape it (a "..", an absolute path, a symlink pointing
        outside) either lands back inside it or is rejected — see the
        UserFileListing schema and 400 invalid_path below. Dotfiles are
        never listed. A person with no subdirectory of their own yet —
        the common case, until someone drops a file in for them — gets
        an empty listing at their own root rather than a 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Slash-separated path, relative to this person's own root.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserFileListing" }
        "400":
          description: invalid_path (escapes this person's own root) or not_a_directory (path names a file).
        "403": { description: Neither the person themselves nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/files/file/{path}:
    get:
      summary: Read or download one of a person's own files
      description: >
        Streams a document's raw bytes with a best-effort Content-Type,
        same as GET /library/file/{path} — supports HTTP Range requests,
        and the same path resolution, root confinement, and
        self-or-admin/board access check as GET /users/{login}/files.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: >
            Slash-separated file path, relative to this person's own
            root — a wildcard capturing every remaining URL segment
            (e.g. Licencias/2024-federativa.md), not a single path
            parameter; each segment must be percent-encoded on its own,
            the slashes between them left literal.
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", sets Content-Disposition to attachment (a Save dialog) instead of inline.
      responses:
        "200":
          description: The file's raw content.
        "400":
          description: invalid_path (escapes this person's own root) or not_a_file (path names a directory).
        "403": { description: Neither the person themselves nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /material/items:
    get:
      summary: List material items
      description: Open to any baseline role.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      summary: Add an item to the catalog
      description: Requires the admin, board or material role.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemInput" }
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400":
          description: >
            invalid_body, invalid_date (acquired_at not YYYY-MM-DD), unknown_type
            (type_id isn't in GET /material/types), single_unit_item
            (total_quantity above 1 for a rope or bag — they're always
            exactly one individually-tracked object), or
            invalid_item_fields (the given fields don't fit the kind of
            the item's type: its own required shape — a rope needs rope_type/diameter_mm/
            manufacture_year/length_m in addition to brand/model/code,
            a bag needs bag_type/capacity_liters, and none of a rope or bag's own
            fields may be set on the other two kinds), or
            model_without_brand (a model was given without a brand), or
            invalid_item_code (a code made only of digits; an empty one is the same as none), or
            item_description_required (a general item whose type requires a description has none),
            missing_attribute (a required attribute of the type has no value) or
            invalid_attribute (an attribute that is not the type's, given twice, an option of
            another attribute, or a value of the wrong kind).
        "409": >
          duplicate_item_code — another item already has that code; or duplicate_material —
          another item is exactly the same (same type, brand, model, code, description and
          attributes: more units of it are a stock of more than one, added with an acquisition).

  /material/items/{id}:
    put:
      summary: Edit an item
      description: >
        Requires the admin, board or material role. Replaces every editable field (brand, model, code,
        description, loanable, the prices and the fields of its own kind) with the body's. type_id may
        be left out to keep the type; general material can move to another general type, but a rope
        or a bag stays Cuerda or Saca and nothing becomes one of them (400 kind_change). The
        quantities are not editable (they are whatever its movements say), so a total_quantity in
        the body is ignored. The same constraints as when it was created apply, and the attributes
        are resent in full (the ones left out are removed).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemInput" }
      responses:
        "200":
          description: The item as edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { description: "invalid_id, invalid_body, unknown_type, kind_change, invalid_item_fields, model_without_brand, invalid_item_code (a code made only of digits), item_description_required, missing_attribute or invalid_attribute." }
        "403": { description: Requires admin, board or material. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_item_code — another item already has that code; or duplicate_material — another item is exactly the same. }
    delete:
      summary: Delete an item
      description: >
        Admin only. Only an item with no history can be deleted: the
        acquisition it was created with goes with it, but any other movement (a loan, a rental, a
        sale, more stock, a loss...) makes it refuse.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: item_has_movements — it has movements besides its first acquisition. }

  /material/types:
    get:
      summary: List the types of material
      description: >
        Any baseline role (admin, board or member), like GET /material/items, whose items each
        name one of these. Cuerda (kind rope) and Saca (kind
        bag) come first, then the rest (kind general) by name. Each carries its attributes (in the
        order their values are written in an item's name) with the options of the enum ones.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Types
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaterialType" }
    post:
      summary: Add a material type
      description: Admin only. The name is trimmed; a type added is always general and starts with no attributes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description_required:
                  type: boolean
                  default: true
                  description: Whether the items of the type must have a description.
      responses:
        "201":
          description: The type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialType" }
        "400": { description: invalid_body (also a blank name). }
        "403": { description: Requires admin. }
        "409": { description: duplicate_type — another type has that name. }

  /material/types/{id}:
    patch:
      summary: Edit a material type
      description: >
        Admin only. Renames it and/or changes whether its items must have a description (a field left
        out stays as it is; at least one is needed). Its items follow, since they point at its id.
        Cuerda and Saca are fixed. Making the description required does not touch the items that
        have none: they are listed as incomplete until edited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description_required: { type: boolean }
      responses:
        "200":
          description: The type as edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialType" }
        "400": { description: invalid_id or invalid_body (also a blank name). }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_type — another type has that name. }
    delete:
      summary: Delete a material type
      description: >
        Admin only. Refused while any item has it, and always for Cuerda and Saca. Its attributes
        and their options go with it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: type_in_use — some item has it; or fixed_type — it is Cuerda or Saca. }

  /material/types/{id}/attributes:
    post:
      summary: Add an attribute to a material type
      description: >
        Admin only. The attribute goes at the end of the type's list. Only general types have
        attributes. data_type is text (any value) or enum (one of a list of options, given here in
        options or added later). It cannot be changed afterwards.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, data_type]
              properties:
                name: { type: string }
                data_type: { type: string, enum: [text, enum] }
                required: { type: boolean, default: false }
                options: { type: array, items: { type: string }, description: Only for enum. }
      responses:
        "201":
          description: The attribute
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialAttribute" }
        "400": { description: invalid_id or invalid_body (a blank name, a data_type that is neither text nor enum, options for a text attribute). }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_attribute — the type has one with that name; duplicate_option — repeated options; fixed_type — Cuerda and Saca have no attributes. }

  /material/types/{id}/attributes/order:
    put:
      summary: Reorder the attributes of a material type
      description: >
        Admin only. attribute_ids must be every attribute of the type exactly once; the order is the
        one in which the values are written in an item's name.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attribute_ids]
              properties:
                attribute_ids: { type: array, items: { type: integer } }
      responses:
        "200":
          description: The type with its attributes in the new order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialType" }
        "400": { description: invalid_id or invalid_body (the list is not exactly the type's attributes). }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }

  /material/attributes/{id}:
    patch:
      summary: Edit an attribute
      description: >
        Admin only. Renames it and/or makes it required or optional (a field left out stays as it is;
        at least one is needed). Making it required does not touch the items without a value: they
        are listed as incomplete until edited.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                required: { type: boolean }
      responses:
        "200":
          description: The attribute as edited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialAttribute" }
        "400": { description: invalid_id or invalid_body. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_attribute — the type has another one with that name. }
    delete:
      summary: Delete an attribute
      description: >
        Admin only. The value every item of the type has for it goes too. Refused if that would leave
        two items exactly the same.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: would_duplicate_items — two items of the type would become the same. }

  /material/attributes/{id}/options:
    post:
      summary: Add an option to an enum attribute
      description: Admin only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "201":
          description: The option
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialAttributeOption" }
        "400": { description: invalid_id or invalid_body (a blank label, or the attribute is not an enum one). }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_option — the attribute has one with that label. }

  /material/options/{id}:
    patch:
      summary: Rename an option
      description: Admin only. The items that have it follow, since they point at its id.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string }
      responses:
        "200":
          description: The option as renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaterialAttributeOption" }
        "400": { description: invalid_id or invalid_body. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_option. }
    delete:
      summary: Delete an option
      description: Admin only. Refused while any item has it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: option_in_use — some item has it. }

  /material/items/{id}/movements:
    get:
      summary: List an item's movement history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Movements for this item
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }
        "400": { description: invalid_id — id isn't numeric. }

  /material/movements:
    get:
      summary: List movements (defaults to active ones, or by activity)
      description: >
        Requires the admin, board, or material role. With no
        activity_id, lists by status (default active — in practice only
        ever rentals, since loan/return always settle immediately).
        With activity_id, lists every movement tied to that activity
        instead (status is ignored) — chiefly loan and return, which is
        what the activity page's own material listing is built from,
        computing what's still outstanding item by item client-side.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, completed, overdue, cancelled], default: active }, description: Ignored when activity_id is given. }
        - { name: activity_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }
        "400": { description: invalid_activity_id — activity_id isn't numeric. }
    post:
      summary: Record a movement against an item
      description: >
        Requires the admin, board, or material role. rental exchanges
        the item with a specific person and requires login; loan,
        sale and return's logins are optional — a loan or return's
        mandatory link is the activity it's part of (see activity_id
        below), not necessarily one specific person, and not every sale
        is tied to a socio either. acquisition (new stock in), loss,
        abandonment and retirement (stock permanently gone with no sale
        behind it, or material taken out of service) never have a recipient
        at all — giving one is rejected (recipient_not_allowed), not
        just ignored. activity_id is required for loan and return
        (optional for everything else, rental included — a rental isn't
        always tied to one specific activity the way a loan always is).
        return isn't linked to any one specific loan row — it's
        validated against how much of that item this activity still has
        outstanding overall (every loan minus every return, for that
        item and activity together): lending 10 then 15 more, then
        returning 20 followed by the remaining 5, is a perfectly valid
        sequence. recorded_by_login (the caller) is set automatically,
        never chosen by the caller — same for price, which always comes
        from the item's own rental_price_per_week/sale_price (null
        except for rental/sale), never from the request body. quantity
        is forced to 1 for a rope or bag item, since they're
        individually tracked (always exactly one unit); acquisition is
        rejected outright for them (single_unit_item) — a new rope or
        saca is a new item, not more stock on an existing one.
        total_quantity/available_quantity/outstanding_loan_quantity on
        the item are always recomputed from its movement history, never
        stored, so they can never drift from what this endpoint
        actually recorded.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_id, type]
              properties:
                item_id: { type: integer }
                login:
                  type: string
                  description: >
                    The movement's recipient. Required for rental;
                    optional for loan/sale/return; rejected outright
                    (recipient_not_allowed) for acquisition/loss/
                    abandonment/retirement.
                type: { type: string, enum: [loan, rental, sale, acquisition, loss, abandonment, retirement, return] }
                quantity: { type: integer, default: 1, description: Forced to 1 for a rope or bag item. }
                transacted_at: { type: string, format: date, description: Defaults to today; can be backdated. }
                activity_id:
                  type: integer
                  nullable: true
                  description: Required for loan and return; optional otherwise.
                notes:
                  type: string
                  nullable: true
                  description: >
                    Free text, mainly useful on loss/abandonment/
                    retirement to say why.
      responses:
        "201":
          description: Movement created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movement" }
        "400":
          description: >
            invalid_body, invalid_date (transacted_at not YYYY-MM-DD),
            invalid_type, login_required (rental without a login),
            recipient_not_allowed (a login given for
            acquisition/loss/abandonment/retirement), or
            activity_required (loan or return without activity_id).
        "404":
          description: not_found (item_id doesn't exist), or the given login doesn't belong to anyone.
        "409":
          description: >
            insufficient_stock (not enough available quantity),
            not_loanable (the item's loanable flag is false) for a
            loan, not_rentable/not_sellable (the item has no
            rental_price_per_week/sale_price on file) for a rental or
            sale, single_unit_item (an acquisition against a rope or
            bag item), return_exceeds_loaned (a return larger than
            what this item still has outstanding for this activity),
            recipient_not_member (a loan or a rental for somebody who
            is not a member now) or recipient_not_member_or_former (a
            sale for somebody who is neither a member nor a former one).

  /material/movements/{id}:
    delete:
      summary: Delete a movement
      description: >
        Admin only. For a movement recorded by mistake. Stock is never stored, it is what the
        movements add up to, so the delete is refused (409 movement_needed) when others depend on it:
        it would leave a negative stock (an acquisition or a return that later sales or loans were
        made on) or, for some activity, more returned than lent. The item's status is recomputed
        afterwards (deleting the sale that emptied it makes it available again).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id. }
        "403": { description: Requires admin. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: movement_needed — other movements depend on it. }

  /material/movements/{id}/return:
    post:
      summary: Record a return against an active rental
      description: >
        Requires the admin, board, or material role. Closes an active
        rental — the only type that still reaches status active (every
        other type, loan included, settles the moment it's recorded) —
        always all of it at once; there's no partial rental return. A
        loan's return is a separate 'return' movement instead
        (POST /material/movements, type return), validated per item and activity
        rather than closing any one loan row. Returning anything else —
        or an unknown id, or an already-closed movement — is reported
        the same way: not_found.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movement" }
        "400": { description: invalid_id — id isn't numeric. }
        "404":
          description: not_found — no active rental with this id.

  /library:
    get:
      summary: List a document library directory
      description: >
        Browses the club's document library (estatutos, reglamentos,
        normativas, memorias de actividades, actas...) — a plain
        directory tree on disk (config.LibraryRoot), not anything stored
        in the database. Open to any baseline role (admin/board/member),
        read-only: there's no way to upload, rename, or delete anything
        through this API. path defaults to the library's root when
        omitted; every path is resolved and checked against root
        server-side, so one that tries to escape it (a "..", an absolute
        path, a symlink pointing outside) either lands back inside root
        or is rejected — see the Listing schema and 400 invalid_path
        below. Dotfiles are never listed.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Slash-separated, root-relative directory path.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryListing" }
        "400":
          description: invalid_path (escapes root) or not_a_directory (path names a file).
        "404": { $ref: "#/components/responses/NotFound" }

  /library/file/{path}:
    get:
      summary: Read or download a document
      description: >
        Streams a document's raw bytes with a best-effort Content-Type
        (registered explicitly for a few extensions — .md, .docx, .odt...
        — Go's mime package and the API image's minimal /etc/mime.types
        don't otherwise agree on) so the frontend can either render it
        itself (Markdown) or hand it to the browser (PDF, image, HTML).
        Supports HTTP Range requests. Same path resolution and root
        confinement as GET /library.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      parameters:
        - name: path
          in: path
          required: true
          schema: { type: string }
          description: >
            Slash-separated, root-relative file path — a wildcard
            capturing every remaining URL segment (e.g.
            Actas/2026-02-01.pdf), not a single path parameter; each
            segment must be percent-encoded on its own, the slashes
            between them left literal.
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", sets Content-Disposition to attachment (a Save dialog) instead of inline.
      responses:
        "200":
          description: The file's raw content.
        "400":
          description: invalid_path (escapes root) or not_a_file (path names a directory).
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts:
    get:
      summary: List the chart of accounts
      description: >
        Open to admin, board, and plain members alike — the club's own
        money is something every socio can see, not just admin/board.
        Ordered as a pre-order depth-first walk of the tree — each
        top-level account in its own display order (see POST
        /accounts/{id}/move), immediately followed by all of its own
        descendants (recursively, each in their own order) before the
        next top-level account. Each account also carries its own direct
        balance and last_transaction_at (see the Account schema) — not
        present on any other accounts endpoint.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Every account, in the tree order described above
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
    post:
      summary: Create an account
      description: >
        Requires admin or the optional "money" role (seeded by migration
        00012_accounting.sql, not a system role — a club that doesn't
        want this distinction can delete it and keep using admin
        instead), the same "admin plus one optional custom role" shape
        the material role already has for material movements. Like
        every route, also requires a baseline role (admin/board/member)
        regardless — holding only "money" with none of those is
        rejected everywhere, this included.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                code:
                  type: string
                  nullable: true
                  description: >
                    Optional — unique across every account when given, but
                    not every account needs one (a purely organizational
                    grouping node might never get one). Omitted, null, or
                    blank all mean the same thing: no code.
                parent_id: { type: integer, nullable: true }
                type:
                  type: string
                  enum: [asset, income, expense]
                  nullable: true
                  description: >
                    Optional — what the account is mainly for: asset (its
                    balance is money the club really has), income (used
                    mainly for what comes in) or expense (mainly for what
                    goes out). Omitted, null, or blank all mean no type.
                    Nothing acts on it yet; it is only shown.
                allows_dues:
                  type: boolean
                  default: false
                  description: >
                    Marks this account as one a transaction can use to
                    record membership dues (cuotas anuales): see POST
                    /users/{login}/dues. Omitted means false. The account has
                    to be of type income, its own or inherited, else 409
                    not_income_for_dues_licenses (the same for allows_licenses).
                allows_licenses:
                  type: boolean
                  default: false
                  description: >
                    Marks this account as one a transaction can use to
                    record federative licenses: see POST
                    /users/{login}/licenses. Omitted means false.
                distribution_default:
                  type: boolean
                  default: false
                  description: >
                    Marks this account (which has to be of type income, else 409
                    not_income_for_distributions) as the one the payments of distributions
                    without an account of their own are recorded in. Only one
                    account has it: marking this one takes the mark off the other.
                hidden:
                  type: boolean
                  default: false
                  description: >
                    Marks the account as no longer used (closed, obsolete).
                    Purely informational for clients: the API still lists,
                    reads, edits and posts to it like any other. Omitted
                    means false.
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400":
          description: invalid_body, missing_fields (name is empty), invalid_type (not asset, income or expense), or unknown_parent_account (parent_id names no existing account)
        "403": { description: Requires admin or the money role. }
        "409": { description: duplicate_code — another account already has this code — or parent_has_entries — the parent already has transactions (an account has children or transactions, never both). }

  /accounts/{id}:
    get:
      summary: Get a single account
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: invalid_id — id isn't numeric. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Correct an account's name, code, parent, or what it's for
      description: >
        Requires admin or the money role (see POST /accounts).
        name/code/parent_id/type/allows_dues/allows_licenses/distribution_default/hidden always replace
        the current values — omitting, nulling, or blanking code or type clears
        it, the same as an account that never had one, and omitting
        any flag turns it off rather than keeping it (400 invalid_type for a
        type that isn't asset, income or expense).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                code: { type: string, nullable: true }
                parent_id: { type: integer, nullable: true }
                type: { type: string, enum: [asset, income, expense], nullable: true }
                allows_dues: { type: boolean, default: false }
                allows_licenses: { type: boolean, default: false }
                distribution_default: { type: boolean, default: false }
                hidden: { type: boolean, default: false }
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "400": { description: invalid_id, invalid_body, missing_fields (name is empty), or unknown_parent_account. }
        "403": { description: Requires admin or the money role. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: duplicate_code, circular_parent (parent_id is this account itself, or one of its own descendants), or parent_has_entries (the new parent already has transactions). }
    delete:
      summary: Delete an account
      description: >
        Requires admin or the money role. Rejected outright
        (account_in_use) if this account is still referenced by a child
        account (its own parent_id) or a posted transaction entry —
        deleting it would either orphan that subtree or silently erase
        financial history.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id — id isn't numeric. }
        "403": { description: Requires admin or the money role. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: account_in_use — still referenced by a child account or a transaction entry. }

  /accounts/{id}/transactions:
    get:
      summary: This account's own ledger
      description: >
        For an account that has child accounts (and so no entries of its own), the
        entries of all its descendants instead, each with the account it is on, and
        balance_after is the running total of all of them together, in date order.
        The entries posted against this one account, a page at a time
        (limit/offset, newest first) and optionally within a from/to date
        range — an account holds thousands after a few years, so this
        never answers with all of them. Each carrying
        its own transaction's date/description and this account's own
        running balance once that entry is applied — not a generic
        cross-account listing (see GET /transactions for that). Listed
        newest first, same as GET /transactions itself, even though
        balance_after is necessarily computed oldest-first internally —
        over the whole account, not the page, so it doesn't restart from
        zero at a page or range boundary. Open to any baseline role, same
        as everything else read-only in this package. A malformed date, or
        a to before from, is a 400 invalid_date / invalid_date_range.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 }, description: Page size; a value outside 1-100 falls back to 50. }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: How many entries to skip, newest first; a negative value falls back to 0. }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Only what occurred on or after this day (YYYY-MM-DD)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Only what occurred on or before this day (YYYY-MM-DD)." }
        - { name: q, in: query, schema: { type: string }, description: "Words (separated by spaces) that must all appear in the description, in any order, ignoring case and accents." }
      responses:
        "200":
          description: This account's own entries, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountEntry" }
        "400": { description: invalid_id, invalid_date (from or to isn't YYYY-MM-DD) or invalid_date_range (to is before from). }
        "404": { $ref: "#/components/responses/NotFound" }

  /accounts/{id}/move:
    post:
      summary: Swap an account's display order with an adjacent sibling
      description: >
        Requires admin or the money role. direction "up" swaps this
        account with the sibling (same parent_id, NULL included)
        immediately before it in GET /accounts's own order; "down" the
        one immediately after. A harmless no-op if there's no such
        sibling — this account is already first or last within its own
        parent_id group in that direction. Never reaches across to an
        account with a different parent_id. Answers with the whole,
        freshly reordered GET /accounts list, not just this account, so
        a caller can re-render from this response directly.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: string, enum: [up, down] }
      responses:
        "200":
          description: Every account, in its new order (see GET /accounts)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Account" }
        "400": { description: invalid_id, invalid_body, or invalid_direction (direction wasn't "up" or "down"). }
        "403": { description: Requires admin or the money role. }
        "404": { $ref: "#/components/responses/NotFound" }

  /transactions:
    get:
      summary: List transactions, most recently occurred first
      description: Open to admin, board, and plain members alike, same as GET /accounts. Each transaction carries its own entries inline.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 100 }, description: Page size; a value outside 1-100 falls back to 50. }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: How many entries to skip, newest first; a negative value falls back to 0. }
        - { name: from, in: query, schema: { type: string, format: date }, description: "Only what occurred on or after this day (YYYY-MM-DD)." }
        - { name: to, in: query, schema: { type: string, format: date }, description: "Only what occurred on or before this day (YYYY-MM-DD)." }
        - { name: q, in: query, schema: { type: string }, description: "Words (separated by spaces) that must all appear in the description, in any order, ignoring case and accents." }
      responses:
        "200":
          description: Transactions, most recent occurred_at first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
        "400": { description: invalid_date (from or to isn't YYYY-MM-DD) or invalid_date_range (to is before from). }
    post:
      summary: Record a transaction
      description: >
        Requires admin or the money role (see POST /accounts). entries
        needs two or more, and they must sum to exactly zero — standard
        double-entry bookkeeping: a transaction always says both where
        money came from and where it went. This is enforced by a
        deferred database constraint regardless of what calls this
        endpoint, not just checked here. An account can appear on at most
        one entry of a transaction (duplicate_account), and no entry may
        have a zero amount.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, occurred_at, entries]
              properties:
                description: { type: string }
                occurred_at: { type: string, format: date-time }
                entries:
                  type: array
                  minItems: 2
                  items: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "201":
          description: Created transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: invalid_body (malformed JSON, or occurred_at isn't RFC 3339), missing_fields (description is empty), too_few_entries, invalid_amount (a zero-amount entry), duplicate_account (the same account on two entries), or unknown_account. }
        "403": { description: Requires admin or the money role. }
        "409": { description: unbalanced — entries don't sum to zero — or account_has_children — an entry is on an account that has child accounts (an account has children or transactions, never both). }

  /transactions/{id}:
    get:
      summary: Get a single transaction, with its entries
      description: >
        Open to every baseline role. For admin and board only, the
        response also carries dues and licenses — the cuotas anuales and
        federative licenses this transaction paid for (see POST
        /users/{login}/dues and /licenses) — always present for them,
        empty when it paid for none. Who paid which is private to that
        person, admin and board (see GET /users/{login}/dues), so anyone
        else gets the plain transaction, without either key.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The transaction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Transaction"
                  - type: object
                    description: Only present for admin and board.
                    properties:
                      dues:
                        type: array
                        items: { $ref: "#/components/schemas/Due" }
                      licenses:
                        type: array
                        items: { $ref: "#/components/schemas/License" }
        "400": { description: invalid_id — id isn't numeric. }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Correct a transaction's description, timestamp, or entries
      description: >
        Requires admin or the money role. description, occurred_at and
        entries always replace the current values in full — there's no
        single-entry edit, only replacing the whole set at once, same
        as POST's own balance requirement.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, occurred_at, entries]
              properties:
                description: { type: string }
                occurred_at: { type: string, format: date-time }
                entries:
                  type: array
                  minItems: 2
                  items: { $ref: "#/components/schemas/EntryInput" }
      responses:
        "200":
          description: Updated transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400": { description: invalid_id, invalid_body, missing_fields, too_few_entries, invalid_amount, duplicate_account, or unknown_account — same as POST. }
        "403": { description: Requires admin or the money role. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: unbalanced, or account_has_children (an entry is on an account that has child accounts). }
    delete:
      summary: Delete a transaction (and its entries)
      description: >
        Requires admin or the money role. Also removes the membership
        dues it recorded. A transaction that a license
        references can't be deleted (409 transaction_has_licenses): a
        license outlives the record of how it was paid. If it recorded payments of a
        distribution, deleting it undoes them (what they paid is unpaid again, what
        they took off is paid again, and their entries leave the list of payments);
        when the orders have changed since and no longer allow it nothing is deleted
        (409 transaction_has_distribution_payments).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "400": { description: invalid_id — id isn't numeric. }
        "403": { description: Requires admin or the money role. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: transaction_has_licenses — a license still names this transaction as its payment — transaction_has_distribution_payments — its payments in a distribution can no longer be undone — or transaction_has_files — files are still attached to it. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        An opaque session token issued by POST /auth/magic-link/consume,
        not a JWT — it carries no information of its own, so the API
        looks it up (and its holder's current roles) on every request.
    cookieAuth:
      type: apiKey
      in: cookie
      name: katiuskas_session
      description: >
        The same opaque session token as bearerAuth, carried as an
        HttpOnly cookie instead — set by every endpoint that issues or
        replaces a session (magic-link consume, impersonate,
        impersonate/exit), cleared by POST /auth/logout. Accepted only
        by GET /library/file/{path} and GET /users/{login}/files/file/{path}, which
        need to work as a plain, browser-navigable URL (opened directly
        in a new tab, or saved by the browser's own "Save As" under the
        file's real name) that a custom Authorization header can't ride
        along on. Every other endpoint still requires bearerAuth.

  responses:
    Unauthorized:
      description: Missing or invalid credentials
    NotFound:
      description: Resource not found

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    Gender:
      type: string
      enum: [male, female]
      nullable: true
      description: Not recorded at all unless set explicitly — nullable, no default.

    AdminStatus:
      type: object
      properties:
        app:
          type: object
          properties:
            version: { type: string, description: What the binary was built as (-ldflags); absent for a plain go build. }
            vcs_revision: { type: string, description: The commit Go recorded in the binary, when it was built from a git checkout. }
            vcs_time: { type: string }
            vcs_modified: { type: boolean, description: The checkout had uncommitted changes. Absent when false. }
            go_version: { type: string }
            started_at: { type: string, format: date-time }
        database:
          type: object
          properties:
            ok: { type: boolean }
            latency_ms: { type: integer }
            error: { type: string, description: Why it doesn't answer, when ok is false. }
            migration_version: { type: integer, description: Latest goose migration applied; absent when it can't be read. }
        mail:
          type: object
          properties:
            smtp_configured: { type: boolean, description: When false, sign-in emails are only written to the server log. }
        telegram:
          type: object
          properties:
            log_channel_configured: { type: boolean }
            bot_running: { type: boolean }
            bot_username: { type: string }
        settings:
          type: object
          properties:
            public_base_url: { type: string }
            session_ttl_seconds: { type: integer }
            local_session_ttl_seconds: { type: integer, description: How long a session lasts when it was opened through an address whose first label is "local" (the club's shared tablet). }
            magic_link_ttl_seconds: { type: integer }
            magic_link_cooldown_seconds: { type: integer }
            impersonation_ttl_seconds: { type: integer }
            bot_dm_link_ttl_seconds: { type: integer }
        storage:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [library, user_files, activity_resources] }
              path: { type: string }
              exists: { type: boolean }
        disks:
          type: array
          description: >
            The filesystems that hold the storage directories that exist; directories on the
            same one are a single entry.
          items:
            type: object
            properties:
              paths: { type: array, items: { type: string } }
              total_bytes: { type: integer, format: int64 }
              free_bytes: { type: integer, format: int64, description: What a normal user can still use. }
              used_percent: { type: integer, description: What df shows (rounded up). }
        problems:
          type: array
          description: >
            What is wrong right now, in Spanish and in words: the database not answering, a
            storage directory that does not exist, a disk at or above DISK_ALERT_PERCENT. Empty
            when all is well. The same list the monitor warns about through Telegram.
          items: { type: string }

    Token:
      type: object
      description: >
        A session token as an admin sees it — never the token value
        itself, only its metadata (see GET /users/{login}/tokens).
      properties:
        id: { type: integer }
        user_login: { type: string }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: >
            When the session ends if it is not used again: it moves forward with every use,
            to the time of the use plus the session's lifetime (30 days; 3 hours through a
            local.* address). Fixed for an impersonation session.
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip:
          type: string
          nullable: true
          description: >
            X-Forwarded-For if present (the production deploy sits behind
            a reverse proxy), otherwise the raw connection address.
            Purely informational.
        last_used_user_agent:
          type: string
          nullable: true
          description: >
            The User-Agent header of the last request made with the token, as sent (cut to 512
            characters); absent until it is first used. It is the last one, like last_used_ip.
        browser:
          type: string
          description: >
            The browser and its major version ("Firefox 120"), worked out from the User-Agent on
            every read (never stored); absent when it is not recognized.
        os:
          type: string
          description: >
            The operating system family ("Windows", "macOS", "Linux", "Android", "iOS",
            "ChromeOS"), worked out the same way; absent when it is not recognized.
        current:
          type: boolean
          description: >
            Present (true) only in GET /tokens, on the session that is
            making that very request — so an admin can tell which one is
            theirs, since revoking it signs them out.
        impersonated_by_login:
          type: string
          nullable: true
          description: >
            The admin who started this session via
            POST /users/{login}/impersonate, if it is one — absent for a
            normal token.

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system:
          type: boolean
          description: >
            admin/board/member/former_member — wired to real permissions
            or automatic behavior, can't be deleted.
        is_automatic:
          type: boolean
          description: >
            member/former_member/board: computed from whether the person
            has a currently active (member) or a past but not current
            (former_member) membership period, or a currently open board
            term (board). Can't be granted or revoked through
            POST/DELETE /users/{login}/roles — those return 409
            automatic_role.

    User:
      type: object
      properties:
        login:
          type: string
          description: >
            This person's sole identifier anywhere in the API — a unique
            slug (e.g. "maria.garcia") generated from their name when
            created, and admin-editable afterward via PATCH.
        first_name: { type: string }
        last_name: { type: string }
        national_id: { type: string, nullable: true }
        birth_date: { type: string, format: date, description: "Required — every person on file needs one." }
        gender: { $ref: "#/components/schemas/Gender" }
        email:
          type: string
          nullable: true
          description: >
            One or more email addresses, space-separated, or absent
            entirely. Signing in and a magic link going out both work
            against any one of them, matched case-insensitively; someone
            with none on file can never receive a magic link, the same
            way someone with no phone already couldn't. An individual
            address still can't belong to two different people, even as
            one of several on the same record.
        phone:
          type: string
          nullable: true
          description: >
            One or more phone numbers, space-separated — so each number
            itself can't contain a space (write "600111222", not
            "600 111 222"; other punctuation like dashes is fine).
            Matched the same way as email for signing in. An individual
            number can't belong to two different people either, even as
            one of several on the same record.
        address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        emergency_contact: { type: string, nullable: true, description: "Free text: one or more names, phones, emails..." }
        roles:
          type: array
          items: { type: string }
          description: >
            Role names this person holds. admin/board/member are the system
            roles the API actually grants permissions to; any other name is
            an admin-defined organizational label. Manage membership via
            POST/DELETE /users/{login}/roles, not this field.
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: When this person last completed a magic-link sign-in.
        last_login_ip:
          type: string
          nullable: true
          description: >
            Where from, at that same sign-in: the first X-Forwarded-For
            entry if the request had one (the production deploy sits
            behind a reverse proxy that sets it), otherwise the
            connection's own address. Informational only.
        membership_number:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Identifies this person for as long as they're associated with
            the club, not any single membership period — leaving and
            rejoining keeps the same number. Read-only here: assigned
            automatically, one past the current highest, the first time
            someone gets an alta via POST /users/{login}/memberships —
            not settable through POST/PATCH /users.
        membership_start_date:
          type: string
          format: date
          nullable: true
          description: >
            Start date of this person's *first* membership period ever,
            or null if they've never been a member. Someone who left and
            rejoined has more than one period; this is always the
            earliest one, not the latest rejoin. See
            GET /users/{login}/memberships for the full history.
        membership_end_date:
          type: string
          format: date
          nullable: true
          description: >
            End date of this person's most recent membership period (not
            necessarily the same period membership_start_date comes
            from), or null if it's still open (they're currently a
            member).
        on_leave:
          type: boolean
          description: >
            Whether today falls within one of this person's temporary leave
            windows. Only ever true alongside a currently-active membership
            (null membership_end_date) — a leave doesn't end the period it
            belongs to, so this is the only way to tell "activo" apart from
            "baja temporal". Read-only here — set through
            POST /users/{login}/leaves and PUT/DELETE /leaves/{id}.
        last_due_year:
          type: integer
          nullable: true
          description: >
            The latest year this person has paid their cuota (see
            GET /users/{login}/dues), absent if they've never paid one.
            Also on MemberListing — who is up to date is open to every
            member. "A corriente de pago" is last_due_year >= the current year.
        last_due_paid_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When that latest cuota was paid (its transaction's
            occurred_at). Admin/board only — not on MemberListing.
        license_type: { type: string, nullable: true }
        license_year: { type: integer, nullable: true }
        license_issued_date: { type: string, format: date, nullable: true }
          # Together, license_* reflect this person's federative license for
          # the CURRENT YEAR only, and are all absent without one: an older
          # license, or one only for next year, says nothing about today.
          # It always runs to December 31st of license_year, so there's no
          # end date. Having a license_type is being federated this year.
          # Read-only here — not settable through PATCH /users/{login},
          # only through POST /users/{login}/licenses. See
          # GET /users/{login}/licenses for the full history.
        created_at: { type: string, format: date-time }

    MemberListing:
      type: object
      description: >
        What GET /users returns to a caller who's a plain member (not
        admin or board) — for every person who is or has been a socio,
        not just themselves (someone with no membership period at all
        is left out of this listing entirely — see GET /users). Just
        enough to see who's a socio, since when, to whom, whether
        they're currently on a temporary leave, and which kind of
        federative license they have this year (license_type and
        license_year — a license for any other year isn't shown;
        license_issued_date stays admin/board-only), and the latest year they paid
        their cuota (last_due_year; the date, last_due_paid_at, stays
        admin/board-only);
        everything else User exposes (DNI, address, contact info,
        roles...) is left out entirely — a plain member has no business
        knowing which non-public roles someone else holds, only their
        board position if any, which is public knowledge inside the
        club and comes from the separate GET /board-members instead.
      properties:
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        gender: { $ref: "#/components/schemas/Gender" }
        age_category:
          type: string
          enum: [youth, child, junior, senior, veteran_a, veteran_b]
          description: >
            A coarse age bracket computed from birth_date, per the
            club's own normativa (Spanish name in parens): youth up to
            9 (alevín), child 10-13 (infantil), junior 14-17 (juvenil),
            senior 18-44 (mayor), veteran_a 45-54 (veterano A),
            veteran_b 55+ (veterano B) — based on the age turned this
            calendar year, so everyone holds the same category from
            January 1st through December 31st. Stands in for the exact
            birth_date, which isn't exposed here.
        membership_number: { type: integer, minimum: 0, nullable: true }
        membership_start_date: { type: string, format: date, nullable: true }
        membership_end_date: { type: string, format: date, nullable: true }
        on_leave:
          type: boolean
          description: Same meaning as User.on_leave — only ever true alongside a currently-active membership.
        license_type:
          type: string
          nullable: true
          description: >
            The type of this person's federative license for the current
            year (same value as User.license_type), absent without one.
            The date it was issued stays admin/board-only.
        license_year:
          type: integer
          nullable: true
          description: The year license_type refers to — always the current one.
        last_due_year:
          type: integer
          nullable: true
          description: Same as User.last_due_year — the payment date (last_due_paid_at) is not included.

    DirectoryEntry:
      type: object
      properties:
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        member: { type: boolean, description: "A socio now (the automatic role `member`)." }
        former_member: { type: boolean, description: "Was a socio and is not now (the automatic role `former_member`)." }

    CreateUserInput:
      allOf:
        - $ref: "#/components/schemas/UpdateUserInput"
        - type: object
          required: [first_name, last_name, birth_date]
          properties:
            birth_date: { type: string, format: date, description: "Required — see the User schema." }
            role_names:
              type: array
              items: { type: string }
              description: >
                Optional, empty by default. Can't include "member",
                "former_member" or "board" — those are automatic, computed
                from membership and board history instead.

    UpdateUserInput:
      description: >
        Every field is optional and independently settable, but who can
        set which ones isn't uniform anymore: admin can set any of them
        on anyone. Anyone else can only PATCH their own record, and even
        then only the contact fields — email, phone, address,
        postal_code, city, province, emergency_contact — not
        first_name/last_name/national_id/birth_date/gender/login, which
        get the whole request rejected with 403 restricted_fields instead
        of being silently dropped.
      type: object
      properties:
        login:
          type: string
          description: >
            Admin-only to change. Must be lowercase letters, digits,
            dots, or hyphens; auto-generated at creation and otherwise
            left alone.
        first_name: { type: string, description: "Admin-only to change." }
        last_name: { type: string, description: "Admin-only to change." }
        email: { type: string, nullable: true, description: "One or more addresses, space-separated — see the User schema." }
        national_id: { type: string, nullable: true, description: "Admin-only to change." }
        birth_date: { type: string, format: date, description: "Admin-only to change." }
        gender: { allOf: [{ $ref: "#/components/schemas/Gender" }], description: "Admin-only to change." }
        phone: { type: string, nullable: true, description: "One or more numbers, space-separated — see the User schema." }
        address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        emergency_contact: { type: string, nullable: true, description: "Free text: one or more names, phones, emails..." }

    Membership:
      type: object
      properties:
        id: { type: integer }
        user_login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        end_reason: { type: string, nullable: true }

    Leave:
      type: object
      description: >
        A "baja temporal": a window where the person steps away for a
        while without actually leaving the club. Belongs to the person
        directly (user_login), not to one specific membership period —
        it still has to fall entirely within one of their own periods,
        just not stored as a link to any particular one. end_date is
        null while it's still ongoing.
      properties:
        id: { type: integer }
        user_login: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        reason: { type: string, nullable: true }

    Due:
      type: object
      description: >
        One year's membership fee ("cuota"), always tied to the
        transaction that recorded its payment — a due with no
        transaction behind it doesn't mean anything yet, so there's no
        "unpaid due" to represent. Keyed by (user, year) rather than a
        specific membership period, since a rejoining member's due for a
        given year isn't naturally tied to one particular period.
      properties:
        id: { type: integer }
        user_login: { type: string }
        year: { type: integer }
        transaction_id: { type: integer, description: The transaction that recorded this payment. }
        created_at: { type: string, format: date-time, description: When this due was recorded — not when it was paid (see paid_at). }
        paid_at:
          type: string
          format: date-time
          description: >
            When the payment actually happened — its transaction's
            occurred_at. Only present from GET /users/{login}/dues, never
            on the POST response.

    LicenseType:
      type: object
      description: >
        One entry in the license name catalog (see GET /license-types),
        stored in the database rather than a fixed set in code so the
        list of valid names can grow without a deploy.
      properties:
        id: { type: integer }
        name: { type: string }
        is_other:
          type: boolean
          description: >
            True only for the catalog's "Otra" escape hatch — assigning
            a license with this type requires other_detail.

    License:
      type: object
      description: >
        A federative license ("licencia federativa"). Annual: valid
        through December 31 of year — its own field, not necessarily the
        same calendar year as issued_date (a license requested in
        December often covers the *following* year).
      properties:
        id: { type: integer }
        user_login: { type: string }
        license_type_id: { type: integer }
        type:
          type: string
          description: >
            Human-readable label: the catalog's LicenseType.name, or
            "<name>: <other_detail>" when license_type_id is "Otra".
        other_detail:
          type: string
          nullable: true
          description: Only set when license_type_id is the catalog's "Otra" entry.
        issued_date: { type: string, format: date }
        year:
          type: integer
          description: The calendar year this license actually covers.
        valid_until:
          type: string
          format: date
          description: Computed as December 31 of year — never set directly.
        transaction_id:
          type: integer
          description: The transaction that recorded the payment for this license. Absent for a license not paid through the club. Never changed after creation.
        created_at: { type: string, format: date-time }

    BoardPosition:
      type: string
      enum: [president, vice_president, secretary, treasurer, member_at_large]
      description: >
        Cargos of the Junta Directiva. member_at_large is "vocal" — unlike
        the other four, a club can have several of these open at once.

    BoardMember:
      type: object
      description: >
        One person's term in one board position. Whoever currently has an
        open term here holds the automatic "board" role (see the User
        schema) — nobody grants or revokes it by hand.
      properties:
        id: { type: integer }
        user_login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, nullable: true, description: "The person's own email field. Only present on GET /board-members, joined in from their profile." }
        phone: { type: string, nullable: true, description: "The person's own phone field. Only present on GET /board-members." }
        position: { $ref: "#/components/schemas/BoardPosition" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }

    Activity:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string, enum: [caving, canyoning, training, social, other] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        description: { type: string, nullable: true }
        cancelled: { type: boolean, description: "The only state that is stored; whether an activity is still to come, going on or over follows from its dates." }
        leader_login:
          type: string
          description: >
            The organizer: defaults to whoever created the activity, but
            admin/board can choose someone else at creation time or
            reassign it later (see POST/PATCH). The current organizer is
            the only one besides admin/board who can update or cancel
            the activity, but can't reassign it themselves.
        visibility:
          type: string
          enum: [public, private]
          description: >
            public (the default) works as activities always have: anyone
            can join themselves, and admin/board can add anyone else.
            private restricts who can add a participant *at all* — only
            the organizer, board, or admin — even to sign up someone who
            already wants in. See POST /activities/{id}/participants.
        max_participants:
          type: integer
          minimum: 1
          description: >
            An optional limit on how many people go, the members signed up and the guests
            together; absent when there is none. Nobody can be added past it (409 activity_full).

    CreateActivityInput:
      type: object
      required: [title, start_date, end_date]
      properties:
        title: { type: string }
        type: { type: string, enum: [caving, canyoning, training, social, other], default: caving }
        start_date: { type: string, format: date }
        end_date:
          type: string
          format: date
          description: Must not be earlier than start_date.
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [public, private], default: public }
        participant_logins:
          type: array
          items: { type: string }
          description: >
            Signed up as participants in the same call that creates the
            activity. If type is caving or canyoning, every one of them
            must currently hold a valid federative license, or the whole
            call is rejected with 409 not_federated.
        leader_login:
          type: string
          description: >
            The organizer. Defaults to the caller; naming anyone else
            here is admin/board only (403 otherwise).
        max_participants:
          type: integer
          minimum: 1
          description: >
            An optional limit on how many people go (members and guests together). More participant_logins
            than that is 409 activity_full; a number below 1 is 400 invalid_max_participants.

    UpdateActivityInput:
      type: object
      properties:
        title: { type: string }
        type: { type: string, enum: [caving, canyoning, training, social, other] }
        start_date: { type: string, format: date }
        end_date:
          type: string
          format: date
          description: Must not be earlier than start_date (or the resulting start_date, if both are sent together).
        description: { type: string, nullable: true }
        cancelled: { type: boolean, description: "true cancels the activity, false reactivates it." }
        visibility: { type: string, enum: [public, private] }
        leader_login:
          type: string
          description: >
            Reassigns the organizer. admin/board only — even the
            current organizer can't change this on their own activity
            (403 otherwise).
        max_participants:
          type: integer
          nullable: true
          minimum: 1
          description: >
            The limit on how many people go (members and guests together): a number sets it, null
            takes it off, left out it stays. Below the people already going is 409
            max_below_attendance; a number below 1 is 400 invalid_max_participants.

    Guest:
      type: object
      description: A person from outside the club who goes to an activity, invited by one of those signed up to it.
      properties:
        id: { type: integer }
        activity_id: { type: integer }
        name: { type: string }
        invited_by_login: { type: string }
        added_by_login: { type: string, description: Whoever recorded it. }
        added_at: { type: string, format: date-time }

    Participant:
      type: object
      properties:
        activity_id: { type: integer }
        user_login: { type: string }
        federated: { type: boolean, description: "Has a federative license for the current year. Only information: any member can join any activity." }
        added_by_login: { type: string, description: "Who signed the person up (themselves, or somebody else). For those signed up before it was recorded, the organizer of the activity." }
        added_at: { type: string, format: date-time }

    Distribution:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        audience: { type: string, enum: [all_members, signup] }
        visibility:
          type: string
          enum: [all, material, board, admin]
          description: >
            Who can see it, and so act on it: everybody, material (and board and admin), board (and
            admin) or admin alone. For anybody below that level every route about it answers 404.
        status: { type: string, enum: [draft, open, closed, done] }
        closes_at: { type: string, format: date-time, description: Deadline for members to choose; absent = none. }
        cutoff_date: { type: string, format: date, description: Only people who were members this day can have it; required for all_members. }
        account_id: { type: integer, description: The account its payments are recorded in; absent = the default one (the account marked distribution_default). }
        account_name: { type: string }
        price: { type: number, description: A member's own unit; 0 when free. }
        extra_price: { type: number, description: Each extra unit; absent when there are no extras. }
        max_extra: { type: integer, description: Extras per person; absent = no cap. }
        options:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              values: { type: array, items: { type: string } }
        articles:
          type: array
          description: >
            What a distribution with articles hands out, in order (empty for
            the usual kind: then it is price, extras and options).
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              price: { type: number, description: One unit. }
              max_total: { type: integer, description: How many there are in all; absent = no limit. }
              max_per_person: { type: integer, description: How many one person may have; absent = no limit. }
              has_identifiers: { type: boolean, description: Each unit has its own number, written down when it is handed out. }
              identifier_fields:
                type: array
                items: { $ref: "#/components/schemas/IdentifierField" }
              identifier_total: { type: integer, description: How many items exist, when the numbers are described. }
              identifiers_assigned: { type: integer, description: How many numbers have been given. }
              requested: { type: integer, description: How many have been asked for so far; with max_total, what is left is the difference. }
        created_by_login: { type: string }
        created_at: { type: string, format: date-time }
        unit_count: { type: integer, description: In units — a row of an article counts as its quantity. }
        picked_up_count: { type: integer, description: In units, like unit_count. }
        eligible:
          type: boolean
          description: Whether the caller may have it. Only on GET /distributions and GET /distributions/{id}.

    DistributionInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        audience: { type: string, enum: [all_members, signup], default: all_members }
        visibility:
          type: string
          enum: [all, material, board, admin]
          default: all
          description: >
            Who can see it. Only admin sets or changes it (403 forbidden for board, unless it is
            what the distribution already has); invalid_visibility otherwise. Left out, it is
            "all" on creation and stays as it is on update.
        closes_at: { type: string, format: date-time }
        cutoff_date: { type: string, format: date }
        account_id: { type: integer, nullable: true, description: The account its payments are recorded in; null = the default one. 400 unknown_account if it doesn't exist, account_not_income if it isn't of type income. }
        price: { type: number, default: 0 }
        extra_price: { type: number }
        max_extra: { type: integer }
        options:
          type: array
          items:
            type: object
            required: [name, values]
            properties:
              name: { type: string }
              values: { type: array, items: { type: string } }
        articles:
          type: array
          description: Things asked for in any quantity; see POST /distributions.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              price: { type: number, default: 0 }
              max_total: { type: integer }
              max_per_person: { type: integer }
              has_identifiers: { type: boolean, default: false }
              identifier_fields:
                type: array
                items: { $ref: "#/components/schemas/IdentifierField" }
        status:
          type: string
          enum: [draft, open, closed, done]
          description: Only on PUT.

    IdentifierField:
      type: object
      required: [name, spec]
      properties:
        name: { type: string, example: Serie }
        spec: { type: string, example: "124-133, 137" }

    DistributionUnit:
      type: object
      properties:
        id: { type: integer }
        distribution_id: { type: integer }
        beneficiary_login: { type: string, description: Who it is for and who it belongs to. }
        beneficiary_name: { type: string }
        registered_by_login: { type: string, description: Who really entered it — not the beneficiary when somebody did it for them. Absent for a member's own unit of a distribution for all members until somebody chooses its options; then it is who did. }
        registered_at: { type: string, format: date-time }
        is_extra: { type: boolean }
        article_id: { type: integer, description: Only for a row of an article. }
        article_name: { type: string }
        identifiers: { type: array, items: { type: string }, description: The numbers of the items, for a row of an article with has_identifiers. }
        quantity: { type: integer, description: How many units the row stands for; always 1 outside articles. }
        paid_quantity: { type: integer, description: How many of them have been paid (0 to quantity); paid_at is when the last payment was marked. }
        choices: { type: object, additionalProperties: { type: string } }
        price: { type: number, description: What ONE unit cost when it was entered; the row costs price times quantity. }
        paid_at: { type: string, format: date-time }
        paid_marked_by_login: { type: string }
        picked_up_quantity: { type: integer, description: How many of them have been handed out (0 to quantity); picked_up_at and the two people after it are those of the last delivery. }
        delivered_identifiers: { type: array, items: { type: string }, description: The identifiers already handed out; the others are assigned but still to go. }
        paid_identifiers: { type: array, items: { type: string }, description: The identifiers already paid (in an article with numbers it is the items that are paid). }
        picked_up_at: { type: string, format: date-time }
        pickup_recorded_by_login: { type: string, description: Who wrote the collection down (admin, board or material). }
        picked_up_by_login: { type: string, description: Who it was handed to; not necessarily the beneficiary. }

    DistributionPayment:
      type: object
      properties:
        id: { type: integer }
        distribution_id: { type: integer }
        distribution_name: { type: string }
        unit_id: { type: integer, description: The order it was about; absent if it was deleted since. }
        transaction_id: { type: integer, description: The accounting transaction that recorded it; absent for payments made before there were any. }
        occurred_at: { type: string, format: date-time }
        recorded_by_login: { type: string, description: Who wrote the payment down. }
        recorded_by_name: { type: string }
        paid_by_login: { type: string, description: Whose order it was for, the person who paid. }
        paid_by_name: { type: string }
        description: { type: string, description: What was paid for, the article or the distribution. }
        quantity: { type: integer, description: Units, negative when a payment was taken off. }
        amount: { type: number, description: Money, with the sign of quantity. }
        identifiers: { type: array, items: { type: string }, description: The numbers it was about, in an article with numbers. }
        total_after: { type: number, description: What the distribution had collected up to and including this entry. }

    DistributionOrder:
      type: object
      properties:
        lines:
          type: array
          items:
            type: object
            properties:
              article_id: { type: integer, description: Only in a distribution with articles. }
              article_name: { type: string }
              choices: { type: object, additionalProperties: { type: string } }
              count: { type: integer, description: In units. }
        total_units: { type: integer }
        total_amount: { type: number }
        provisional: { type: boolean, description: "true for a distribution for all members still in draft: the own unit of everybody who qualifies is counted although it isn't made yet." }

    TransactionFile:
      type: object
      properties:
        id: { type: integer }
        transaction_id: { type: integer }
        file_name: { type: string }
        content_type: { type: string }
        file_size: { type: integer }
        uploaded_by: { type: string, description: "A login; absent if the person was deleted." }
        created_at: { type: string, format: date-time }

    TransactionFileListing:
      allOf:
        - { $ref: "#/components/schemas/TransactionFile" }
        - type: object
          properties:
            transaction:
              type: object
              properties:
                id: { type: integer }
                description: { type: string }
                occurred_at: { type: string, format: date-time }
                amount: { type: number, description: What the transaction moved (the positive side of its entries). }
                entries:
                  type: array
                  items:
                    type: object
                    properties:
                      account_id: { type: integer }
                      account_name: { type: string }
                      amount: { type: number }

    BudgetAccount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        hidden: { type: boolean }

    BudgetItem:
      type: object
      properties:
        name: { type: string }
        amount: { type: number, description: Budgeted. }
        actual: { type: number, description: What the item's accounts really received (income) or spent (expenses) in the year. }
        percent: { type: number, nullable: true, description: actual / amount, null when the amount is zero. }
        accounts: { type: array, items: { $ref: "#/components/schemas/BudgetAccount" } }

    BudgetPart:
      type: object
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/BudgetItem" } }
        amount: { type: number }
        actual: { type: number }
        percent: { type: number, nullable: true }

    Budget:
      type: object
      properties:
        year: { type: integer }
        income: { $ref: "#/components/schemas/BudgetPart" }
        expenses: { $ref: "#/components/schemas/BudgetPart" }
        unassigned_accounts:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/BudgetAccount" }
              - type: object
                properties:
                  kind: { type: string, enum: [income, expense] }
                  actual: { type: number }

    BudgetSummary:
      type: object
      properties:
        year: { type: integer }
        income_amount: { type: number }
        income_actual: { type: number }
        income_percent: { type: number, nullable: true }
        expenses_amount: { type: number }
        expenses_actual: { type: number }
        expenses_percent: { type: number, nullable: true }

    BudgetItemInput:
      type: object
      required: [name, amount, account_ids]
      properties:
        name: { type: string }
        amount: { type: number, minimum: 0, description: At most two decimals. }
        account_ids: { type: array, minItems: 1, items: { type: integer } }

    BudgetInput:
      type: object
      required: [income, expenses]
      properties:
        income: { type: array, items: { $ref: "#/components/schemas/BudgetItemInput" } }
        expenses: { type: array, items: { $ref: "#/components/schemas/BudgetItemInput" } }

    ClubInfoItem:
      type: object
      properties:
        id: { type: integer }
        position: { type: integer, description: Its place in the list. }
        label: { type: string }
        value: { type: string }
        copy_value: { type: string, description: What a button next to the value copies; absent = no button. }
        copy_label: { type: string, description: The button's text; absent = "Copiar". Needs a copy_value. }

    ClubInfoInput:
      type: object
      required: [label, value]
      properties:
        label: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 500 }
        copy_value: { type: string, nullable: true, maxLength: 500 }
        copy_label: { type: string, nullable: true, maxLength: 100 }

    Holiday:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        name: { type: string }

    ActivityResource:
      type: object
      description: >
        One entry in an activity's memoria — either a text entry
        (description set, file fields absent) or an uploaded file
        (file_name/file_size/content_type set, description absent),
        never a mix of both; the database's own CHECK constraints
        (migration 00018) are the actual source of truth for that, not
        this schema.
      properties:
        id: { type: integer }
        activity_id: { type: integer }
        type: { type: string, enum: [text, file] }
        author_login:
          type: string
          description: Whoever contributed this resource — not necessarily the activity's own organizer.
        title: { type: string }
        description: { type: string, nullable: true, description: type=text only. }
        file_name: { type: string, nullable: true, description: type=file only — the original uploaded filename. }
        file_size: { type: integer, nullable: true, description: type=file only, in bytes. }
        content_type: { type: string, nullable: true, description: type=file only. }
        position:
          type: integer
          description: >
            This resource's place in the memoria page, a dense 1..N per
            activity — see PUT /activities/{id}/resources/order.
        created_at:
          type: string
          format: date-time
          description: When this resource was added. Fixed at creation — there's no way to backdate or edit it afterward.

    MaterialType:
      type: object
      description: >
        One entry in the catalog of types of material (see GET /material/types). Two are fixed:
        Cuerda (kind rope) and Saca (kind bag), which cannot be renamed or deleted. The rest (kind
        general) — mosquetones, spits, placas, maillones, iluminación... — are kept in the
        database, so an admin changes the list (on /admin) without a code deploy.
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [rope, bag, general] }
        description_required:
          type: boolean
          description: Whether the items of the type must have a description (general types; meaningless for Cuerda and Saca, whose description is always optional).
        attributes:
          type: array
          items: { $ref: "#/components/schemas/MaterialAttribute" }
          description: In the order their values are written in an item's name. Always empty for Cuerda and Saca.

    MaterialAttribute:
      type: object
      description: >
        A field the items of a general type carry (colour, closure, shape...): free text or one of
        a list of options, required or optional.
      properties:
        id: { type: integer }
        name: { type: string }
        data_type: { type: string, enum: [text, enum] }
        required: { type: boolean }
        position: { type: integer, description: 0-based place in the type's list. }
        options:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/MaterialAttributeOption" }
          description: The accepted values of an enum attribute, by label; null for a text one.

    MaterialAttributeOption:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }

    ItemAttributeValue:
      type: object
      description: >
        The value an item has for an attribute. In a request, attribute_id plus option_id (enum) or
        value (text); a blank value is no value. In a response, name too, and value is always the
        text to show (the option's label for an enum), with option_id for an enum one.
      required: [attribute_id]
      properties:
        attribute_id: { type: integer }
        name: { type: string, description: Response only. }
        option_id: { type: integer, description: Enum attributes. }
        value: { type: string, description: Text attributes (in a response, also the label of an enum's option). }

    Item:
      type: object
      description: >
        rope and bag are individually tracked physical objects — brand,
        model and code are always known, total_quantity is always 1, and
        they carry type-specific fields (rope_type/diameter_mm/
        manufacture_year/length_m for rope, bag_type/capacity_liters for bag —
        bag_type extends rope_type's caving/canyoning split with two
        purpose-based kinds, quick and special). general is a
        fungible stock item; brand/model/code may be unknown, though a model needs a brand, and
        whether its description is required depends on its type (description_required). Its
        type's attributes give it more fields. No two items are exactly the same (type, brand,
        model, code, description and attributes; the quantity is not part of it). Every item has a type from
        GET /material/types, which decides its kind (Cuerda is rope, Saca is bag, any other general). rentable/sellable
        are computed from whether rental_price_per_week/sale_price is
        set — loanable is a separate flag, since a loan carries no price
        to derive that from. total_quantity/available_quantity/
        outstanding_loan_quantity are always computed from this item's
        own movement history (see GET /material/items/{id}/movements) rather
        than stored, so there's no acquired_at here either — it's the
        transacted_at of the item's first acquisition movement, visible
        in that same history.
      properties:
        id: { type: integer }
        kind: { type: string, enum: [rope, bag, general] }
        type_id: { type: integer, description: An id from GET /material/types. }
        type_name: { type: string }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        code: { type: string, nullable: true }
        description:
          type: string
          nullable: true
          description: >
            Required for a general item only if its type says so. Doubles as "Observaciones" in the
            frontend for rope/bag, where it's optional.
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ItemAttributeValue" }
          description: The values the item has, in the type's order; only those with a value. Always empty for a rope and a bag.
        display_name:
          type: string
          description: >
            How the item is named: its type, brand and model, the values of its attributes (the
            values only) and its description, joined with " · ", e.g. "Mosquetones · Petzl Attache ·
            aluminio · asimétrico · con seguro".
        incomplete:
          type: boolean
          description: >
            A general item that lacks what its type requires now (a required attribute or the
            description) because it was saved before the type asked for it. Editing it fixes it.
        total_quantity: { type: integer, description: "Computed from this item's movement history — never stored." }
        available_quantity:
          type: integer
          description: >
            Computed from this item's movement history — never stored.
            Already reflects any outstanding loan and any open rental,
            same as every other stock-reducing movement.
        outstanding_loan_quantity:
          type: integer
          description: >
            How much of this item is currently out on some loan, across
            every activity, with nothing (yet) returned against it —
            every loan minus every return. What "material prestado" is
            built from.
        status: { type: string, enum: [available, on_loan, rented, sold, lost, abandoned, maintenance, retired] }
        loanable: { type: boolean }
        rentable: { type: boolean, description: "Computed: true iff rental_price_per_week is set." }
        sellable: { type: boolean, description: "Computed: true iff sale_price is set." }
        rental_price_per_week: { type: number, nullable: true }
        sale_price: { type: number, nullable: true }
        rope_type: { type: string, enum: [caving, canyoning], nullable: true, description: "rope only." }
        diameter_mm: { type: number, nullable: true, description: "rope only, in millimetres." }
        manufacture_year: { type: integer, nullable: true, description: "rope only." }
        length_m: { type: integer, nullable: true, description: "rope only, in metres." }
        bag_type: { type: string, enum: [caving, canyoning, quick, special], nullable: true, description: "bag only." }
        capacity_liters: { type: number, nullable: true, description: "bag only." }

    CreateItemInput:
      type: object
      required: [type_id]
      properties:
        type_id: { type: integer, description: An id from GET /material/types; its kind decides the rest. }
        brand: { type: string, description: Required for rope/bag. }
        model: { type: string, description: Required for rope/bag; needs a brand. }
        code: { type: string, description: Required for rope/bag. }
        description: { type: string, description: Required for a general item whose type requires it. }
        attributes:
          type: array
          items: { $ref: "#/components/schemas/ItemAttributeValue" }
          description: Values for the attributes of the type; each required one must have one. Only general types have attributes.
        acquired_at:
          type: string
          format: date
          description: >
            Backdates the item's first (and, for rope/bag, only)
            acquisition movement. Defaults to today.
        total_quantity:
          type: integer
          default: 1
          description: >
            How many units to start with — recorded as the item's
            first acquisition movement. Must be 1 for rope/bag
            (single_unit_item otherwise); more can be added to general
            later via POST /material/movements with type acquisition.
        loanable: { type: boolean, default: true }
        rental_price_per_week: { type: number }
        sale_price: { type: number }
        rope_type: { type: string, enum: [caving, canyoning], description: Required for rope. }
        diameter_mm: { type: number, description: "Required for rope, in millimetres." }
        manufacture_year: { type: integer, description: Required for rope. }
        length_m: { type: integer, description: "Required for rope, in metres." }
        bag_type: { type: string, enum: [caving, canyoning, quick, special], description: Required for bag. }
        capacity_liters: { type: number, description: Required for bag. }

    Movement:
      type: object
      description: >
        rental exchanges the item with a specific person (user_login
        always set); loan, sale and return's are optional. acquisition
        (new stock in), loss, abandonment and retirement never have a
        recipient at all — user_login is always absent for those. A
        loan's own "returned" state isn't tracked on the loan itself —
        it's the sum of separate return movements against the same item
        and activity (see GET /material/movements?activity_id=).
      properties:
        id: { type: integer }
        item_id: { type: integer }
        user_login: { type: string, nullable: true, description: "Always set for rental, optionally for loan/sale/return, always absent for acquisition/loss/abandonment/retirement." }
        type: { type: string, enum: [loan, rental, sale, acquisition, loss, abandonment, retirement, return] }
        quantity: { type: integer, description: Always 1 for a rope or bag item. }
        transacted_at: { type: string, format: date, description: Defaults to today at creation; can be backdated. }
        returned_at:
          type: string
          format: date
          nullable: true
          description: >
            When an active rental was closed via POST
            .../return — rental only, always all-or-nothing. Always
            null for every other type, loan included.
        price:
          type: number
          nullable: true
          description: >
            Always the item's own rental_price_per_week (rental) or
            sale_price (sale) at the time of the movement; always null
            otherwise.
        status: { type: string, enum: [active, completed, overdue, cancelled], description: "active only for an unreturned rental; every other type, loan included, is completed immediately." }
        recorded_by_login: { type: string, nullable: true }
        activity_id:
          type: integer
          nullable: true
          description: Required for loan and return; optional otherwise, rental included.
        notes:
          type: string
          nullable: true
          description: >
            Free text, mainly useful on loss/abandonment/retirement to
            say why.

    LibraryEntry:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [dir, file] }
        size:
          type: integer
          description: Bytes. Omitted for a directory.
        modified_at: { type: string, format: date-time }

    LibraryListing:
      type: object
      properties:
        path:
          type: string
          description: >
            The requested path, normalized (no leading/trailing slash,
            "" for the root) — echoed back so the frontend can build
            breadcrumbs without re-deriving it from what it originally
            sent.
        entries:
          type: array
          items: { $ref: "#/components/schemas/LibraryEntry" }
          description: >
            Subdirectories first, then files, each group alphabetical, except that the names
            listed in the directory's own optional .order.json (a JSON array of names) come
            first, in that order. Dotfiles never appear (.order.json included).

    UserFileEntry:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [dir, file] }
        size:
          type: integer
          description: Bytes. Omitted for a directory.
        modified_at: { type: string, format: date-time }

    UserFileListing:
      type: object
      properties:
        path:
          type: string
          description: >
            The requested path, root-relative *within this person's own
            files* (never including their login), normalized (no
            leading/trailing slash, "" for their own root) — echoed back
            so the frontend can build breadcrumbs without re-deriving it
            from what it originally sent.
        entries:
          type: array
          items: { $ref: "#/components/schemas/UserFileEntry" }
          description: Subdirectories first, then files, both alphabetical. Dotfiles never appear.

    Account:
      type: object
      description: >
        One node in the chart of accounts. code is unique across every
        account that has one, but not every account does — a purely
        organizational grouping node might never get one, unlike a real
        ledger account; parent_id nests it under a broader one (null for a
        top-level account) — the frontend builds any tree view it wants
        client-side from this. balance/last_transaction_at are only
        ever present from GET /accounts (never on GET/POST/PUT
        /accounts/{id}) — this account's activity, summing every entry
        ever posted to it and the latest of them; for an account that
        has child accounts (and so no entries of its own) the sum, and
        the latest, of everything below it. allows_dues/allows_licenses mark the accounts a
        transaction has to have an entry on to be allowed to record
        membership dues or federative licenses (both false until an admin
        or the money role marks them) — enforced by POST
        /users/{login}/dues and POST /users/{login}/licenses, and used by
        the frontend to only offer the corresponding section when it
        could succeed. hidden marks an account that's no longer used: it
        stays in every response (its history has to), and it's up to the
        client to leave it out of what it shows by default.
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string, nullable: true }
        parent_id: { type: integer, nullable: true }
        type:
          type: string
          enum: [asset, income, expense]
          description: What the account is mainly for (money the club really has, mainly income, mainly expense); absent when it has none. This is the account's own type, the one PUT replaces.
        effective_type:
          type: string
          enum: [asset, income, expense]
          description: The type that counts, read only, in every response. The account's own, or else its parent's, and so on up the hierarchy; absent when nobody has one. A distribution's payments have to be paid into an account whose effective type is asset, and recorded in one that is income.
        allows_dues: { type: boolean, description: A transaction with an entry on this account can record membership dues. }
        allows_licenses: { type: boolean, description: A transaction with an entry on this account can record federative licenses. }
        distribution_default: { type: boolean, description: The account the payments of distributions with no account of their own are recorded in; at most one account has it. }
        hidden: { type: boolean, description: The account is no longer used; clients leave it out unless asked. }
        balance:
          type: number
          format: double
          description: Only present from GET /accounts — 0 (not absent) for an account with no entries at all.
        last_transaction_at:
          type: string
          format: date-time
          nullable: true
          description: Only present from GET /accounts — null for an account with no entries at all.

    AccountEntry:
      type: object
      description: >
        One entry from a specific account's own ledger — see GET
        /accounts/{id}/transactions. Not the same shape as Entry: this
        one carries its own transaction's date/description inline, and
        balance_after instead of just amount, since it only ever
        appears in the context of one already-known account.
      properties:
        transaction_id: { type: integer }
        account_id: { type: integer, description: The account the entry is posted to (the account itself, or one of its descendants in the ledger of one that groups others). }
        account_name: { type: string }
        occurred_at: { type: string, format: date-time }
        description: { type: string }
        amount:
          type: number
          format: double
          description: This account's own entry from that transaction — positive if it moved in, negative if it moved out.
        balance_after:
          type: number
          format: double
          description: This account's own running balance immediately after this entry, computed in occurred_at order.
        file_count: { type: integer, description: How many files (tickets, invoices) are attached to the transaction. }

    Entry:
      type: object
      description: One line of a Transaction — amount moved into (positive) or out of (negative) account_id.
      properties:
        id: { type: integer }
        account_id: { type: integer }
        amount: { type: number, format: double }

    EntryInput:
      type: object
      required: [account_id, amount]
      properties:
        account_id: { type: integer }
        amount: { type: number, format: double, description: "Never zero — a no-op leg is rejected." }

    Transaction:
      type: object
      description: >
        A single, dated, balanced movement of money. entries always
        number two or more and always sum to exactly zero, enforced by
        a deferred database constraint regardless of what wrote them.
      properties:
        id: { type: integer }
        description: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        file_count: { type: integer, description: How many files (tickets, invoices) are attached. }
