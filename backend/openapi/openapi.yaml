openapi: 3.0.3
info:
  title: Caving Club Intranet API
  version: "1.0.0"
  description: >
    REST API for the club intranet. Consumed by the web frontend today and
    intended for a future mobile app and terminal client as well.

    Every endpoint below that requires bearerAuth requires the caller to
    hold at least one of admin, board, or member — this is a floor that
    applies on top of whatever more specific roles an endpoint's own
    description calls out, not a default that gets overridden by them.
    Someone holding only a role outside that set (e.g. "material" with
    no admin/board/member) is refused everywhere, including the
    endpoints that role would otherwise unlock. Since "member" is itself
    computed from an active membership period, this also means access is
    cut off automatically the moment someone's membership lapses.
servers:
  - url: /api/v1

paths:
  /auth/magic-link:
    post:
      summary: Request a sign-in link by email
      description: >
        There are no passwords in this API, and no separate "granted
        access" step: if email and phone both match someone on file who
        also holds at least one of admin/board/member, they're emailed a
        one-time link (valid 15 minutes) that signs them in via POST
        /auth/magic-link/consume. Someone matching but holding none of
        those roles never gets a link — signing in would leave them
        unable to call anything anyway.

        The response is identical in every case — no match, a match with
        no usable role, or a link actually sent (a recent one might
        already be on its way) — telling those cases apart would let
        this endpoint enumerate who's in the system, or spam someone's
        inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone]
              properties:
                email: { type: string, format: email }
                phone: { type: string }
      responses:
        "200":
          description: Always returned, regardless of whether a link was actually sent.

  /auth/magic-link/consume:
    post:
      summary: Exchange a magic-link token for a session
      description: >
        Issues a single opaque, revocable session token — there's no
        separate short-lived access token and long-lived refresh token
        pair. The token is used directly as the bearer credential on
        every subsequent request until it's revoked (via /auth/logout or
        by an admin, see DELETE /users/{userID}/tokens/{tokenID}) or it
        expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          description: The link is invalid, already used, or expired.

  /auth/logout:
    post:
      summary: Revoke a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Session revoked }

  /auth/me:
    get:
      summary: Identity and roles of the caller
      description: >
        Reports who the bearer token belongs to and what roles they
        currently hold. Since the token is opaque, this is the only way
        for a client to learn that — there's nothing to decode locally
        the way a JWT could be. Costs no extra database round trip: it's
        resolved by the same lookup that authenticated the request.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  roles: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users:
    get:
      summary: List users
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      summary: Create a user (and, optionally, a login account)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserInput" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: The email or national ID already belongs to another person.

  /users/directory:
    get:
      summary: List everyone with login access, name only
      description: >
        Open to any authenticated user. Returns just id, first_name and
        last_name — enough to populate a picker (e.g. an activity's leader
        or participants) without exposing the personal data that GET
        /users returns to admin/board.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryEntry" }

  /users/{id}:
    get:
      summary: Get a user by id
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a user's personal data
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409":
          description: The email or national ID being set already belongs to another person.
    delete:
      summary: Delete a person (and their login, membership history and activity sign-ups)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Cannot delete: this account is the caller's own, or the person is
            still referenced by an activity they led or an inventory
            transaction they're party to.

  /roles:
    get:
      summary: List every role
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
    post:
      summary: Create a role
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409":
          description: A role with this name already exists.

  /roles/{id}:
    delete:
      summary: Delete a role
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            This is a system role (admin/board/member) — it's wired to
            permissions elsewhere in the API and can't be deleted.

  /users/{userID}/roles:
    post:
      summary: Grant a role to a person
      description: >
        admin/board can grant any role except "admin" itself, which only an
        admin can grant (avoids a board account minting new admins).
        member/former_member can't be granted this way at all — they're
        computed from membership history instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        "204": { description: Granted }
        "403":
          description: Only an admin can grant the admin role.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The role is automatic (member/former_member) and can't be granted by hand.

  /users/{userID}/roles/{roleID}:
    delete:
      summary: Revoke a role from a person
      description: >
        Same admin-only carve-out as granting; also refuses to revoke
        "admin" from the last person who has it, and refuses to revoke
        member/former_member at all (computed, not stored).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
        - { name: roleID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
        "403":
          description: Only an admin can revoke the admin role.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Either "admin" from the only remaining admin, or an automatic
            role (member/former_member), neither of which can be revoked
            this way.

  /users/{userID}/tokens:
    get:
      summary: List a person's session tokens
      description: >
        Admin-only audit view of every session token ever issued to this
        person, newest first, including expired and revoked ones. Never
        exposes the token value itself (only its hash is stored, and
        even that isn't returned) — just when it was created, when it
        expires, whether and when it was revoked, and when and from
        where it was last used.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: This person's tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }

  /users/{userID}/tokens/{tokenID}:
    patch:
      summary: Change a token's expiry
      description: Admin-only. Lets a token be extended or shortened without revoking it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
        - { name: tokenID, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expires_at]
              properties:
                expires_at: { type: string, format: date-time }
      responses:
        "204": { description: Expiry updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Revoke a token
      description: >
        Admin-only. Idempotent: revoking an already-revoked token still
        returns 204. Immediately ends that session — the next request
        made with it gets 401.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
        - { name: tokenID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{userID}/memberships:
    get:
      summary: List a user's membership periods
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Membership history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }
    post:
      summary: Start a new membership period
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: userID, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                membership_number: { type: string, nullable: true }
                start_date: { type: string, format: date }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "409":
          description: Overlaps an existing membership period for this user

  /memberships:
    get:
      summary: List members whose membership is active today
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }

  /memberships/{id}:
    patch:
      summary: Correct a membership period's dates (or end it)
      description: >
        start_date is always required and replaces the current value.
        end_date likewise always replaces the current value: give a date
        to end the period, or omit/null it to leave the period open —
        including reopening one that was ended by mistake.
        membership_number and end_reason are true partial updates: omit
        either to leave it as is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
                membership_number: { type: string, nullable: true }
                end_reason: { type: string, nullable: true }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The corrected dates overlap another period for this person.

  /activities:
    get:
      summary: List activities
      description: >
        Defaults to every activity (paginated, newest first). Pass
        status=active to instead get only the ones still needing
        attention: not yet completed/cancelled, or completed but still
        with a loan/rental linked to it that hasn't been returned — the
        practical "what matters right now" view once years of history
        pile up.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active] }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: A page of activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
    post:
      summary: Create an activity
      description: >
        Any authenticated person can create an activity (there's no role
        restriction here, unlike update/cancel) and sign up its initial
        participants in the same call.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActivityInput" }
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400":
          description: One of the given participant_user_ids doesn't exist.

  /activities/{id}:
    patch:
      summary: Update an activity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
    delete:
      summary: Cancel an activity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Activity cancelled }

  /activities/{id}/participants:
    get:
      summary: List an activity's participants
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Participant" }
    post:
      summary: Join an activity, or (admin/board) add someone else to it
      description: >
        With no body (or a null/omitted user_id) signs up the caller. A
        plain member naming anyone other than themselves gets a 403;
        admin/board can name any user_id to add them on that person's
        behalf.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id: { type: integer, nullable: true }
      responses:
        "204": { description: Joined }
        "403": { description: A plain member tried to add someone other than themselves. }

  /activities/{id}/participants/{userID}:
    delete:
      summary: Leave an activity
      description: >
        A member can only remove themselves; admin/board can remove anyone.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: userID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed }
        "403": { description: A plain member tried to remove someone other than themselves. }

  /items:
    get:
      summary: List inventory items
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      summary: Add an item to the catalog
      security: [{ bearerAuth: [] }]
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }

  /items/{id}/transactions:
    get:
      summary: List an item's transaction history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Transactions for this item
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }

  /transactions:
    get:
      summary: List transactions (defaults to active ones)
      description: Requires the admin, board, or material role.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Transaction" }
    post:
      summary: Open a loan, rental or sale
      description: >
        Requires the admin, board, or material role. activity_id is
        required for loan and rental (never for sale) — a member is
        always borrowing or renting gear *for* something.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_id, user_id, type]
              properties:
                item_id: { type: integer }
                user_id: { type: integer }
                type: { type: string, enum: [loan, rental, sale] }
                quantity: { type: integer, default: 1 }
                due_date: { type: string, format: date, nullable: true }
                price: { type: number, nullable: true }
                activity_id: { type: integer, nullable: true }
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        "400":
          description: activity_id is missing for a loan or rental.
        "409":
          description: Not enough available quantity

  /transactions/{id}/return:
    patch:
      summary: Close an active loan or rental
      description: Requires the admin, board, or material role.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Closed transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        An opaque session token issued by POST /auth/magic-link/consume,
        not a JWT — it carries no information of its own, so the API
        looks it up (and its holder's current roles) on every request.

  responses:
    Unauthorized:
      description: Missing or invalid credentials
    NotFound:
      description: Resource not found

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    Token:
      type: object
      description: >
        A session token as an admin sees it — never the token value
        itself, only its metadata (see GET /users/{userID}/tokens).
      properties:
        id: { type: integer }
        user_id: { type: integer }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip:
          type: string
          nullable: true
          description: >
            X-Forwarded-For if present (the production deploy sits behind
            a reverse proxy), otherwise the raw connection address.
            Purely informational.

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system:
          type: boolean
          description: >
            admin/board/member/former_member — wired to real permissions
            or automatic behavior, can't be deleted.
        is_automatic:
          type: boolean
          description: >
            member/former_member: computed from whether the person has a
            currently active (member) or a past but not current
            (former_member) membership period. Can't be granted or
            revoked through POST/DELETE /users/{userID}/roles — those
            return 409 automatic_role.

    User:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        national_id: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        emergency_contact: { type: string, nullable: true, description: "Free text: one or more names, phones, emails..." }
        roles:
          type: array
          items: { type: string }
          description: >
            Role names this person holds. admin/board/member are the system
            roles the API actually grants permissions to; any other name is
            an admin-defined organizational label. Manage membership via
            POST/DELETE /users/{userID}/roles, not this field.
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: When this person last completed a magic-link sign-in.
        last_login_ip:
          type: string
          nullable: true
          description: >
            Where from, at that same sign-in: the first X-Forwarded-For
            entry if the request had one (the production deploy sits
            behind a reverse proxy that sets it), otherwise the
            connection's own address. Informational only.
        created_at: { type: string, format: date-time }

    DirectoryEntry:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }

    CreateUserInput:
      allOf:
        - $ref: "#/components/schemas/UpdateUserInput"
        - type: object
          required: [first_name, last_name, email]
          properties:
            email: { type: string, format: email }
            role_names:
              type: array
              items: { type: string }
              description: >
                Optional, empty by default. Can't include "member" or
                "former_member" — those are automatic, computed from
                membership history instead.

    UpdateUserInput:
      description: >
        Every field is optional and independently settable. admin/board can
        edit anyone; a member can only edit their own record — there's no
        per-field permission split, so this same shape covers self-service
        profile edits and admin edits alike.
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        national_id: { type: string, nullable: true }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        emergency_contact: { type: string, nullable: true, description: "Free text: one or more names, phones, emails..." }

    Membership:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        first_name: { type: string }
        last_name: { type: string }
        membership_number: { type: string, nullable: true }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        end_reason: { type: string, nullable: true }

    Activity:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string, enum: [caving, training, outdoor, social, other] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        location: { type: string }
        description: { type: string, nullable: true }
        difficulty: { type: integer, nullable: true }
        max_participants: { type: integer, nullable: true }
        status: { type: string, enum: [planned, completed, cancelled] }
        leader_id: { type: integer, nullable: true }

    CreateActivityInput:
      type: object
      required: [title, start_date, location]
      properties:
        title: { type: string }
        type: { type: string, enum: [caving, training, outdoor, social, other], default: caving }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        location: { type: string }
        description: { type: string, nullable: true }
        difficulty: { type: integer, nullable: true }
        max_participants: { type: integer, nullable: true }
        leader_id: { type: integer, nullable: true }
        participant_user_ids:
          type: array
          items: { type: integer }
          description: Signed up as participants in the same call that creates the activity.

    Participant:
      type: object
      properties:
        activity_id: { type: integer }
        user_id: { type: integer }
        role: { type: string, enum: [leader, participant] }
        confirmed: { type: boolean }

    Item:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        code: { type: string, nullable: true }
        total_quantity: { type: integer }
        available_quantity: { type: integer }
        status: { type: string, enum: [available, on_loan, rented, sold, maintenance, retired] }
        rental_price_per_week: { type: number, nullable: true }
        sale_price: { type: number, nullable: true }

    Transaction:
      type: object
      properties:
        id: { type: integer }
        item_id: { type: integer }
        user_id: { type: integer }
        type: { type: string, enum: [loan, rental, sale] }
        quantity: { type: integer }
        transacted_at: { type: string, format: date-time }
        due_date: { type: string, format: date, nullable: true }
        returned_at: { type: string, format: date, nullable: true }
        price: { type: number, nullable: true }
        status: { type: string, enum: [active, completed, overdue, cancelled] }
        recorded_by: { type: integer, nullable: true }
        activity_id:
          type: integer
          nullable: true
          description: Required for loan and rental; always null for a sale.
