openapi: 3.0.3
info:
  title: Club de Espeleología Katiuskas — Intranet API
  version: "1.0.0"
  description: >
    REST API for the intranet of Club de Espeleología Katiuskas, a caving
    club (see [katiuskas.es](https://katiuskas.es/)). Consumed by the web
    frontend today and intended for a future mobile app and terminal client
    as well.

    Every endpoint below that requires bearerAuth requires the caller to
    hold at least one of admin, board, or member — this is a floor that
    applies on top of whatever more specific roles an endpoint's own
    description calls out, not a default that gets overridden by them.
    Someone holding only a role outside that set (e.g. "material" with
    no admin/board/member) is refused everywhere, including the
    endpoints that role would otherwise unlock. Since "member" is itself
    computed from an active membership period, this also means access is
    cut off automatically the moment someone's membership lapses.

    A person is never identified by a numeric id anywhere in this API —
    every response and path that names one uses their login instead (a
    unique, admin-editable slug like "maria.garcia"), generated
    automatically when they're created. Every other resource (an
    activity, a license, a token...) still has its own opaque numeric id.
servers:
  - url: /api/v1

paths:
  /auth/magic-link:
    post:
      summary: Request a sign-in link (and code) by email
      description: >
        There are no passwords in this API, and no separate "granted
        access" step: if email and phone both match someone on file who
        also holds at least one of admin/board/member, they're emailed a
        one-time link (valid 15 minutes) that signs them in via POST
        /auth/magic-link/consume, and — in the same email — a 6-digit
        numeric code that does the same via POST
        /auth/magic-link/consume-code, for signing in on a different
        device than the one the email is read on. Both represent the
        same sign-in attempt: consuming either one also consumes the
        other. Someone matching but holding none of those roles never
        gets an email at all — signing in would leave them unable to
        call anything anyway.

        The response is identical in every case — no match, a match with
        no usable role, or an email actually sent (a recent one might
        already be on its way) — telling those cases apart would let
        this endpoint enumerate who's in the system, or spam someone's
        inbox.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone]
              properties:
                email: { type: string, format: email, description: "Matched against any one of the person's registered emails." }
                phone: { type: string, description: "Matched against any one of the person's registered phones." }
      responses:
        "200":
          description: Always returned, regardless of whether a link was actually sent.

  /auth/magic-link/consume:
    post:
      summary: Exchange a magic-link token for a session
      description: >
        Issues a single opaque, revocable session token — there's no
        separate short-lived access token and long-lived refresh token
        pair. The token is used directly as the bearer credential on
        every subsequent request until it's revoked (via /auth/logout or
        by an admin, see DELETE /users/{login}/tokens/{tokenID}) or it
        expires.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          description: The link is invalid, already used, or expired.

  /auth/magic-link/consume-code:
    post:
      summary: Exchange a magic-link's 6-digit code for a session
      description: >
        The code counterpart to POST /auth/magic-link/consume, for
        reading the sign-in email on one device and signing in on
        another. Since the code alone is too short to look someone up
        by, email and phone identify the person exactly as requesting a
        link does. The response is the same generic 401 whether the code
        is wrong, expired, already used (by itself or via the matching
        link), guessed wrong too many times, or the email/phone didn't
        match anyone at all — nothing here tells those cases apart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, phone, code]
              properties:
                email: { type: string, format: email }
                phone: { type: string }
                code: { type: string, description: "The 6-digit code from the sign-in email." }
      responses:
        "200":
          description: Session token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401":
          description: invalid_code — wrong, expired, already-used, or too-many-attempts code, or no match at all.

  /auth/logout:
    post:
      summary: Revoke a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Session revoked }

  /auth/me:
    get:
      summary: Identity and roles of the caller
      description: >
        Reports who the bearer token belongs to and what roles they
        currently hold. Since the token is opaque, this is the only way
        for a client to learn that — there's nothing to decode locally
        the way a JWT could be. Costs no extra database round trip: it's
        resolved by the same lookup that authenticated the request.
        impersonated_by is present only for a session started by
        POST /users/{login}/impersonate: login/roles above are the
        impersonated person's, not the admin's.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The caller's identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { type: string }
                  roles: { type: array, items: { type: string } }
                  impersonated_by:
                    type: object
                    nullable: true
                    description: >
                      The admin currently impersonating this session, if
                      any. An empty object in the rare case that admin's
                      own account has since been deleted.
                    properties:
                      login: { type: string }
                      first_name: { type: string }
                      last_name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/impersonate/exit:
    post:
      summary: Stop impersonating and go back to being yourself
      description: >
        Only meaningful for a session started by
        POST /users/{login}/impersonate — revokes it and mints a fresh,
        normal token for the admin who started it (not the token they had
        before impersonating, which the API has no way to hand back out
        again). Requires only a valid bearer token, not any particular
        role: exiting must still work even if the impersonated person has
        since lost their baseline role, which would otherwise block every
        other authenticated route including this one.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Impersonation ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: A fresh session token for the admin. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: not_impersonating — this session isn't an impersonation. }

  /users:
    get:
      summary: List users
      description: >
        admin/board get every field (User, below) for everyone on file.
        A plain member gets MemberListing's much narrower view instead —
        no DNI, address, contact info, or anything else that isn't
        already effectively public knowledge inside the club — and only
        for people who are or have been a socio (a non-nil
        membership_start_date); someone who's never had a membership
        period at all (an admin-only account, say) is left out of a
        plain member's own listing entirely, even though admin/board
        still see them.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: A page of users (User for admin/board, MemberListing otherwise)
          content:
            application/json:
              schema:
                type: array
                items:
                  oneOf:
                    - { $ref: "#/components/schemas/User" }
                    - { $ref: "#/components/schemas/MemberListing" }
    post:
      summary: Create a user (and, optionally, a login account)
      description: >
        Admin-only — board can no longer modify a person's data at all.
        The new person's login (their sole identifier everywhere else in
        this API) is generated automatically from their name and
        returned in the response; it isn't something the caller sets here.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserInput" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Only admin can create a person. }
        "409":
          description: The email or national ID already belongs to another person.

  /users/directory:
    get:
      summary: List everyone with login access, name only
      description: >
        Open to any authenticated user, including one who'd only get
        MemberListing from GET /users. Returns just login, first_name and
        last_name — enough to populate a picker (e.g. an activity's leader
        or participants) without exposing anything more.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The directory
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryEntry" }

  /users/{login}:
    get:
      summary: Get a user by login
      description: admin/board can view anyone; anyone else only themselves.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "403": { description: Not admin/board, and not viewing your own record. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update a user's personal data
      description: >
        Only admin can set every field on anyone. Everyone else can only
        edit their own record (403 otherwise), and even then only the
        contact fields UpdateUserInput lists as such — attempting to also
        change name, national ID, birth date, gender, or login gets the
        whole request rejected with 403 restricted_fields, rather than
        silently dropping just those fields.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserInput" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400":
          description: invalid_login — the given login isn't lowercase letters, digits, dots, or hyphens.
        "403":
          description: >
            forbidden — not admin, and not editing your own record; or
            restricted_fields — a non-admin tried to change a field
            beyond the contact ones.
        "409":
          description: The email, national ID, or login being set already belongs to another person.
    delete:
      summary: Delete a person (and their login, membership history and activity sign-ups)
      description: Admin-only — board can no longer modify a person's data at all.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }
        "403": { description: Only admin can delete a person. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Cannot delete: this account is the caller's own, or the person is
            still referenced by an activity they led or an inventory
            movement they're party to.

  /roles:
    get:
      summary: List every role
      description: >
        Open to any baseline role (admin/board/member) — the catalog
        itself is just organizational labels, read-only here regardless
        of who's asking. A plain member's own "Cargo" column on
        /members is built from this (is_automatic tells an automatic
        role like member/former_member/board apart from one that's
        actually a distinct label to show) plus their own
        MemberListing.roles.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Role" }
    post:
      summary: Create a role
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: string, nullable: true }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "409":
          description: A role with this name already exists.

  /roles/{id}:
    delete:
      summary: Delete a role
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            This is a system role (admin/board/member) — it's wired to
            permissions elsewhere in the API and can't be deleted.

  /users/{login}/roles:
    post:
      summary: Grant a role to a person
      description: >
        Admin-only — board lost the ability to modify a person's data,
        role assignment included, even for roles that aren't "admin"
        itself. member/former_member/board can't be granted this way at
        all — they're computed from membership/board history instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_id]
              properties:
                role_id: { type: integer }
      responses:
        "204": { description: Granted }
        "403":
          description: Only admin can grant a role.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The role is automatic (member/former_member/board) and can't be granted by hand.

  /users/{login}/roles/{roleID}:
    delete:
      summary: Revoke a role from a person
      description: >
        Same admin-only rule as granting; also refuses to revoke "admin"
        from the last person who has it, and refuses to revoke an
        automatic role (member/former_member/board) at all.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: roleID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
        "403":
          description: Only admin can revoke a role.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Either "admin" from the only remaining admin, or an automatic
            role (member/former_member/board), neither of which can be
            revoked this way.

  /users/{login}/tokens:
    get:
      summary: List a person's session tokens
      description: >
        Admin-only audit view of every session token ever issued to this
        person, newest first, including expired and revoked ones. Never
        exposes the token value itself (only its hash is stored, and
        even that isn't returned) — just when it was created, when it
        expires, whether and when it was revoked, and when and from
        where it was last used.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: This person's tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }

  /users/{login}/impersonate:
    post:
      summary: Start a session that behaves as this person
      description: >
        Admin-only — deliberately not admin/board, since handing board
        members the ability to act as anyone (including other admins) is
        a bigger step than the rest of what they can already do. Mints a
        token whose identity and roles are this person's, live-resolved
        exactly as if they had signed in — so every existing permission
        check already treats the resulting session as that person, with
        no special-casing anywhere else in the API. The one exception is
        GET /auth/me, which also reports impersonated_by, and
        POST /auth/impersonate/exit, reachable regardless of the target's
        own roles. Rejected (409) for yourself, or for someone with no
        baseline role (including a login that doesn't exist) — their
        session couldn't call anything anyway. The token is shorter-lived
        than a normal sign-in on purpose.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "201":
          description: Impersonation session created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "403": { description: Only admin can impersonate. }
        "409":
          description: cannot_impersonate_self, or not_eligible (no baseline role).

  /users/{login}/tokens/{tokenID}:
    patch:
      summary: Change a token's expiry
      description: Admin-only. Lets a token be extended or shortened without revoking it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: tokenID, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expires_at]
              properties:
                expires_at: { type: string, format: date-time }
      responses:
        "204": { description: Expiry updated }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Revoke a token
      description: >
        Admin-only. Idempotent: revoking an already-revoked token still
        returns 204. Immediately ends that session — the next request
        made with it gets 401.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - { name: tokenID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/memberships:
    get:
      summary: List a user's membership periods
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Membership history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }
    post:
      summary: Start a new membership period
      description: Admin-only — board can see every membership period but no longer starts, corrects, or ends one.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { description: Only admin can start a membership period. }
        "409":
          description: Overlaps an existing membership period for this user

  /users/{login}/licenses:
    get:
      summary: List a person's federative licenses
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: License history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/License" }
    post:
      summary: Assign a federative license ("licencia federativa")
      description: >
        Admin-only — board can see everyone's licenses but no longer
        assigns one. Only someone who currently has an open membership
        period (hasn't caused baja) can be assigned one. A license is
        annual: valid from issued_date through December 31 of that same
        year — the response includes that computed valid_until, but it
        isn't something the caller sets. license_type_id must reference
        an entry from GET /license-types; other_detail is required when
        that entry is the catalog's "Otra" escape hatch (is_other) and
        forbidden otherwise.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_type_id, issued_date]
              properties:
                license_type_id: { type: integer }
                other_detail: { type: string, nullable: true }
                issued_date: { type: string, format: date }
      responses:
        "201":
          description: License created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400":
          description: >
            invalid_license_type (unknown license_type_id) or
            invalid_other_detail (other_detail missing for "Otra", or
            given for a type that isn't "Otra").
        "403": { description: Only admin can assign a license. }
        "409":
          description: not_active_member — this person doesn't currently have an open membership period.

  /licenses/{id}:
    patch:
      summary: Correct a license
      description: >
        Admin-only. Unlike POST, this doesn't re-check that the person
        currently has an open membership period — it's fixing an
        existing record, not assigning a new one, so it also works for
        someone who has since left the club. Same license_type_id /
        other_detail rule as creating one.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license_type_id, issued_date]
              properties:
                license_type_id: { type: integer }
                other_detail: { type: string, nullable: true }
                issued_date: { type: string, format: date }
      responses:
        "200":
          description: Updated license
          content:
            application/json:
              schema: { $ref: "#/components/schemas/License" }
        "400":
          description: >
            invalid_license_type (unknown license_type_id) or
            invalid_other_detail (other_detail missing for "Otra", or
            given for a type that isn't "Otra").
        "403": { description: Only admin can correct a license. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a license
      description: Admin-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Only admin can remove a license. }
        "404": { $ref: "#/components/responses/NotFound" }

  /license-types:
    get:
      summary: List the federative license name catalog
      description: >
        Admin-only, matching POST /users/{login}/licenses: the catalog
        only exists to populate that form. Kept in the database rather
        than a fixed set in code, since the list of valid names (new
        zones, new federations) can grow over time. is_other flags the
        "Otra" escape-hatch entry.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The license type catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LicenseType" }

  /memberships:
    get:
      summary: List members whose membership is active today
      description: admin/board — read-only.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Active memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Membership" }

  /memberships/{id}:
    patch:
      summary: Correct a membership period's dates (or end it)
      description: >
        Admin-only. start_date is always required and replaces the
        current value. end_date likewise always replaces the current
        value: give a date to end the period, or omit/null it to leave
        the period open — including reopening one that was ended by
        mistake. end_reason is a true partial update: omit it to leave
        it as is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
                end_reason: { type: string, nullable: true }
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "403": { description: Only admin can correct a membership period. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The corrected dates overlap another period for this person.

  /users/{login}/board-members:
    get:
      summary: List a person's board (Junta Directiva) terms
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Board term history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardMember" }
    post:
      summary: Start a new board term
      description: >
        Admin-only. The automatic "board" role (see the User schema) is
        computed from whoever currently has an open term here — there's
        no other way to grant it. Rejected if this person already has an
        open (or overlapping) term, whatever the position: nobody holds
        two board terms at once.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, start_date]
              properties:
                position: { $ref: "#/components/schemas/BoardPosition" }
                start_date: { type: string, format: date }
      responses:
        "201":
          description: Board term created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
        "403": { description: Only admin can start a board term. }
        "409":
          description: Overlaps an existing board term for this person.

  /board-members:
    get:
      summary: List the current Junta Directiva
      description: >
        Open to admin, board, and plain members alike — anyone signed in
        can see who's currently on the board, their cargo, and how to
        reach them (email/phone, joined in from the person's own
        profile).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Everyone with an open board term today, across every position
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardMember" }

  /board-members/{id}:
    patch:
      summary: Correct a board term's position or dates (or end it)
      description: >
        Admin-only. position and start_date are always required and
        replace the current values. end_date likewise always replaces
        the current value: give a date to end the term, or omit/null it
        to leave it open — including reopening one that was ended by
        mistake.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [position, start_date]
              properties:
                position: { $ref: "#/components/schemas/BoardPosition" }
                start_date: { type: string, format: date }
                end_date: { type: string, format: date, nullable: true }
      responses:
        "200":
          description: Updated board term
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BoardMember" }
        "403": { description: Only admin can correct a board term. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The corrected dates overlap another board term for this person.

  /memberships/{membershipID}/leaves:
    get:
      summary: List a membership period's temporary leaves
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: membershipID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Temporary leaves for this period
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Leave" }
    post:
      summary: Record a temporary leave ("baja temporal")
      description: >
        Admin-only. Unlike a membership period, both dates are required
        up front — a temporary leave is a bounded, planned thing. It
        must fall entirely within its membership period's dates.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: membershipID, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, nullable: true }
      responses:
        "201":
          description: Leave created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leave" }
        "403": { description: Only admin can record a temporary leave. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Either outside_membership_period (the dates aren't fully
            contained within the membership period) or overlapping_period
            (they overlap another leave in the same period) — see the
            error code.

  /leaves/{id}:
    patch:
      summary: Correct a temporary leave's dates or reason
      description: >
        Admin-only. start_date and end_date are always required and
        replace the current values; the containment check against the
        membership period runs again on every correction. reason is a
        true partial update: omit it to leave it as is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_date, end_date]
              properties:
                start_date: { type: string, format: date }
                end_date: { type: string, format: date }
                reason: { type: string, nullable: true }
      responses:
        "200":
          description: Updated leave
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Leave" }
        "403": { description: Only admin can correct a temporary leave. }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: outside_membership_period or overlapping_period — see the error code.
    delete:
      summary: Remove a temporary leave
      description: Admin-only.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /activities:
    get:
      summary: List activities
      description: >
        Defaults to every activity (paginated, newest first). Pass
        status=active to instead get only the ones still needing
        attention: not yet completed/cancelled, or completed but still
        with a loan/rental linked to it that hasn't been returned — the
        practical "what matters right now" view once years of history
        pile up. Pass order=asc to sort oldest-first instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active] }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: asc sorts oldest-first; anything else (including omitted) is newest-first.
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: A page of activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
    post:
      summary: Create an activity
      description: >
        Any authenticated person can create an activity (there's no role
        restriction here, unlike update/cancel) and sign up its initial
        participants in the same call. The organizer (leader_login)
        defaults to the caller; admin/board can instead name someone
        else via leader_login in the request body — anyone else who
        tries gets a 403.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateActivityInput" }
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "400":
          description: One of the given participant_logins doesn't exist.
        "403":
          description: leader_login was given by someone who isn't admin/board.
        "404":
          description: leader_login doesn't belong to anyone.
        "409":
          description: >
            not_federated — the activity is caving or canyoning and one of
            the given participant_logins isn't currently federated.

  /activities/{id}:
    get:
      summary: Fetch a single activity
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update an activity
      description: >
        Only the activity's organizer (leader_login), or admin/board, may
        update it — anyone else gets a 403. leader_login itself
        (reassigning the organizer) is narrower still: admin/board
        only, even for the current organizer.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateActivityInput" }
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Activity" }
        "403":
          description: >
            forbidden — not the organizer, board, or admin; or
            leader_login was given by someone who isn't admin/board.
        "404":
          description: The activity doesn't exist, or leader_login doesn't belong to anyone.
    delete:
      summary: Cancel an activity
      description: >
        Only the activity's organizer (leader_login), or admin/board, may
        cancel it — anyone else gets a 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Activity cancelled }
        "403": { description: Only the organizer, board, or admin can cancel this activity. }
        "404": { $ref: "#/components/responses/NotFound" }

  /activities/{id}/participants:
    get:
      summary: List an activity's participants
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Participants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Participant" }
    post:
      summary: Join an activity, or (admin/board, or the organizer) add someone else to it
      description: >
        On a public activity: with no body (or a null/omitted login)
        signs up the caller; a plain member naming anyone other than
        themselves gets a 403; admin/board can name any login to add
        them on that person's behalf. On a private activity, only the
        organizer, board, or admin may call this at all — even to sign up
        the caller themselves; anyone else gets a 403 regardless of whose
        login they name. If the activity's type is caving or canyoning,
        the person being added must currently hold a valid federative
        license, or the call is rejected with 409 not_federated.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                login: { type: string, nullable: true }
      responses:
        "204": { description: Joined }
        "403":
          description: >
            A plain member tried to add someone other than themselves to
            a public activity, or anyone other than the organizer/board/
            admin tried to add a participant (self included) to a private
            one.
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            not_federated — the activity is caving or canyoning and the
            person being added isn't currently federated.

  /activities/{id}/participants/{login}:
    delete:
      summary: Leave an activity
      description: >
        A member can only remove themselves; admin/board can remove anyone.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { description: A plain member tried to remove someone other than themselves. }

  /activities/{id}/resources:
    get:
      summary: List an activity's memoria
      description: >
        Every resource contributed to this activity's write-up, in
        memoria order (ActivityResource.position — see PUT
        .../resources/order). Open to any baseline role, same as the
        rest of an activity's own data — not restricted to whoever took
        part in it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: This activity's resources, in memoria order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityResource" }
    post:
      summary: Add a resource to an activity's memoria
      description: >
        Requires admin, board, this activity's own organizer, or anyone
        who took part in it (activity_participants, any role) — a plain
        member with no connection to the activity gets 403. Always
        multipart/form-data, never plain JSON, since a file resource has
        to carry an actual upload: type (text|file), title (both),
        description (text only), file (file only, capped at 25 MiB). A
        text resource is simply a multipart request with no file part in
        it, rather than a separate endpoint per type. content_type is
        taken from the upload itself (falling back to guessing from the
        filename's extension, then application/octet-stream), never
        given by the caller directly; position is always appended after
        whatever the activity's current highest one is.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, title]
              properties:
                type: { type: string, enum: [text, file] }
                title: { type: string }
                description: { type: string, description: Required for type=text; rejected for type=file. }
                file: { type: string, format: binary, description: Required for type=file; rejected for type=text. }
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResource" }
        "400":
          description: >
            invalid_type, title_required, description_required (type=text
            with no description), or file_required (type=file with no
            file part).
        "403": { description: Neither admin/board, the organizer, nor a participant. }
        "404": { description: Activity not found. }
        "413": { description: file_too_large — over the 25 MiB limit. }

  /activities/{id}/resources/order:
    put:
      summary: Reorder an activity's memoria
      description: >
        Replaces the whole memoria's order in one call — send every
        resource id currently in this activity's memoria, in the new
        order; resource_ids must be exactly that activity's current set
        (same members, no more, no fewer) or the call is rejected rather
        than silently dropping or ignoring stray ids, so a client working
        from a stale list has to reload and retry instead of clobbering
        positions with an order that no longer matches what's actually
        there. Same access as POST .../resources (organizer, participant,
        or admin/board).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resource_ids]
              properties:
                resource_ids:
                  type: array
                  items: { type: integer }
      responses:
        "200":
          description: This activity's resources, in their new memoria order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityResource" }
        "403": { description: Neither admin/board, the organizer, nor a participant. }
        "404": { description: Activity not found. }
        "409": { description: reorder_mismatch — resource_ids doesn't match this activity's current resources exactly. }

  /activities/{id}/resources/{resourceID}:
    get:
      summary: Get one memoria resource
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: The resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResource" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Edit a memoria resource's title or description
      description: >
        Requires this resource's own author, or admin/board — a
        participant who didn't contribute this particular resource can't
        edit it, even though they could contribute their own. Only
        title (either type) and description (text type only) can be
        changed; there's no way to replace a file resource's actual
        bytes through this endpoint — delete it and add a new one
        instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResource" }
        "400": { description: description_not_allowed — description given for a type=file resource. }
        "403": { description: Neither this resource's own author nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Remove a memoria resource
      description: >
        Requires this resource's own author, or admin/board — same
        restriction as PATCH. Removes the file from disk too, for a
        type=file resource.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "403": { description: Neither this resource's own author nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /activities/{id}/resources/{resourceID}/file:
    get:
      summary: Read or download a memoria resource's file
      description: >
        Streams a type=file resource's raw bytes — not_a_file for a
        type=text resource, which never has one. Same
        inline-by-default/?download=1/Content-Type behavior as
        GET /library/file and GET /users/{login}/files/file, open to any
        baseline role (same as GET .../resources above).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: resourceID, in: path, required: true, schema: { type: integer } }
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", sets Content-Disposition to attachment (a Save dialog) instead of inline.
      responses:
        "200": { description: The file's raw content. }
        "400": { description: not_a_file — this resource is type=text. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/activities:
    get:
      summary: List a person's activity history
      description: >
        Every activity where this person is either the leader or a
        participant, most recent first. Open to any signed-in baseline
        user, not just admin/board or the person themselves — who took
        part in an activity is already visible to anyone via GET
        /activities/{id}/participants, so this is the same information
        viewed from the other direction.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: This person's activities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }

  /holidays:
    get:
      summary: List club holidays
      description: >
        Backs the activities calendar view, which marks these alongside
        weekends (computed client-side from the date, no table needed
        for those). Open to any baseline role — not sensitive.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: year
          in: query
          schema: { type: integer }
          description: Defaults to every year on file when omitted.
      responses:
        "200":
          description: Holidays
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Holiday" }
    post:
      summary: Add a holiday
      description: Requires the admin or board role.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date }
                name: { type: string }
      responses:
        "201":
          description: Holiday created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Holiday" }
        "400": { description: invalid_date, or invalid_name (empty). }
        "409": { description: duplicate_holiday — that date already has one. }

  /holidays/{id}:
    delete:
      summary: Remove a holiday
      description: >
        Requires the admin or board role. There's no update endpoint —
        correcting one is just deleting and re-adding it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Holiday deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/movements:
    get:
      summary: List a person's material movement history
      description: >
        Every purchase, rental and loan this person has ever made,
        regardless of status (acquisition/loss/abandonment/retirement
        movements have no recipient, so they never appear here). The
        person themselves can view their own; anyone else needs admin,
        board, or the material role — a movement can carry a price, so
        it's treated like GET /movements rather than activity
        participation.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: This person's movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }
        "403": { description: Neither the person themselves nor admin/board/material. }

  /users/{login}/files:
    get:
      summary: List a directory inside a person's own files
      description: >
        Browses this person's own personal documents (a scanned DNI, a
        signed waiver, medical paperwork...) — a plain directory tree on
        disk (config.UserFilesRoot), one subdirectory per login, not
        anything stored in the database. Unlike GET /library, this is
        *not* open to every baseline role: only the person themselves,
        or admin/board, may browse it (403 forbidden otherwise) — a
        login that doesn't belong to anyone at all is 404 instead. path
        defaults to that person's own root when omitted; every path is
        resolved and checked against that root server-side, so one that
        tries to escape it (a "..", an absolute path, a symlink pointing
        outside) either lands back inside it or is rejected — see the
        UserFileListing schema and 400 invalid_path below. Dotfiles are
        never listed. A person with no subdirectory of their own yet —
        the common case, until someone drops a file in for them — gets
        an empty listing at their own root rather than a 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Slash-separated path, relative to this person's own root.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserFileListing" }
        "400":
          description: invalid_path (escapes this person's own root) or not_a_directory (path names a file).
        "403": { description: Neither the person themselves nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{login}/files/file:
    get:
      summary: Read or download one of a person's own files
      description: >
        Streams a document's raw bytes with a best-effort Content-Type,
        same as GET /library/file — supports HTTP Range requests, and
        the same path resolution, root confinement, and
        self-or-admin/board access check as GET /users/{login}/files.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: login, in: path, required: true, schema: { type: string } }
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Slash-separated file path, relative to this person's own root.
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", sets Content-Disposition to attachment (a Save dialog) instead of inline.
      responses:
        "200":
          description: The file's raw content.
        "400":
          description: invalid_path (escapes this person's own root) or not_a_file (path names a directory).
        "403": { description: Neither the person themselves nor admin/board. }
        "404": { $ref: "#/components/responses/NotFound" }

  /items:
    get:
      summary: List inventory items
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Item" }
    post:
      summary: Add an item to the catalog
      description: Requires the admin or board role.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateItemInput" }
      responses:
        "201":
          description: Item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400":
          description: >
            invalid_item_type, invalid_date, unknown_category
            (category_id isn't in the catalog), or single_unit_item
            (total_quantity above 1 for a rope or bag — they're always
            exactly one individually-tracked object).

  /material-categories:
    get:
      summary: List the gear category catalog
      description: >
        Requires the admin or board role, matching POST /items: the
        catalog only exists to populate the "new item" form's category
        picker for gear items.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaterialCategory" }

  /items/{id}/movements:
    get:
      summary: List an item's movement history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Movements for this item
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }

  /movements:
    get:
      summary: List movements (defaults to active ones, or by activity)
      description: >
        Requires the admin, board, or material role. With no
        activity_id, lists by status (default active — in practice only
        ever rentals, since loan/return always settle immediately).
        With activity_id, lists every movement tied to that activity
        instead (status is ignored) — chiefly loan and return, which is
        what the activity page's own material listing is built from,
        computing what's still outstanding item by item client-side.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: activity_id, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Movements
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movement" }
    post:
      summary: Record a movement against an item
      description: >
        Requires the admin, board, or material role. rental exchanges
        the item with a specific person and requires login; loan,
        sale and return's logins are optional — a loan or return's
        mandatory link is the activity it's part of (see activity_id
        below), not necessarily one specific person, and not every sale
        is tied to a socio either. acquisition (new stock in), loss,
        abandonment and retirement (stock permanently gone with no sale
        behind it, or gear taken out of service) never have a recipient
        at all — giving one is rejected (recipient_not_allowed), not
        just ignored. activity_id is required for loan and return
        (optional for everything else, rental included — a rental isn't
        always tied to one specific activity the way a loan always is).
        return isn't linked to any one specific loan row — it's
        validated against how much of that item this activity still has
        outstanding overall (every loan minus every return, for that
        item and activity together): lending 10 then 15 more, then
        returning 20 followed by the remaining 5, is a perfectly valid
        sequence. recorded_by_login (the caller) is set automatically,
        never chosen by the caller — same for price, which always comes
        from the item's own rental_price_per_week/sale_price (null
        except for rental/sale), never from the request body. quantity
        is forced to 1 for a rope or bag item, since they're
        individually tracked (always exactly one unit); acquisition is
        rejected outright for them (single_unit_item) — a new rope or
        saca is a new item, not more stock on an existing one.
        total_quantity/available_quantity/outstanding_loan_quantity on
        the item are always recomputed from its movement history, never
        stored, so they can never drift from what this endpoint
        actually recorded.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [item_id, type]
              properties:
                item_id: { type: integer }
                login:
                  type: string
                  description: >
                    The movement's recipient. Required for rental;
                    optional for loan/sale/return; rejected outright
                    (recipient_not_allowed) for acquisition/loss/
                    abandonment/retirement.
                type: { type: string, enum: [loan, rental, sale, acquisition, loss, abandonment, retirement, return] }
                quantity: { type: integer, default: 1, description: Forced to 1 for a rope or bag item. }
                transacted_at: { type: string, format: date, description: Defaults to today; can be backdated. }
                activity_id:
                  type: integer
                  nullable: true
                  description: Required for loan and return; optional otherwise.
                notes:
                  type: string
                  nullable: true
                  description: >
                    Free text, mainly useful on loss/abandonment/
                    retirement to say why.
      responses:
        "201":
          description: Movement created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movement" }
        "400":
          description: >
            invalid_type, login_required (rental without a login),
            recipient_not_allowed (a login given for
            acquisition/loss/abandonment/retirement), or
            activity_required (loan or return without activity_id).
        "404":
          description: The given login doesn't belong to anyone.
        "409":
          description: >
            insufficient_stock (not enough available quantity),
            not_loanable (the item's loanable flag is false) for a
            loan, single_unit_item (an acquisition against a rope or
            bag item), or return_exceeds_loaned (a return larger than
            what this item still has outstanding for this activity).

  /movements/{id}/return:
    patch:
      summary: Record a return against an active rental
      description: >
        Requires the admin, board, or material role. Closes an active
        rental — the only type that still reaches status active (every
        other type, loan included, settles the moment it's recorded) —
        always all of it at once; there's no partial rental return. A
        loan's return is a separate 'return' movement instead
        (POST /movements, type return), validated per item and activity
        rather than closing any one loan row. Returning anything else —
        or an unknown id, or an already-closed movement — is reported
        the same way: not_found.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Updated movement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movement" }
        "404":
          description: not_found — no active rental with this id.

  /library:
    get:
      summary: List a document library directory
      description: >
        Browses the club's document library (estatutos, reglamentos,
        normativas, memorias de actividades, actas...) — a plain
        directory tree on disk (config.LibraryRoot), not anything stored
        in the database. Open to any baseline role (admin/board/member),
        read-only: there's no way to upload, rename, or delete anything
        through this API. path defaults to the library's root when
        omitted; every path is resolved and checked against root
        server-side, so one that tries to escape it (a "..", an absolute
        path, a symlink pointing outside) either lands back inside root
        or is rejected — see the Listing schema and 400 invalid_path
        below. Dotfiles are never listed.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: path
          in: query
          schema: { type: string, default: "" }
          description: Slash-separated, root-relative directory path.
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryListing" }
        "400":
          description: invalid_path (escapes root) or not_a_directory (path names a file).
        "404": { $ref: "#/components/responses/NotFound" }

  /library/file:
    get:
      summary: Read or download a document
      description: >
        Streams a document's raw bytes with a best-effort Content-Type
        (registered explicitly for a few extensions — .md, .docx, .odt...
        — Go's mime package and the API image's minimal /etc/mime.types
        don't otherwise agree on) so the frontend can either render it
        itself (Markdown) or hand it to the browser (PDF, image, HTML).
        Supports HTTP Range requests. Same path resolution and root
        confinement as GET /library.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Slash-separated, root-relative file path.
        - name: download
          in: query
          schema: { type: string, enum: ["1"] }
          description: When "1", sets Content-Disposition to attachment (a Save dialog) instead of inline.
      responses:
        "200":
          description: The file's raw content.
        "400":
          description: invalid_path (escapes root) or not_a_file (path names a directory).
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        An opaque session token issued by POST /auth/magic-link/consume,
        not a JWT — it carries no information of its own, so the API
        looks it up (and its holder's current roles) on every request.

  responses:
    Unauthorized:
      description: Missing or invalid credentials
    NotFound:
      description: Resource not found

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }

    Gender:
      type: string
      enum: [male, female]
      nullable: true
      description: Not recorded at all unless set explicitly — nullable, no default.

    Token:
      type: object
      description: >
        A session token as an admin sees it — never the token value
        itself, only its metadata (see GET /users/{login}/tokens).
      properties:
        id: { type: integer }
        user_login: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        last_used_ip:
          type: string
          nullable: true
          description: >
            X-Forwarded-For if present (the production deploy sits behind
            a reverse proxy), otherwise the raw connection address.
            Purely informational.
        impersonated_by_login:
          type: string
          nullable: true
          description: >
            The admin who started this session via
            POST /users/{login}/impersonate, if it is one — absent for a
            normal token.

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system:
          type: boolean
          description: >
            admin/board/member/former_member — wired to real permissions
            or automatic behavior, can't be deleted.
        is_automatic:
          type: boolean
          description: >
            member/former_member/board: computed from whether the person
            has a currently active (member) or a past but not current
            (former_member) membership period, or a currently open board
            term (board). Can't be granted or revoked through
            POST/DELETE /users/{login}/roles — those return 409
            automatic_role.

    User:
      type: object
      properties:
        login:
          type: string
          description: >
            This person's sole identifier anywhere in the API — a unique
            slug (e.g. "maria.garcia") generated from their name when
            created, and admin-editable afterward via PATCH.
        first_name: { type: string }
        last_name: { type: string }
        national_id: { type: string, nullable: true }
        birth_date: { type: string, format: date, description: "Required — every person on file needs one." }
        gender: { $ref: "#/components/schemas/Gender" }
        email:
          type: string
          nullable: true
          description: >
            One or more email addresses, space-separated, or absent
            entirely. Signing in and a magic link going out both work
            against any one of them; someone with none on file can never
            receive a magic link, the same way someone with no phone
            already couldn't. An individual address still can't belong
            to two different people, even as one of several on the same
            record.
        phone:
          type: string
          nullable: true
          description: >
            One or more phone numbers, space-separated — so each number
            itself can't contain a space (write "600111222", not
            "600 111 222"; other punctuation like dashes is fine).
            Matched the same way as email for signing in.
        address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        emergency_contact: { type: string, nullable: true, description: "Free text: one or more names, phones, emails..." }
        roles:
          type: array
          items: { type: string }
          description: >
            Role names this person holds. admin/board/member are the system
            roles the API actually grants permissions to; any other name is
            an admin-defined organizational label. Manage membership via
            POST/DELETE /users/{login}/roles, not this field.
        last_login_at:
          type: string
          format: date-time
          nullable: true
          description: When this person last completed a magic-link sign-in.
        last_login_ip:
          type: string
          nullable: true
          description: >
            Where from, at that same sign-in: the first X-Forwarded-For
            entry if the request had one (the production deploy sits
            behind a reverse proxy that sets it), otherwise the
            connection's own address. Informational only.
        membership_number:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Identifies this person for as long as they're associated with
            the club, not any single membership period — leaving and
            rejoining keeps the same number. Read-only here: assigned
            automatically, one past the current highest, the first time
            someone gets an alta via POST /users/{login}/memberships —
            not settable through POST/PATCH /users.
        membership_start_date:
          type: string
          format: date
          nullable: true
          description: >
            Start date of this person's *first* membership period ever,
            or null if they've never been a member. Someone who left and
            rejoined has more than one period; this is always the
            earliest one, not the latest rejoin. See
            GET /users/{login}/memberships for the full history.
        membership_end_date:
          type: string
          format: date
          nullable: true
          description: >
            End date of this person's most recent membership period (not
            necessarily the same period membership_start_date comes
            from), or null if it's still open (they're currently a
            member).
        on_leave:
          type: boolean
          description: >
            Whether today falls within one of this person's temporary leave
            windows. Only ever true alongside a currently-active membership
            (null membership_end_date) — a leave doesn't end the period it
            belongs to, so this is the only way to tell "activo" apart from
            "baja temporal". Read-only here — set through
            POST /memberships/{membershipID}/leaves and
            PATCH/DELETE /leaves/{id}.
        license_type: { type: string, nullable: true }
        license_issued_date: { type: string, format: date, nullable: true }
        license_valid_until:
          type: string
          format: date
          nullable: true
          description: >
            Together, license_* reflect this person's most recently
            issued federative license (December 31 of license_issued_date's
            year), or all null if they've never had one. Read-only here —
            not settable through PATCH /users/{login}, only through
            POST /users/{login}/licenses. See GET /users/{login}/licenses
            for the full history.
        created_at: { type: string, format: date-time }

    MemberListing:
      type: object
      description: >
        What GET /users returns to a caller who's a plain member (not
        admin or board) — for every person who is or has been a socio,
        not just themselves (someone with no membership period at all
        is left out of this listing entirely — see GET /users). Just
        enough to see who's a socio, since when, to whom, whether
        they're currently on a temporary leave, and which roles/cargo
        they hold; everything else User exposes (DNI, address, contact
        info, license...) is left out entirely.
      properties:
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        gender: { $ref: "#/components/schemas/Gender" }
        age_category:
          type: string
          enum: [child, teen, adult]
          description: >
            A coarse age bracket computed from birth_date (child up to 13,
            teen 14-17, adult 18+, based on the age turned this calendar
            year) — stands in for the exact birth_date, which isn't
            exposed here.
        membership_number: { type: integer, minimum: 0, nullable: true }
        membership_start_date: { type: string, format: date, nullable: true }
        membership_end_date: { type: string, format: date, nullable: true }
        on_leave:
          type: boolean
          description: Same meaning as User.on_leave — only ever true alongside a currently-active membership.
        roles:
          type: array
          items: { type: string }
          description: Same role names as User.roles.

    DirectoryEntry:
      type: object
      properties:
        login: { type: string }
        first_name: { type: string }
        last_name: { type: string }

    CreateUserInput:
      allOf:
        - $ref: "#/components/schemas/UpdateUserInput"
        - type: object
          required: [first_name, last_name, birth_date]
          properties:
            birth_date: { type: string, format: date, description: "Required — see the User schema." }
            role_names:
              type: array
              items: { type: string }
              description: >
                Optional, empty by default. Can't include "member" or
                "former_member" — those are automatic, computed from
                membership history instead.

    UpdateUserInput:
      description: >
        Every field is optional and independently settable, but who can
        set which ones isn't uniform anymore: admin can set any of them
        on anyone. Anyone else can only PATCH their own record, and even
        then only the contact fields — email, phone, address,
        postal_code, city, province, emergency_contact — not
        first_name/last_name/national_id/birth_date/gender/login, which
        get the whole request rejected with 403 restricted_fields instead
        of being silently dropped.
      type: object
      properties:
        login:
          type: string
          description: >
            Admin-only to change. Must be lowercase letters, digits,
            dots, or hyphens; auto-generated at creation and otherwise
            left alone.
        first_name: { type: string, description: "Admin-only to change." }
        last_name: { type: string, description: "Admin-only to change." }
        email: { type: string, nullable: true, description: "One or more addresses, space-separated — see the User schema." }
        national_id: { type: string, nullable: true, description: "Admin-only to change." }
        birth_date: { type: string, format: date, description: "Admin-only to change." }
        gender: { allOf: [{ $ref: "#/components/schemas/Gender" }], description: "Admin-only to change." }
        phone: { type: string, nullable: true, description: "One or more numbers, space-separated — see the User schema." }
        address: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        city: { type: string, nullable: true }
        province: { type: string, nullable: true }
        emergency_contact: { type: string, nullable: true, description: "Free text: one or more names, phones, emails..." }

    Membership:
      type: object
      properties:
        id: { type: integer }
        user_login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }
        end_reason: { type: string, nullable: true }

    Leave:
      type: object
      description: >
        A "baja temporal": a bounded window within a membership period
        where the person steps away for a while without actually leaving
        the club.
      properties:
        id: { type: integer }
        membership_id: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reason: { type: string, nullable: true }

    LicenseType:
      type: object
      description: >
        One entry in the license name catalog (see GET /license-types),
        stored in the database rather than a fixed set in code so the
        list of valid names can grow without a deploy.
      properties:
        id: { type: integer }
        name: { type: string }
        is_other:
          type: boolean
          description: >
            True only for the catalog's "Otra" escape hatch — assigning
            a license with this type requires other_detail.

    License:
      type: object
      description: >
        A federative license ("licencia federativa"). Annual: valid from
        issued_date through December 31 of that same year.
      properties:
        id: { type: integer }
        user_login: { type: string }
        license_type_id: { type: integer }
        type:
          type: string
          description: >
            Human-readable label: the catalog's LicenseType.name, or
            "<name>: <other_detail>" when license_type_id is "Otra".
        other_detail:
          type: string
          nullable: true
          description: Only set when license_type_id is the catalog's "Otra" entry.
        issued_date: { type: string, format: date }
        valid_until:
          type: string
          format: date
          description: Computed as December 31 of issued_date's year — never set directly.

    BoardPosition:
      type: string
      enum: [president, vice_president, secretary, treasurer, member_at_large]
      description: >
        Cargos of the Junta Directiva. member_at_large is "vocal" — unlike
        the other four, a club can have several of these open at once.

    BoardMember:
      type: object
      description: >
        One person's term in one board position. Whoever currently has an
        open term here holds the automatic "board" role (see the User
        schema) — nobody grants or revokes it by hand.
      properties:
        id: { type: integer }
        user_login: { type: string }
        first_name: { type: string }
        last_name: { type: string }
        position: { $ref: "#/components/schemas/BoardPosition" }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, nullable: true }

    Activity:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        type: { type: string, enum: [caving, canyoning, training, social, other] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        description: { type: string, nullable: true }
        status: { type: string, enum: [planned, completed, cancelled] }
        leader_login:
          type: string
          description: >
            The organizer: defaults to whoever created the activity, but
            admin/board can choose someone else at creation time or
            reassign it later (see POST/PATCH). The current organizer is
            the only one besides admin/board who can update or cancel
            the activity, but can't reassign it themselves.
        visibility:
          type: string
          enum: [public, private]
          description: >
            public (the default) works as activities always have: anyone
            can join themselves, and admin/board can add anyone else.
            private restricts who can add a participant *at all* — only
            the organizer, board, or admin — even to sign up someone who
            already wants in. See POST /activities/{id}/participants.

    CreateActivityInput:
      type: object
      required: [title, start_date, end_date]
      properties:
        title: { type: string }
        type: { type: string, enum: [caving, canyoning, training, social, other], default: caving }
        start_date: { type: string, format: date }
        end_date:
          type: string
          format: date
          description: Must not be earlier than start_date.
        description: { type: string, nullable: true }
        visibility: { type: string, enum: [public, private], default: public }
        participant_logins:
          type: array
          items: { type: string }
          description: >
            Signed up as participants in the same call that creates the
            activity. If type is caving or canyoning, every one of them
            must currently hold a valid federative license, or the whole
            call is rejected with 409 not_federated.
        leader_login:
          type: string
          description: >
            The organizer. Defaults to the caller; naming anyone else
            here is admin/board only (403 otherwise).

    UpdateActivityInput:
      type: object
      properties:
        title: { type: string }
        type: { type: string, enum: [caving, canyoning, training, social, other] }
        start_date: { type: string, format: date }
        end_date:
          type: string
          format: date
          description: Must not be earlier than start_date (or the resulting start_date, if both are sent together).
        description: { type: string, nullable: true }
        status: { type: string, enum: [planned, completed, cancelled] }
        visibility: { type: string, enum: [public, private] }
        leader_login:
          type: string
          description: >
            Reassigns the organizer. admin/board only — even the
            current organizer can't change this on their own activity
            (403 otherwise).

    Participant:
      type: object
      properties:
        activity_id: { type: integer }
        user_login: { type: string }
        role: { type: string, enum: [leader, participant] }
        confirmed: { type: boolean }

    Holiday:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        name: { type: string }

    ActivityResource:
      type: object
      description: >
        One entry in an activity's memoria — either a text entry
        (description set, file fields absent) or an uploaded file
        (file_name/file_size/content_type set, description absent),
        never a mix of both; the database's own CHECK constraints
        (migration 00018) are the actual source of truth for that, not
        this schema.
      properties:
        id: { type: integer }
        activity_id: { type: integer }
        type: { type: string, enum: [text, file] }
        author_login:
          type: string
          description: Whoever contributed this resource — not necessarily the activity's own organizer.
        title: { type: string }
        description: { type: string, nullable: true, description: type=text only. }
        file_name: { type: string, nullable: true, description: type=file only — the original uploaded filename. }
        file_size: { type: integer, nullable: true, description: type=file only, in bytes. }
        content_type: { type: string, nullable: true, description: type=file only. }
        position:
          type: integer
          description: >
            This resource's place in the memoria page, a dense 1..N per
            activity — see PUT /activities/{id}/resources/order.
        created_at:
          type: string
          format: date-time
          description: When this resource was added. Fixed at creation — there's no way to backdate or edit it afterward.

    MaterialCategory:
      type: object
      description: >
        One entry in the gear category catalog (see GET
        /material-categories) — mosquetones, spits, placas, maillones,
        iluminación... kept in the database rather than a fixed enum, so
        the list can grow with an INSERT instead of a code deploy.
      properties:
        id: { type: integer }
        name: { type: string }

    Item:
      type: object
      description: >
        rope and bag are individually tracked physical objects — brand,
        model and code are always known, total_quantity is always 1, and
        they carry type-specific fields (rope_type/diameter_mm/
        manufacture_year/length_m for rope, bag_type/capacity_liters for bag —
        bag_type extends rope_type's caving/canyoning split with two
        purpose-based kinds, quick and special). gear is a
        fungible stock item filed under a category from
        GET /material-categories; brand/model may be unknown, but
        description and category_id are always set. rentable/sellable
        are computed from whether rental_price_per_week/sale_price is
        set — loanable is a separate flag, since a loan carries no price
        to derive that from. total_quantity/available_quantity/
        outstanding_loan_quantity are always computed from this item's
        own movement history (see GET /items/{id}/movements) rather
        than stored, so there's no acquired_at here either — it's the
        transacted_at of the item's first acquisition movement, visible
        in that same history.
      properties:
        id: { type: integer }
        item_type: { type: string, enum: [rope, bag, gear] }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        code: { type: string, nullable: true }
        description:
          type: string
          nullable: true
          description: >
            Required for gear. Doubles as "Observaciones" in the
            frontend for rope/bag, where it's optional.
        total_quantity: { type: integer, description: "Computed from this item's movement history — never stored." }
        available_quantity:
          type: integer
          description: >
            Computed from this item's movement history — never stored.
            Already reflects any outstanding loan and any open rental,
            same as every other stock-reducing movement.
        outstanding_loan_quantity:
          type: integer
          description: >
            How much of this item is currently out on some loan, across
            every activity, with nothing (yet) returned against it —
            every loan minus every return. What "material prestado" is
            built from.
        status: { type: string, enum: [available, on_loan, rented, sold, lost, abandoned, maintenance, retired] }
        loanable: { type: boolean }
        rentable: { type: boolean, description: "Computed: true iff rental_price_per_week is set." }
        sellable: { type: boolean, description: "Computed: true iff sale_price is set." }
        rental_price_per_week: { type: number, nullable: true }
        sale_price: { type: number, nullable: true }
        rope_type: { type: string, enum: [caving, canyoning], nullable: true, description: "rope only." }
        diameter_mm: { type: number, nullable: true, description: "rope only, in millimetres." }
        manufacture_year: { type: integer, nullable: true, description: "rope only." }
        length_m: { type: integer, nullable: true, description: "rope only, in metres." }
        bag_type: { type: string, enum: [caving, canyoning, quick, special], nullable: true, description: "bag only." }
        capacity_liters: { type: number, nullable: true, description: "bag only." }
        category_id: { type: integer, nullable: true, description: "gear only — an id from GET /material-categories." }
        category_name: { type: string, nullable: true, description: "gear only — resolved alongside category_id." }

    CreateItemInput:
      type: object
      required: [item_type]
      properties:
        item_type: { type: string, enum: [rope, bag, gear] }
        brand: { type: string, description: Required for rope/bag. }
        model: { type: string, description: Required for rope/bag. }
        code: { type: string, description: Required for rope/bag. }
        description: { type: string, description: Required for gear. }
        acquired_at:
          type: string
          format: date
          description: >
            Backdates the item's first (and, for rope/bag, only)
            acquisition movement. Defaults to today.
        total_quantity:
          type: integer
          default: 1
          description: >
            How many units to start with — recorded as the item's
            first acquisition movement. Must be 1 for rope/bag
            (single_unit_item otherwise); more can be added to gear
            later via POST /movements with type acquisition.
        loanable: { type: boolean, default: true }
        rental_price_per_week: { type: number }
        sale_price: { type: number }
        rope_type: { type: string, enum: [caving, canyoning], description: Required for rope. }
        diameter_mm: { type: number, description: "Required for rope, in millimetres." }
        manufacture_year: { type: integer, description: Required for rope. }
        length_m: { type: integer, description: "Required for rope, in metres." }
        bag_type: { type: string, enum: [caving, canyoning, quick, special], description: Required for bag. }
        capacity_liters: { type: number, description: Required for bag. }
        category_id: { type: integer, description: Required for gear — an id from GET /material-categories. }

    Movement:
      type: object
      description: >
        rental exchanges the item with a specific person (user_login
        always set); loan, sale and return's are optional. acquisition
        (new stock in), loss, abandonment and retirement never have a
        recipient at all — user_login is always absent for those. A
        loan's own "returned" state isn't tracked on the loan itself —
        it's the sum of separate return movements against the same item
        and activity (see GET /movements?activity_id=).
      properties:
        id: { type: integer }
        item_id: { type: integer }
        user_login: { type: string, nullable: true, description: "Always set for rental, optionally for loan/sale/return, always absent for acquisition/loss/abandonment/retirement." }
        type: { type: string, enum: [loan, rental, sale, acquisition, loss, abandonment, retirement, return] }
        quantity: { type: integer, description: Always 1 for a rope or bag item. }
        transacted_at: { type: string, format: date, description: Defaults to today at creation; can be backdated. }
        returned_at:
          type: string
          format: date
          nullable: true
          description: >
            When an active rental was closed via PATCH
            .../return — rental only, always all-or-nothing. Always
            null for every other type, loan included.
        price:
          type: number
          nullable: true
          description: >
            Always the item's own rental_price_per_week (rental) or
            sale_price (sale) at the time of the movement; always null
            otherwise.
        status: { type: string, enum: [active, completed, overdue, cancelled], description: "active only for an unreturned rental; every other type, loan included, is completed immediately." }
        recorded_by_login: { type: string, nullable: true }
        activity_id:
          type: integer
          nullable: true
          description: Required for loan and return; optional otherwise, rental included.
        notes:
          type: string
          nullable: true
          description: >
            Free text, mainly useful on loss/abandonment/retirement to
            say why.

    LibraryEntry:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [dir, file] }
        size:
          type: integer
          description: Bytes. Omitted for a directory.
        modified_at: { type: string, format: date-time }

    LibraryListing:
      type: object
      properties:
        path:
          type: string
          description: >
            The requested path, normalized (no leading/trailing slash,
            "" for the root) — echoed back so the frontend can build
            breadcrumbs without re-deriving it from what it originally
            sent.
        entries:
          type: array
          items: { $ref: "#/components/schemas/LibraryEntry" }
          description: Subdirectories first, then files, both alphabetical. Dotfiles never appear.

    UserFileEntry:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [dir, file] }
        size:
          type: integer
          description: Bytes. Omitted for a directory.
        modified_at: { type: string, format: date-time }

    UserFileListing:
      type: object
      properties:
        path:
          type: string
          description: >
            The requested path, root-relative *within this person's own
            files* (never including their login), normalized (no
            leading/trailing slash, "" for their own root) — echoed back
            so the frontend can build breadcrumbs without re-deriving it
            from what it originally sent.
        entries:
          type: array
          items: { $ref: "#/components/schemas/UserFileEntry" }
          description: Subdirectories first, then files, both alphabetical. Dotfiles never appear.
